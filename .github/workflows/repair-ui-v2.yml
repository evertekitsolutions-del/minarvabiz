name: Repair complete desktop UI v2

on:
  push:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply UI, forms, reporting and print repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def rep(s,old,new,label):
              if old not in s: raise SystemExit(f'Missing {label}: {old[:100]!r}')
              return s.replace(old,new,1)
          # Customer fields + birthday.
          p=Path('packages/business-logic/src/store.ts'); s=p.read_text()
          s=rep(s,'address?: string | null; notes?: string | null;','address?: string | null; birthday?: string | null; notes?: string | null;','store.ts')
          s=rep(s,'email: input.email || null, address: input.address ?? null, notes: input.notes ?? null,','email: input.email || null, address: input.address ?? null, birthday: input.birthday ?? null, notes: input.notes ?? null,','store.ts'); p.write_text(s)
          # Expense metadata and staff status.
          p=Path('packages/business-logic/src/phase5-store.ts'); s=p.read_text()
          s=rep(s,'reference?: string | null; orderId?: UUID | null;','reference?: string | null; receiptUrl?: string | null; staffId?: UUID | null; orderId?: UUID | null;','phase5-store.ts')
          s=rep(s,'description: input.description ?? null, reference: input.reference ?? null, orderId: input.orderId ?? null, orderNumber,','description: input.description ?? null, receiptUrl: input.receiptUrl ?? null, staffId: input.staffId ?? null, reference: input.reference ?? null, orderId: input.orderId ?? null, orderNumber,','phase5-store.ts'); p.write_text(s)
          p=Path('packages/business-logic/src/phase6-store.ts'); s=p.read_text()
          s=rep(s,'salary?: number; joiningDate?: string | null; notes?: string | null;','salary?: number; joiningDate?: string | null; status?: StaffStatus; notes?: string | null;','phase6-store.ts')
          s=rep(s,'role: input.role, salary: input.salary ?? 0, joiningDate: input.joiningDate ?? null, status: "active", notes:','role: input.role, salary: input.salary ?? 0, joiningDate: input.joiningDate ?? null, status: input.status ?? "active", notes:','phase6-store.ts'); p.write_text(s)
          # Header callback + calendar popup.
          p=Path('packages/ui/src/components/layout/Header.tsx'); s=p.read_text()
          s=rep(s,'  onNotificationsClick?: () => void;\n  onMessagesClick?: () => void;','  onNotificationsClick?: () => void;\n  onMessagesClick?: () => void;\n  onCalendarClick?: (date: string) => void;','Header.tsx')
          s=rep(s,'  onNotificationsClick,\n  onMessagesClick,\n  onLogout,','  onNotificationsClick,\n  onMessagesClick,\n  onCalendarClick,\n  onLogout,','Header.tsx')
          s=rep(s,'  const [query, setQuery] = React.useState("");\n  const today =','  const [query, setQuery] = React.useState("");\n  const [calendarOpen, setCalendarOpen] = React.useState(false);\n  const [selectedDate, setSelectedDate] = React.useState(() => new Date().toISOString().slice(0,10));\n  const today =','Header.tsx')
          s=s.replace('''        <button\n          type="button"\n          className="rounded-lg p-2 text-slate-500 hover:bg-slate-100"\n          aria-label="Calendar"\n        >''','''        <button type="button" onClick={() => setCalendarOpen((v) => !v)} className="rounded-lg p-2 text-slate-500 hover:bg-slate-100" aria-label="Calendar" title="Open calendar">''',1)
          old='''        <div className="ml-1 hidden items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-sm text-slate-700 sm:flex">\n          <svg className="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">\n            <rect x="3" y="4" width="18" height="18" rx="2" />\n            <path d="M16 2v4M8 2v4M3 10h18" />\n          </svg>\n          <span className="whitespace-nowrap">{today}</span>\n          <svg className="h-3.5 w-3.5 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">\n            <path fillRule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.51a.75.75 0 0 1-1.08 0l-4.25-4.51a.75.75 0 0 1 .02-1.06Z" clipRule="evenodd" />\n          </svg>\n        </div>'''
          new='''        <button type="button" onClick={() => setCalendarOpen((v) => !v)} className="ml-1 hidden items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-sm text-slate-700 sm:flex" title="Open calendar"><svg className="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></svg><span className="whitespace-nowrap">{today}</span><svg className="h-3.5 w-3.5 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fillRule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.51a.75.75 0 0 1-1.08 0l-4.25-4.51a.75.75 0 1 1 1.08 1.06Z" clipRule="evenodd" /></svg></button>{calendarOpen&&<div className="absolute right-4 top-14 z-50 w-72 rounded-2xl border border-slate-200 bg-white p-4 shadow-xl"><div className="mb-2 text-sm font-semibold text-slate-800">Calendar</div><input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} className="h-10 w-full rounded-lg border border-slate-200 px-3 text-sm"/><div className="mt-3 flex gap-2"><button type="button" className="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm" onClick={()=>setSelectedDate(new Date().toISOString().slice(0,10))}>Today</button><button type="button" className="flex-1 rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white" onClick={()=>{onCalendarClick?.(selectedDate);setCalendarOpen(false)}}>Open</button></div></div>}'''
          s=rep(s,old,new,'Header.tsx'); p.write_text(s)
          # POS/customer plus.
          p=Path('packages/ui/src/components/sales/PosBilling.tsx'); s=p.read_text()
          s=rep(s,'  onFindByBarcode?: (barcode: string) => Product | undefined;\n}','  onFindByBarcode?: (barcode: string) => Product | undefined;\n  onAddCustomer?: () => void;\n}','PosBilling.tsx')
          s=rep(s,'export function PosBilling({ products, customers, onCompleteSale, onComplete, onFindByBarcode }: PosBillingProps) {','export function PosBilling({ products, customers, onCompleteSale, onComplete, onFindByBarcode, onAddCustomer }: PosBillingProps) {','PosBilling.tsx')
          s=rep(s,'<select value={customerId} onChange={(e) => setCustomerId(e.target.value)} className="h-10 w-full rounded-lg border border-slate-200 px-3 text-sm"><option value="">Walk-in customer</option>{customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` (${c.phone})` : ""}</option>)}</select>','<div className="flex gap-2"><select value={customerId} onChange={(e) => setCustomerId(e.target.value)} className="h-10 min-w-0 flex-1 rounded-lg border border-slate-200 px-3 text-sm"><option value="">Walk-in customer</option>{customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` (${c.phone})` : ""}</option>)}</select><Button type="button" size="sm" variant="outline" onClick={onAddCustomer}>+</Button></div>','PosBilling.tsx'); p.write_text(s)
          # Order and laundry customer plus.
          p=Path('packages/ui/src/components/orders/OrderForm.tsx'); s=p.read_text(); s=rep(s,'onCancel?: () => void; error?: string | null })','onCancel?: () => void; onAddCustomer?: () => void; error?: string | null })','OrderForm.tsx'); s=rep(s,'<select className={selectClass} value={value.customerId}','<div className="flex gap-2"><select className={selectClass + " min-w-0 flex-1"} value={value.customerId}','OrderForm.tsx'); s=rep(s,'</select></FormField>','</select><Button type="button" size="sm" variant="outline" onClick={onAddCustomer}>+</Button></div></FormField>','OrderForm.tsx'); p.write_text(s)
          p=Path('packages/ui/src/components/laundry/LaundryForm.tsx'); s=p.read_text(); s=rep(s,'  error?: string | null;\n}) {','  error?: string | null;\n  onAddCustomer?: () => void;\n}) {','LaundryForm.tsx'); s=rep(s,'  error,\n}: {','  error,\n  onAddCustomer,\n}: {','LaundryForm.tsx'); s=s.replace('''      <FormField label="Customer *">\n        <select className={selectClass} value={customerId} onChange={(e) => setCustomerId(e.target.value)}>''','''      <FormField label="Customer *"><div className="flex gap-2"><select className={selectClass + " min-w-0 flex-1"} value={customerId} onChange={(e) => setCustomerId(e.target.value)}>''',1); s=s.replace('''        </select>\n      </FormField>''','''        </select><Button type="button" size="sm" variant="outline" onClick={onAddCustomer}>+</Button></div></FormField>''',1); p.write_text(s)

          # Complete reports with client-side CSV and native print/PDF hooks.
          Path('packages/ui/src/components/reports/ReportsPanel.tsx').write_text(r'''"use client";\nimport * as React from "react";\nimport type { SalesReportRow, Customer, Expense, Purchase, ServiceOrder, StaffMember, Payment } from "@minarvabiz/types";\nimport { Button } from "../Button";\nimport { Card, CardContent, CardHeader, CardTitle } from "../Card";\nimport { formatMoney } from "../customers/format";\nexport interface DayEndView { totalSales:number; totalExpenses:number; costOfGoods:number; serviceRevenue:number; serviceExpenses:number; grossProfit:number; netProfit:number; cashReceived:number; cardPayments:number; otherPayments:number; outstandingAmount:number; }\nexport interface StockRow { id:string; name:string; sku?:string|null; stock:number; min:number; value:number; low:boolean; }\ntype Tab="sales"|"dayend"|"stock"|"outstanding"|"customers"|"services"|"expenses"|"purchases"|"staff"|"payments";\nconst out=(v:unknown)=>{const s=String(v??"");return /[",\\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};\nfunction downloadCsv(name:string,rows:unknown[][]){const b=new Blob([rows.map(r=>r.map(out).join(",")).join("\\n")],{type:"text/csv;charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}\nexport function ReportsPanel({salesRows,sales,dayEnd,stock,outstanding,customers=[],expenses=[],purchases=[],orders=[],staff=[],payments=[],onRefresh,onPrint,onPdf}:{salesRows?:SalesReportRow[];sales?:SalesReportRow[];dayEnd:DayEndView;stock:StockRow[];outstanding:Array<{id:string;name:string;phone?:string|null;outstanding:number}>;customers?:Customer[];expenses?:Expense[];purchases?:Purchase[];orders?:ServiceOrder[];staff?:StaffMember[];payments?:Payment[];onRefresh?:()=>void;onPrint?:()=>void;onPdf?:()=>void}){\nconst[tab,setTab]=React.useState<Tab>("sales");const rows=salesRows??sales??[];const svc=React.useMemo(()=>{const m=new Map<string,{count:number;revenue:number;balance:number}>();for(const o of orders)if(o.status!=="cancelled"){const x=m.get(o.serviceType)||{count:0,revenue:0,balance:0};x.count++;x.revenue+=o.price;x.balance+=o.balance;m.set(o.serviceType,x)}return [...m.entries()]},[orders]);const exp=React.useMemo(()=>{const m=new Map<string,number>();for(const e of expenses)m.set(e.categoryName||e.categoryId,(m.get(e.categoryName||e.categoryId)||0)+e.amount);return [...m.entries()]},[expenses]);const pur=React.useMemo(()=>{const m=new Map<string,{amount:number;paid:number;balance:number}>();for(const p of purchases){const k=p.supplierName||"Unassigned";const x=m.get(k)||{amount:0,paid:0,balance:0};x.amount+=p.amount;x.paid+=p.paidAmount;x.balance+=p.balanceAmount;m.set(k,x)}return [...m.entries()]},[purchases]);const pay=React.useMemo(()=>{const m=new Map<string,number>();for(const p of payments)m.set(p.method,(m.get(p.method)||0)+p.amount);return [...m.entries()]},[payments]);function ex(){let h:string[]=[];let d:unknown[][]=[];if(tab==="sales"){h=["Period","Products","Services","Laundry","Revenue","Expenses","Net Profit"];d=rows.map(r=>[r.label,r.productSales,r.serviceRevenue,r.laundryRevenue,r.totalRevenue,r.expenses,r.netProfit])}else if(tab==="dayend"){h=["Metric","Value"];d=[["Total sales",dayEnd.totalSales],["Service revenue",dayEnd.serviceRevenue],["COGS",dayEnd.costOfGoods],["Gross profit",dayEnd.grossProfit],["Expenses",dayEnd.totalExpenses],["Net profit",dayEnd.netProfit],["Cash",dayEnd.cashReceived],["Card/UPI",dayEnd.cardPayments],["Other",dayEnd.otherPayments],["Outstanding",dayEnd.outstandingAmount]]}else if(tab==="stock"){h=["Product","SKU","Stock","Minimum","Value"];d=stock.map(r=>[r.name,r.sku||"",r.stock,r.min,r.value])}else if(tab==="outstanding"){h=["Customer","Phone","Outstanding"];d=outstanding.map(r=>[r.name,r.phone||"",r.outstanding])}else if(tab==="customers"){h=["Name","Phone","WhatsApp","Email","Address","Birthday","Spend","Outstanding"];d=customers.map(c=>[c.name,c.phone||"",c.whatsapp||"",c.email||"",c.address||"",c.birthday||"",c.totalSpending,c.outstandingBalance])}else if(tab==="services"){h=["Service","Orders","Revenue","Balance"];d=svc.map(([k,v])=>[k,v.count,v.revenue,v.balance])}else if(tab==="expenses"){h=["Category","Amount"];d=exp}else if(tab==="purchases"){h=["Supplier","Amount","Paid","Balance"];d=pur.map(([k,v])=>[k,v.amount,v.paid,v.balance])}else if(tab==="staff"){h=["Name","Role","Salary","Status","Joining Date"];d=staff.map(s=>[s.name,s.role,s.salary,s.status,s.joiningDate||""])}else{h=["Payment Method","Amount"];d=pay}downloadCsv(`minarvabiz-${tab}-report-${new Date().toISOString().slice(0,10)}.csv`,[h,...d])}\nconst tabs:[Tab,string][]=[["sales","Sales"],["dayend","Day-end"],["stock","Inventory"],["outstanding","Outstanding"],["customers","Customers"],["services","Services"],["expenses","Expenses"],["purchases","Purchases"],["staff","Staff"],["payments","Payments"]];return <div className="space-y-4" id="minarva-report-print-root"><div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><div><h2 className="text-xl font-semibold text-slate-900">Reports & Analytics</h2><p className="text-sm text-slate-500">Complete operational, financial and customer reporting.</p></div><div className="flex flex-wrap gap-2"><Button type="button" variant="outline" onClick={onRefresh}>Refresh</Button><Button type="button" variant="outline" onClick={ex}>Export CSV</Button><Button type="button" variant="outline" onClick={()=>onPrint?onPrint():window.print()}>Print</Button><Button type="button" onClick={()=>onPdf?onPdf():window.print()}>Save PDF</Button></div></div><div className="flex flex-wrap gap-2">{tabs.map(([t,l])=><Button type="button" key={t} size="sm" variant={tab===t?"primary":"outline"} onClick={()=>setTab(t)}>{l}</Button>)}</div>{tab==="sales"&&<Card><CardHeader><CardTitle className="text-sm">Sales summary</CardTitle></CardHeader><CardContent className="overflow-x-auto"><table className="w-full text-sm"><thead><tr><th>Period</th><th>Products</th><th>Services</th><th>Laundry</th><th>Revenue</th><th>Expenses</th><th>Net profit</th></tr></thead><tbody>{rows.map(r=><tr key={r.label}><td>{r.label}</td><td>{formatMoney(r.productSales)}</td><td>{formatMoney(r.serviceRevenue)}</td><td>{formatMoney(r.laundryRevenue)}</td><td>{formatMoney(r.totalRevenue)}</td><td>{formatMoney(r.expenses)}</td><td>{formatMoney(r.netProfit)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="dayend"&&<div className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">{[["Total sales",dayEnd.totalSales],["Service revenue",dayEnd.serviceRevenue],["COGS",dayEnd.costOfGoods],["Gross profit",dayEnd.grossProfit],["Expenses",dayEnd.totalExpenses],["Net profit",dayEnd.netProfit],["Cash",dayEnd.cashReceived],["Card/UPI",dayEnd.cardPayments],["Other",dayEnd.otherPayments],["Outstanding",dayEnd.outstandingAmount]].map(([l,v])=><Card key={String(l)}><CardContent className="p-4"><div className="text-xs text-slate-500">{l}</div><div className="text-lg font-bold">{formatMoney(v as number)}</div></CardContent></Card>)}</div>}{tab==="stock"&&<Card><CardContent className="overflow-x-auto p-4"><table className="w-full text-sm"><tbody>{stock.map(r=><tr key={r.id}><td>{r.name}</td><td>{r.sku||"—"}</td><td>{r.stock}</td><td>{r.min}</td><td>{formatMoney(r.value)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="outstanding"&&<Card><CardContent className="space-y-2 p-4">{outstanding.map(c=><div key={c.id} className="flex justify-between"><span>{c.name}</span><strong>{formatMoney(c.outstanding)}</strong></div>)}</CardContent></Card>}{tab==="customers"&&<Card><CardContent className="overflow-x-auto p-4"><table className="w-full text-sm"><tbody>{customers.map(c=><tr key={c.id}><td>{c.name}</td><td>{c.phone||"—"}</td><td>{c.whatsapp||"—"}</td><td>{c.email||"—"}</td><td>{c.address||"—"}</td><td>{c.birthday||"—"}</td><td>{formatMoney(c.totalSpending)}</td><td>{formatMoney(c.outstandingBalance)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="services"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{svc.map(([k,v])=><tr key={k}><td>{k}</td><td>{v.count}</td><td>{formatMoney(v.revenue)}</td><td>{formatMoney(v.balance)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="expenses"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{exp.map(([k,v])=><tr key={k}><td>{k}</td><td>{formatMoney(v)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="purchases"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{pur.map(([k,v])=><tr key={k}><td>{k}</td><td>{formatMoney(v.amount)}</td><td>{formatMoney(v.paid)}</td><td>{formatMoney(v.balance)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="staff"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{staff.map(s=><tr key={s.id}><td>{s.name}</td><td>{s.role}</td><td>{formatMoney(s.salary)}</td><td>{s.status}</td><td>{s.joiningDate||"—"}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="payments"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{pay.map(([k,v])=><tr key={k}><td>{k}</td><td>{formatMoney(v)}</td></tr>)}</tbody></table></CardContent></Card>}</div>}\n''')
          # Desktop App wiring and full modals.
          p=Path('apps/desktop/src/App.tsx'); s=p.read_text()
          s=rep(s,'const [custOpen, setCustOpen] = React.useState(false);\n  const [custForm, setCustForm] = React.useState({ name: "", phone: "", email: "" });','const [custOpen, setCustOpen] = React.useState(false);\n  const [custForm, setCustForm] = React.useState({name:"",phone:"",whatsapp:"",email:"",address:"",birthday:"",notes:""});\n  const [productOpen, setProductOpen] = React.useState(false);\n  const [productForm, setProductForm] = React.useState({name:"",sku:"",barcode:"",categoryId:"",brand:"",size:"",color:"",fabric:"",unit:"pcs",costPrice:"",sellingPrice:"",discount:"0",taxRate:"0",stockQuantity:"",minimumStock:"0",supplierId:"",imageUrl:"",notes:"",hasVariants:false});','App.tsx')
          s=rep(s,'const [expenseForm, setExpenseForm] = React.useState({ categoryId: "", amount: "", paymentMethod: "cash" as PaymentMethod, description: "", reference: "", orderId: "" });','const [expenseForm, setExpenseForm] = React.useState({date:"",categoryId:"",amount:"",paymentMethod:"cash" as PaymentMethod,description:"",reference:"",receiptUrl:"",staffId:"",orderId:""});','App.tsx')
          s=rep(s,'const [purchaseForm, setPurchaseForm] = React.useState({ supplierId: "", description: "", amount: "", paidAmount: "", paymentMethod: "cash" as PaymentMethod, kind: "general" as "general" | "order_specific", orderId: "", notes: "" });','const [purchaseForm, setPurchaseForm] = React.useState({date:"",supplierId:"",description:"",amount:"",paidAmount:"",paymentMethod:"cash" as PaymentMethod,kind:"general" as "general"|"order_specific",orderId:"",notes:""});','App.tsx')
          s=rep(s,'const [staffForm, setStaffForm] = React.useState({ name: "", phone: "", email: "", role: "staff" as RoleName, salary: "", joiningDate: "", notes: "" });','const [staffForm, setStaffForm] = React.useState({name:"",phone:"",email:"",role:"staff" as RoleName,salary:"",joiningDate:"",status:"active" as "active"|"inactive"|"on_leave",notes:""});','App.tsx')
          s=rep(s,'const result = phase5Store.createExpense({ categoryId: expenseForm.categoryId, amount: parseFloat(expenseForm.amount) || 0, paymentMethod: expenseForm.paymentMethod, description: expenseForm.description || null, reference: expenseForm.reference || null, orderId: expenseForm.orderId || null });','const result = phase5Store.createExpense({date:expenseForm.date||undefined,categoryId:expenseForm.categoryId,amount:parseFloat(expenseForm.amount)||0,paymentMethod:expenseForm.paymentMethod,description:expenseForm.description||null,reference:expenseForm.reference||null,receiptUrl:expenseForm.receiptUrl||null,staffId:expenseForm.staffId||null,orderId:expenseForm.orderId||null});','App.tsx')
          s=rep(s,'phase6Store.createStaff({ name: staffForm.name.trim(), phone: staffForm.phone || null, email: staffForm.email || null, role: staffForm.role, salary: parseFloat(staffForm.salary) || 0, joiningDate: staffForm.joiningDate || null, notes: staffForm.notes || null });','phase6Store.createStaff({name:staffForm.name.trim(),phone:staffForm.phone||null,email:staffForm.email||null,role:staffForm.role,salary:parseFloat(staffForm.salary)||0,joiningDate:staffForm.joiningDate||null,status:staffForm.status,notes:staffForm.notes||null});','App.tsx')
          s=rep(s,'setExpenseForm({ categoryId: "", amount: "", paymentMethod: "cash", description: "", reference: "", orderId: "" });','setExpenseForm({date:"",categoryId:"",amount:"",paymentMethod:"cash",description:"",reference:"",receiptUrl:"",staffId:"",orderId:""});','App.tsx')
          s=rep(s,'setPurchaseForm({ supplierId: "", description: "", amount: "", paidAmount: "", paymentMethod: "cash", kind: "general", orderId: "", notes: "" });','setPurchaseForm({date:"",supplierId:"",description:"",amount:"",paidAmount:"",paymentMethod:"cash",kind:"general",orderId:"",notes:""});','App.tsx')
          s=rep(s,'setStaffForm({ name: "", phone: "", email: "", role: "staff", salary: "", joiningDate: "", notes: "" });','setStaffForm({name:"",phone:"",email:"",role:"staff",salary:"",joiningDate:"",status:"active",notes:""});','App.tsx')
          s=rep(s,'header={{ showSearch: view !== "dashboard", title: view === "services" ? "Services & Orders" : view, subtitle: "Welcome back, Admin!", notificationCount: phase6Store.unreadNotificationCount(), messageCount: 3 }}','header={{showSearch:view!=="dashboard",title:view==="services"?"Services & Orders":view,subtitle:"Welcome back, Admin!",notificationCount:phase6Store.unreadNotificationCount(),messageCount:phase6Store.unreadNotificationCount(),onMessagesClick:()=>navTo("notifications"),onNotificationsClick:()=>navTo("notifications"),onCalendarClick:()=>navTo("reports")}}','App.tsx')
