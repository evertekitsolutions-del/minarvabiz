name: Standalone HTML POS
on:
  pull_request:
    paths:
      - 'docs/previews/cloud-pos/**'
      - '.github/workflows/html-pos.yml'
  push:
    branches: [main]
    paths:
      - 'docs/previews/cloud-pos/**'
      - '.github/workflows/html-pos.yml'
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node --test docs/previews/cloud-pos/core.test.mjs
      - run: node --check docs/previews/cloud-pos/app.mjs
