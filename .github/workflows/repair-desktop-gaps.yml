name: Repair Desktop Gaps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch desktop App.tsx
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/desktop/src/App.tsx')
          s = p.read_text(encoding='utf-8')
          original = s
          s = s.replace('onNavigate={(href,id)=>{setGlobalSearchQuery(\"\");navTo(id);}}', 'onNavigate={(_href,id)=>{setGlobalSearchQuery(\"\");navTo(id);}}')
          if s == original:
              raise SystemExit('no changes made')
          p.write_text(s, encoding='utf-8')
      - name: Validate source wiring
        run: |
          grep -F 'onSearch:setGlobalSearchQuery' apps/desktop/src/App.tsx
          grep -F 'onMarkAllRead' apps/desktop/src/App.tsx
          grep -F 'onRefresh={()=>{refreshAll();}}' apps/desktop/src/App.tsx
          grep -F 'GlobalSearchPalette' apps/desktop/src/App.tsx
      - name: Commit repair and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/App.tsx
          git commit -m 'fix: correct desktop search palette typecheck' || exit 0
          git push origin HEAD:main
