name: Robust UI repair runner

on:
  push:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Reuse tested UI repair script and normalize report source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          wf=Path('.github/workflows/repair-ui-v2.yml').read_text()
          m=re.search(r"python - <<'PY'\n(?P<script>.*?)\n\s*PY\n",wf,re.S)
          if not m: raise SystemExit('Could not extract tested repair script from repair-ui-v2.yml')
          script=textwrap.dedent(m.group('script'))
          exec(compile(script,'<repair-ui-v2>','exec'),{'__name__':'__repair__'})
          p=Path('packages/ui/src/components/reports/ReportsPanel.tsx')
          s=p.read_text()
          s=s.replace('\\\\n','\n')
          s=s.replace('return /[",\n]/.test(s)','return /[",\\\\n]/.test(s)')
          s=s.replace('.join("\n")','.join("\\\\n")')
          p.write_text(s)
          print('normalized',p)
          PY
      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/desktop-ui-contract-smoke.mjs
          pnpm --filter @minarvabiz/database typecheck
          pnpm --filter @minarvabiz/business-logic typecheck
          pnpm --filter @minarvabiz/ui typecheck
          pnpm --filter @minarvabiz/desktop typecheck
      - name: Commit completed repair and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages scripts/desktop-ui-contract-smoke.mjs
          git rm .github/workflows/repair-ui-v2.yml .github/workflows/repair-ui-v3.yml
          git diff --cached --check
          git commit -m "fix: complete desktop UI workflows forms reports printing"
          git push
