name: Minarva Biz final backup path repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Repair source
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('apps/desktop/electron/main.ts')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r'fs\.existsSync\("D:[^)]*\)', 'fs.existsSync("D:/")', s, count=1)
          if n != 1:
              raise SystemExit(f'Could not find malformed D-drive check; replacements={n}')
          p.write_text(s2, encoding='utf-8')
          if 'fs.existsSync("D:/")' not in s2:
              raise SystemExit('Verification failed')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/electron/main.ts
          git rm .github/workflows/minarva-path-final.yml
          git commit -m "fix: repair Windows backup drive detection"
          git push origin main
