name: Temporary Next16 Lockfile Generation
on:
  push:
    branches:
      - fix/next16-opennext-security-20261021
permissions:
  contents: read
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Generate real pnpm lockfile without scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Emit new lockfile for review
        run: |
          printf 'MINARVA_LOCKFILE_BEGIN\\n'
          cat pnpm-lock.yaml
          printf '\\nMINARVA_LOCKFILE_END\\n'
