name: One-time React hooks hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove hook from conditional render path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('apps/desktop/src/App.tsx')
          s = p.read_text()
          pattern = r'(?m)^\s*const handleInsightAction = React\.useCallback\(\(action: string\) => \{.*?^\s*\}, \[\]\);\s*$'
          replacement = '''  const handleInsightAction = (action: string) => {
    const targets: Record<string, NavItemId> = {
      "Review low stock": "sales",
      "Open outstanding payments": "reports",
      "Review pending orders": "services",
      "Open ready orders": "services",
      "Open reports": "reports",
      "Review expenses": "expenses",
    };
    const target = targets[action];
    if (target) navTo(target);
  };'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected conditional useCallback was not found; refusing to modify source.')
          p.write_text(s2)
          PY
          git diff --check
      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/App.tsx .github/workflows/hotfix-react-hooks.yml
          git commit -m "fix: remove conditional React hook"
          git push
