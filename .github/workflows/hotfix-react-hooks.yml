name: One-time React hooks hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove conditional React hook
        shell: bash
        run: |
          set -euo pipefail
          file="apps/desktop/src/App.tsx"
          sed -i 's/const handleInsightAction = React\.useCallback((action: string) => {/const handleInsightAction = (action: string) => {/' "$file"
          sed -i 's/^  }, \[\]);$/  };/g' "$file"
          grep -Fq 'const handleInsightAction = (action: string) =>' "$file"
          git diff --check
      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/App.tsx .github/workflows/hotfix-react-hooks.yml
          git commit -m "fix: remove conditional React hook"
          git push
