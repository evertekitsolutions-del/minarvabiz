name: One-time React hooks hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix callbacks that were below conditional returns
        shell: bash
        run: |
          set -euo pipefail
          git checkout d33566691b0120c1df82e02ac183c537a0fbd3fa -- apps/desktop/src/App.tsx
          perl -0pi -e 's/const refreshAll = React\.useCallback\(\(\) => \{/const refreshAll = () => {/' apps/desktop/src/App.tsx
          perl -0pi -e 's/\n  \}, \[lowStockOnly, orderQuery, orderStatus, orderType, selectedOrder\]\);/\n  };/s' apps/desktop/src/App.tsx
          perl -0pi -e 's/const persistAndRefresh = React\.useCallback\(async \(\) => \{/const persistAndRefresh = async () => {/' apps/desktop/src/App.tsx
          perl -0pi -e 's/\n  \}, \[refreshAll\]\);/\n  };/s' apps/desktop/src/App.tsx
          grep -Fq 'const refreshAll = () =>' apps/desktop/src/App.tsx
          grep -Fq 'const persistAndRefresh = async () =>' apps/desktop/src/App.tsx
          git diff --check
      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/App.tsx .github/workflows/hotfix-react-hooks.yml
          git commit -m "fix: move desktop callbacks out of hook path"
          git push
