name: One-time React hooks hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply React hook fix from pre-hotfix source
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD~2 -- apps/desktop/src/App.tsx
          perl -0pi -e 's/(const handleInsightAction = )React\.useCallback\(((?:action: string) => \{.*?)(\n  \}, \[\]\);)/$1$2\n  };/s' apps/desktop/src/App.tsx
          grep -Fq 'const handleInsightAction = (action: string) =>' apps/desktop/src/App.tsx
          git diff --check
      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/App.tsx .github/workflows/hotfix-react-hooks.yml
          git commit -m "fix: remove conditional React hook"
          git push
