name: Windows Deep Installed Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-deep-smoke:
    runs-on: windows-latest
    env:
      MINARVA_RUNTIME_SMOKE: "1"
      MINARVA_COMMERCIAL_RELEASE: "1"
      VITE_LICENSE_API_URL: "https://minarvabiz-license-admin.onrender.com"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Fetch production license public key
        run: node scripts/fetch-license-public-key.mjs
      - name: Validate production licensing configuration
        shell: pwsh
        run: |
          $key = "$env:MINARVA_LICENSE_PUBLIC_KEY_HEX".Trim()
          $url = "$env:VITE_LICENSE_API_URL".Trim()
          if ($key -notmatch '^[0-9a-fA-F]{64}$') { throw "MINARVA_LICENSE_PUBLIC_KEY_HEX must be exactly 64 hexadecimal characters." }
          if (-not $url -or $url -notmatch '^https://') { throw "VITE_LICENSE_API_URL must be a non-empty HTTPS URL." }
          Write-Host "PRODUCTION_LICENSE_KEY PASS: configured 64-hex public verification key."
          Write-Host "LICENSE_API_URL PASS: configured HTTPS endpoint."
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify commercial fallback refusal
        shell: pwsh
        run: node scripts/verify-production-license-config.mjs
      - run: pnpm --filter @minarvabiz/desktop run package:win
      - name: Verify bundled key has no private key
        shell: pwsh
        run: |
          $configPath = "apps/desktop/electron/license-config.ts"
          if (-not (Test-Path $configPath)) { throw "Generated desktop license config is missing." }
          $config = Get-Content -Raw $configPath
          $expected = $env:MINARVA_LICENSE_PUBLIC_KEY_HEX.Trim().ToLower()
          if ($config -notmatch [regex]::Escape($expected)) { throw "Bundled production public key does not match configured GitHub secret." }
          if ($config -match 'PRIVATE_KEY|LICENSE_PRIVATE_KEY|privateKey') { throw "Potential private-key content found in bundled license configuration." }
          if ($config -notmatch 'BUNDLED_LICENSE_PUBLIC_KEY_HEX') { throw "Bundled public key constant is missing." }
          Write-Host "Bundled production public key verified without private-key material."

      - name: Clean install
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Deep-UAT"
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          $installProc = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installRoot" -PassThru -Wait
          if ($installProc.ExitCode -ne 0) { throw "Installer exited with code $($installProc.ExitCode)." }
          $exe = Join-Path $installRoot "Minarva Biz.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found at $exe" }
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Launch installed app with CDP
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList "--remote-debugging-port=9222" -PassThru
          "APP_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($i=1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9222/json/list -TimeoutSec 2
              if ($response.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port 9222 -InformationLevel Quiet)) { throw "Electron CDP port 9222 did not open." }

      - name: Installed UI + licensing deep smoke
        shell: pwsh
        run: node scripts/windows-populated-deep-smoke.mjs

      - name: Cleanup app
        if: always()
        shell: pwsh
        run: |
          if ($env:APP_PID) { Stop-Process -Id ([int]$env:APP_PID) -Force -ErrorAction SilentlyContinue }
          if ($env:INSTALL_ROOT) { Get-Process | Where-Object { $_.Path -like "*$env:INSTALL_ROOT*" } | Stop-Process -Force -ErrorAction SilentlyContinue }

      - name: Upload deep smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: minarvabiz-windows-deep-smoke-diagnostics
          path: |
            ${{ runner.temp }}/MinarvaBiz-Deep-UAT/**
            ${{ runner.temp }}/**/runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload final installer
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: minarvabiz-windows-installer-final
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
