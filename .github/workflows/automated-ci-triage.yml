name: Automated CI Failure Triage

on:
  workflow_run:
    workflows:
      - CI
      - Windows Feature Click Smoke
      - Windows Deep Installed Smoke
      - Final Release Audit
    types: [completed]
  schedule:
    - cron: '37 2 * * *'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ (github.event_name == 'schedule' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && 'minarva-continuity-main' || format('ci-triage-{0}', github.event.workflow_run.id) }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.event == 'pull_request'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Create or update failure issue without executing PR code
        shell: bash
        run: |
          set -euo pipefail
          # All untrusted event strings remain data, never interpolated as shell code.
          pr_number="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "No associated PR; no issue created."
            exit 0
          fi
          title="[CI failure] PR #${pr_number}: ${RUN_NAME}"
          body="$(printf 'Automated CI triage (no code executed and no automatic merge).\n\nPR: #%s\nWorkflow: %s\nFailing run: %s\nHead SHA: %s\n\nNext: inspect failed jobs and logs; reproduce; implement root-cause fix on a branch; rerun all required checks.\n' "$pr_number" "$RUN_NAME" "$RUN_URL" "$HEAD_SHA")"
          # Compare exact titles; never interpolate PR-controlled values into jq source.
          export TARGET_TITLE="$title"
          existing="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TARGET_TITLE) | .number' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  continuity:
    name: Durable main and backlog checkpoint
    if: >-
      ${{
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.repository.full_name == github.repository &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refresh one durable issue using GitHub API only
        shell: bash
        run: |
          set -euo pipefail
          # Never checkout or execute repository code under this issues:write token.
          MAIN_SHA="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid main SHA' >&2; exit 1; }
          QUEUE="$(gh api "repos/$GH_REPO/contents/docs/DEVELOPMENT_TASK_QUEUE.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)"
          printf '%s' "$QUEUE" | jq -e '.schemaVersion == 1 and .repository == "evertekitsolutions-del/minarvabiz" and (.tasks | type == "array" and length > 0) and all(.tasks[]; .status == "ready" or .status == "blocked" or .status == "in_progress" or .status == "verified")' >/dev/null
          # Fetch reviewed JSON from live main only; privileged runner never
          # checks out or executes application/source code.
          DELIVERY="$(gh api "repos/$GH_REPO/contents/docs/PRODUCT_DELIVERY_BACKLOG.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)"
          printf '%s' "$DELIVERY" | jq -e '.schemaVersion == 1 and .repository == "evertekitsolutions-del/minarvabiz" and (.initiatives | type == "array" and length > 0)' >/dev/null
          NEXT_CUSTOMER="$(printf '%s' "$DELIVERY" | jq -r '[.initiatives[] | select(.status != "accepted")] | sort_by(.priority) | .[0] | if . == null then "All recorded outcomes need a fresh acceptance audit" else .id + " — " + .title end')"
          DELIVERY_TOP="$(printf '%s' "$DELIVERY" | jq -r '.initiatives | sort_by(.priority) | .[0:8] | .[] | "- " + .id + " (" + .status + "): " + .criticalOutcome')"
          PERCENT="$(printf '%s' "$QUEUE" | jq -r '.fullMasterVisionEstimatedPercent')"
          NEXT="$(printf '%s' "$QUEUE" | jq -r '[.tasks[] | select(.status == "ready" or .status == "in_progress")] | sort_by(.priority) | .[0] | if . == null then "No unblocked task; review dependency gates" else .id + " — " + .title end')"
          TASKS="$(printf '%s' "$QUEUE" | jq -r '.tasks | sort_by(.priority) | .[] | "- " + .id + " (" + .status + "): " + .title + " — " + .nextAction')"
          CHECKS="$(gh api "repos/$GH_REPO/commits/$MAIN_SHA/check-runs?per_page=100")"
          read -r TOTAL PASSED SKIPPED FAILED PENDING <<< "$(printf '%s' "$CHECKS" | jq -r '[(.check_runs | length), ([.check_runs[] | select(.conclusion == "success")] | length), ([.check_runs[] | select(.conclusion == "skipped")] | length), ([.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required")] | length), ([.check_runs[] | select(.conclusion == null)] | length)] | @tsv')"
          OPEN_PRS="$(gh pr list --base main --state open --limit 100 --json number --jq 'map("#" + (.number | tostring)) | join(", ")')"
          [[ -n "$OPEN_PRS" ]] || OPEN_PRS='none'
          LATEST="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          [[ -n "$LATEST" ]] || LATEST='unverified'
          CHECK_STATUS='Pending/unverified: do not claim green or merge from this snapshot'
          if [[ "$FAILED" -gt 0 ]]; then
            CHECK_STATUS='FAILED: inspect logs, root-cause fix and repeat tests'
          elif [[ "$TOTAL" -gt 0 && "$PENDING" -eq 0 ]]; then
            CHECK_STATUS='Visible checks completed, not customer production UAT'
          fi
          TITLE='Minarva Biz — Development Continuity Dashboard'
          BODY="$(printf '%s\n'             '# Minarva Biz — Durable Development Checkpoint'             ''             'Automatically updated from GitHub main. This is a checkpoint monitor, NOT an autonomous coding agent.'             ''             "**Main SHA:** $MAIN_SHA"             "**Open PRs targeting main:** $OPEN_PRS"             "**Visible main checks:** $PASSED passed, $SKIPPED skipped, $FAILED failed/cancelled, $PENDING pending (of $TOTAL)"             "**Check assessment:** $CHECK_STATUS"             "**Latest GitHub release:** $LATEST (source CI artifact does not mean customer installer release)"             "**Full Master Vision estimate:** ~$PERCENT% (never automatically increased by PR counts)"             ''             '## Next customer-visible delivery outcome'             "$NEXT_CUSTOMER"             ''             '## Commercial delivery priorities (acceptance not yet verified)'             "$DELIVERY_TOP"             ''             '## Technical subqueue (does NOT define full-product priorities)'             "$NEXT"             "$TASKS"             ''             '## Resume after connection/chat interruption'             '1. Verify live main SHA, open PRs, CI runs and failed logs; do not trust an old chat SHA.'             '2. Read docs/OWNER_DIRECTIVE_2026-10-20.md and its required repository policies/capability registries before choosing a feature.'             '3. Take next live-verified Q1–Q8 missing/partial capability. Do not duplicate relevant open PR code; existing optional hardening belongs to Phase H.'             '4. Reuse existing code, audited Open Mercato MIT pure components and approved OSS. Test, require exact-head green checks, then merge. No installer release without approval.'             '5. Distinguish source, customer UAT and release evidence; no invented percentage, paid service, production writes or optional hardening chains.'             ''             'No code writing, automatic merges, migrations, paid services or customer data mutations occur in this workflow.')"
          INDEX="$(gh issue list --state all --limit 500 --json number,title,state)"
          MATCHES="$(printf '%s' "$INDEX" | jq '[.[] | select(.title == "Minarva Biz — Development Continuity Dashboard")] | length')"
          if [[ "$MATCHES" -gt 1 ]]; then echo 'Duplicate dashboard issues: manual review required' >&2; exit 1; fi
          if [[ "$MATCHES" -eq 1 ]]; then
            ISSUE="$(printf '%s' "$INDEX" | jq -r '.[] | select(.title == "Minarva Biz — Development Continuity Dashboard") | .number')"
            ISSUE_STATE="$(printf '%s' "$INDEX" | jq -r '.[] | select(.title == "Minarva Biz — Development Continuity Dashboard") | .state')"
            if [[ "$ISSUE_STATE" != 'OPEN' ]]; then echo 'Dashboard was closed by owner; not reopening'; exit 0; fi
            gh issue edit "$ISSUE" --body "$BODY"
            echo "Updated dashboard issue #$ISSUE"
          else
            if [[ "$(printf '%s' "$INDEX" | jq 'length')" -eq 500 ]]; then echo 'Issue search saturated, refuse duplicate' >&2; exit 1; fi
            gh issue create --title "$TITLE" --body "$BODY"
          fi
