onChange={(e) => setStaffForm({ ...staffForm, notes: e.target.value })} /></FormField>\n      </div>\n    </Modal>\n    <Modal open={custOpen} title="Add Customer" onClose={() => setCustOpen(false)} footer={<><Button type="button" variant="outline" onClick={() => setCustOpen(false)}>Cancel</Button><Button type="button" onClick={handleCreateCustomer}>Save Customer</Button></>}>\n      <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">\n        <FormField label="Name *"><input className={inputClass} value={custForm.name} onChange={(e) => setCustForm({ ...custForm, name: e.target.value })} /></FormField>\n        <FormField label="Phone"><input className={inputClass} value={custForm.phone} onChange={(e) => setCustForm({ ...custForm, phone: e.target.value })} /></FormField>\n        <FormField label="WhatsApp"><input className={inputClass} value={custForm.whatsapp} onChange={(e) => setCustForm({ ...custForm, whatsapp: e.target.value })} /></FormField>\n        <FormField label="Email"><input className={inputClass} type="email" value={custForm.email} onChange={(e) => setCustForm({ ...custForm, email: e.target.value })} /></FormField>\n        <FormField label="Address" className="sm:col-span-2"><textarea className={inputClass + " h-20 py-2"} value={custForm.address} onChange={(e) => setCustForm({ ...custForm, address: e.target.value })} /></FormField>\n        <FormField label="Birthday"><input className={inputClass} type="date" value={custForm.birthday} onChange={(e) => setCustForm({ ...custForm, birthday: e.target.value })} /></FormField>\n        <FormField label="Notes"><input className={inputClass} value={custForm.notes} onChange={(e) => setCustForm({ ...custForm, notes: e.target.value })} /></FormField>\n      </div>\n    </Modal>\n    <Modal open={productOpen} title="Add Product" onClose={() => setProductOpen(false)} footer={<><Button type="button" variant="outline" onClick={() => setProductOpen(false)}>Cancel</Button><Button type="button" onClick={handleCreateProduct}>Save Product</Button></>}>\n      <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">\n        <FormField label="Product name *" className="sm:col-span-2"><input className={inputClass} value={productForm.name} onChange={(e) => setProductForm({ ...productForm, name: e.target.value })} /></FormField>\n        <FormField label="SKU"><input className={inputClass} value={productForm.sku} onChange={(e) => setProductForm({ ...productForm, sku: e.target.value })} /></FormField>\n        <FormField label="Barcode"><input className={inputClass} value={productForm.barcode} onChange={(e) => setProductForm({ ...productForm, barcode: e.target.value })} /></FormField>\n        <FormField label="Category"><select className={selectClass} value={productForm.categoryId} onChange={(e) => setProductForm({ ...productForm, categoryId: e.target.value })}><option value="">No category</option>{categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</select></FormField>\n        <FormField label="Brand"><input className={inputClass} value={productForm.brand} onChange={(e) => setProductForm({ ...productForm, brand: e.target.value })} /></FormField>\n        <FormField label="Size"><input className={inputClass} value={productForm.size} onChange={(e) => setProductForm({ ...productForm, size: e.target.value })} /></FormField>\n        <FormField label="Color"><input className={inputClass} value={productForm.color} onChange={(e) => setProductForm({ ...productForm, color: e.target.value })} /></FormField>\n        <FormField label="Fabric"><input className={inputClass} value={productForm.fabric} onChange={(e) => setProductForm({ ...productForm, fabric: e.target.value })} /></FormField>\n        <FormField label="Unit"><input className={inputClass} value={productForm.unit} onChange={(e) => setProductForm({ ...productForm, unit: e.target.value })} /></FormField>\n        <FormField label="Cost price"><input className={inputClass} type="number" step="0.01" value={productForm.costPrice} onChange={(e) => setProductForm({ ...productForm, costPrice: e.target.value })} /></FormField>\n        <FormField label="Selling price *"><input className={inputClass} type="number" step="0.01" value={productForm.sellingPrice} onChange={(e) => setProductForm({ ...productForm, sellingPrice: e.target.value })} /></FormField>\n        <FormField label="Discount %"><input className={inputClass} type="number" step="0.01" value={productForm.discount} onChange={(e) => setProductForm({ ...productForm, discount: e.target.value })} /></FormField>\n        <FormField label="Tax %"><input className={inputClass} type="number" step="0.01" value={productForm.taxRate} onChange={(e) => setProductForm({ ...productForm, taxRate: e.target.value })} /></FormField>\n        <FormField label="Opening stock"><input className={inputClass} type="number" step="0.01" value={productForm.stockQuantity} onChange={(e) => setProductForm({ ...productForm, stockQuantity: e.target.value })} /></FormField>\n        <FormField label="Minimum stock"><input className={inputClass} type="number" step="0.01" value={productForm.minimumStock} onChange={(e) => setProductForm({ ...productForm, minimumStock: e.target.value })} /></FormField>\n        <FormField label="Supplier"><select className={selectClass} value={productForm.supplierId} onChange={(e) => setProductForm({ ...productForm, supplierId: e.target.value })}><option value="">No supplier</option>{suppliers.map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}</select></FormField>\n        <FormField label="Image URL"><input className={inputClass} value={productForm.imageUrl} onChange={(e) => setProductForm({ ...productForm, imageUrl: e.target.value })} /></FormField>\n        <FormField label="Notes" className="sm:col-span-2"><textarea className={inputClass + " h-20 py-2"} value={productForm.notes} onChange={(e) => setProductForm({ ...productForm, notes: e.target.value })} /></FormField>\n        <label className="flex items-center gap-2 text-sm text-slate-700 sm:col-span-2"><input type="checkbox" checked={productForm.hasVariants} onChange={(e) => setProductForm({ ...productForm, hasVariants: e.target.checked })} />Product has variants</label>\n      </div>\n    </Modal>\n'''
              s = s[:old_exp.start()] + new_exp_purchase + s[old_exp.end()-len('    <Modal open={purchaseOpen}'):]
              return s
          edit('apps/desktop/src/App.tsx', patch_app)

          # --- Preload API for native print/PDF ---
          def patch_preload(s):
              s = replace_once(s, '''  relaunch: () => ipcRenderer.invoke("app:relaunch") as Promise<boolean>,''', '''  relaunch: () => ipcRenderer.invoke("app:relaunch") as Promise<boolean>,\n  printCurrent: () => ipcRenderer.invoke("report:print") as Promise<{ ok: boolean; error?: string; cancelled?: boolean }>,\n  saveCurrentPdf: () => ipcRenderer.invoke("report:savePdf") as Promise<{ ok: boolean; path?: string; error?: string; cancelled?: boolean }>,''', 'preload.ts')
              s = replace_once(s, '''  relaunch: () => Promise<boolean>;\n};''', '''  relaunch: () => Promise<boolean>;\n  printCurrent: () => Promise<{ ok: boolean; error?: string; cancelled?: boolean }>;\n  saveCurrentPdf: () => Promise<{ ok: boolean; path?: string; error?: string; cancelled?: boolean }>;\n};''', 'preload.ts')
              return s
          edit('apps/desktop/electron/preload.ts', patch_preload)

          # --- Main process native print/PDF IPC ---
          main = Path('apps/desktop/electron/main.ts')
          m = main.read_text()
          if 'ipcMain.handle("report:print"' in m:
              raise SystemExit('report IPC already exists')
          m += '''\n\nipcMain.handle("report:print", async (event) => {\n  requireTrustedRenderer(event);\n  return await new Promise<{ ok: boolean; error?: string }>((resolve) => {\n    event.sender.print({ silent: false, printBackground: true }, (success, reason) => {\n      resolve(success ? { ok: true } : { ok: false, error: reason || "Print dialog failed" });\n    });\n  });\n});\n\nipcMain.handle("report:savePdf", async (event) => {\n  requireTrustedRenderer(event);\n  const owner = BrowserWindow.fromWebContents(event.sender) || undefined;\n  const defaultPath = path.join(app.getPath("documents"), `minarvabiz-report-${timestamp()}.pdf`);\n  const picked = await dialog.showSaveDialog(owner, { defaultPath, filters: [{ name: "PDF", extensions: ["pdf"] }] });\n  if (picked.canceled || !picked.filePath) return { ok: false, cancelled: true };\n  try {\n    const pdf = await event.sender.printToPDF({ printBackground: true, preferCSSPageSize: true });\n    fs.writeFileSync(picked.filePath, pdf);\n    return { ok: true, path: picked.filePath };\n  } catch (error) {\n    return { ok: false, error: error instanceof Error ? error.message : String(error) };\n  }\n});\n'''
          main.write_text(m)
          print('updated main.ts')

          # --- Better vector icon: premium M + spark mark ---
          icon = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">\n  <defs>\n    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">\n      <stop offset="0" stop-color="#081b4b"/>\n      <stop offset="0.55" stop-color="#0b4aa2"/>\n      <stop offset="1" stop-color="#16a3ff"/>\n    </linearGradient>\n    <linearGradient id="m" x1="0" y1="1" x2="1" y2="0">\n      <stop offset="0" stop-color="#ffffff"/>\n      <stop offset="1" stop-color="#d9f3ff"/>\n    </linearGradient>\n  </defs>\n  <rect x="42" y="42" width="940" height="940" rx="220" fill="url(#bg)"/>\n  <path d="M250 760V300c0-28 22-50 50-50h54c18 0 35 9 45 24l113 171 113-171c10-15 27-24 45-24h54c28 0 50 22 50 50v460H620V455L512 620 404 455v305H250Z" fill="url(#m)"/>\n  <circle cx="768" cy="245" r="72" fill="#f59e0b"/>\n  <path d="M768 190l16 39 42 3-32 27 10 41-36-22-36 22 10-41-32-27 42-3 16-39Z" fill="#fff7ed"/>\n</svg>\n'''
          Path('apps/desktop/build/icon.svg').write_text(icon)
          Path('apps/desktop/public/minarva-biz-icon.svg').write_text(icon)

          # --- Add a static UI contract test for the repaired surfaces ---
          test = Path('scripts/desktop-ui-contract-smoke.mjs')
          test.write_text(r'''import fs from "node:fs";
function must(path, patterns) { const s=fs.readFileSync(path,"utf8"); for(const p of patterns){ if(!s.includes(p)) throw new Error(`${path}: missing ${p}`); } }
must("apps/desktop/src/App.tsx", ["onMessagesClick", "onNotificationsClick", "onCalendarClick", "onAddCustomer={openCustomerCreator}", "productOpen", "handleCreateProduct", "saveCurrentPdf", "printCurrent"]);
must("packages/ui/src/components/sales/PosBilling.tsx", ["onAddCustomer?: () => void", "onClick={onAddCustomer}"]);
must("packages/ui/src/components/orders/OrderForm.tsx", ["onAddCustomer?: () => void", "onClick={onAddCustomer}"]);
must("packages/ui/src/components/laundry/LaundryForm.tsx", ["onAddCustomer?: () => void", "onClick={onAddCustomer}"]);
must("packages/ui/src/components/layout/Header.tsx", ["onCalendarClick?:", "calendarOpen", "onMessagesClick", "onNotificationsClick"]);
must("packages/ui/src/components/reports/ReportsPanel.tsx", ["Export CSV", "Print", "Save PDF", "Customers", "Services", "Expenses", "Purchases", "Staff", "Payments"]);
console.log("desktop UI contract smoke: PASS");
''')
          print('created desktop-ui-contract-smoke.mjs')
          PY

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/desktop-ui-contract-smoke.mjs
          pnpm --filter @minarvabiz/database typecheck
          pnpm --filter @minarvabiz/business-logic typecheck
          pnpm --filter @minarvabiz/ui typecheck
          pnpm --filter @minarvabiz/desktop typecheck

      - name: Commit repaired source and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/App.tsx apps/desktop/electron/main.ts apps/desktop/electron/preload.ts apps/desktop/build/icon.svg apps/desktop/public/minarva-biz-icon.svg packages/business-logic/src/store.ts packages/business-logic/src/phase5-store.ts packages/business-logic/src/phase6-store.ts packages/ui/src/components/layout/Header.tsx packages/ui/src/components/sales/PosBilling.tsx packages/ui/src/components/orders/OrderForm.tsx packages/ui/src/components/laundry/LaundryForm.tsx packages/ui/src/components/reports/ReportsPanel.tsx scripts/desktop-ui-contract-smoke.mjs
