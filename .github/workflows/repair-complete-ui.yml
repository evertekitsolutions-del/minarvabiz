name: Repair complete desktop UI

on:
  push:
    branches: [main]

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'trigger verified desktop rebuild') || contains(github.event.head_commit.message, 'repair complete desktop UI')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Apply complete desktop UI repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              ns = fn(s)
              if ns == s:
                  raise SystemExit(f'No change made to {path}; repair pattern did not match')
              p.write_text(ns)
              print('updated', path)

          def replace_once(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'Missing pattern in {label}: {old[:120]!r}')
              return s.replace(old, new, 1)

          # --- business logic: customer birthday + expense staff/receipt metadata + staff status ---
          def patch_store(s):
              old = '''export function createCustomer(input: {\n  name: string; phone?: string | null; whatsapp?: string | null; email?: string | null;\n  address?: string | null; notes?: string | null;\n}): Customer {'''
              new = '''export function createCustomer(input: {\n  name: string; phone?: string | null; whatsapp?: string | null; email?: string | null;\n  address?: string | null; birthday?: string | null; notes?: string | null;\n}): Customer {'''
              s = replace_once(s, old, new, 'store.ts')
              s = replace_once(s, '''    email: input.email || null, address: input.address ?? null, notes: input.notes ?? null,''', '''    email: input.email || null, address: input.address ?? null, birthday: input.birthday ?? null, notes: input.notes ?? null,''', 'store.ts')
              return s
          edit('packages/business-logic/src/store.ts', patch_store)

          def patch_phase5(s):
              old = '''export function createExpense(input: { date?: string; categoryId: UUID; amount: number; paymentMethod: PaymentMethod; description?: string | null; reference?: string | null; orderId?: UUID | null; }): { expense: Expense | null; errors: string[] } {'''
              new = '''export function createExpense(input: { date?: string; categoryId: UUID; amount: number; paymentMethod: PaymentMethod; description?: string | null; reference?: string | null; receiptUrl?: string | null; staffId?: UUID | null; orderId?: UUID | null; }): { expense: Expense | null; errors: string[] } {'''
              s = replace_once(s, old, new, 'phase5-store.ts')
              old = '''  const expense: Expense = { id: generateId(), date: input.date || nowISO(), categoryId: input.categoryId, categoryName: cat!.name, amount: r2(input.amount), paymentMethod: input.paymentMethod, description: input.description ?? null, reference: input.reference ?? null, orderId: input.orderId ?? null, orderNumber, createdAt: nowISO(), updatedAt: nowISO(), version: 1 };'''
              new = '''  const expense: Expense = { id: generateId(), date: input.date || nowISO(), categoryId: input.categoryId, categoryName: cat!.name, amount: r2(input.amount), paymentMethod: input.paymentMethod, description: input.description ?? null, receiptUrl: input.receiptUrl ?? null, staffId: input.staffId ?? null, reference: input.reference ?? null, orderId: input.orderId ?? null, orderNumber, createdAt: nowISO(), updatedAt: nowISO(), version: 1 };'''
              s = replace_once(s, old, new, 'phase5-store.ts')
              return s
          edit('packages/business-logic/src/phase5-store.ts', patch_phase5)

          def patch_phase6(s):
              old = '''export function createStaff(input: { name: string; phone?: string | null; email?: string | null; role: RoleName | "tailor" | "staff"; salary?: number; joiningDate?: string | null; notes?: string | null; }): StaffMember {'''
              new = '''export function createStaff(input: { name: string; phone?: string | null; email?: string | null; role: RoleName | "tailor" | "staff"; salary?: number; joiningDate?: string | null; status?: StaffStatus; notes?: string | null; }): StaffMember {'''
              s = replace_once(s, old, new, 'phase6-store.ts')
              s = replace_once(s, '''role: input.role, salary: input.salary ?? 0, joiningDate: input.joiningDate ?? null, status: "active", notes:''', '''role: input.role, salary: input.salary ?? 0, joiningDate: input.joiningDate ?? null, status: input.status ?? "active", notes:''', 'phase6-store.ts')
              return s
          edit('packages/business-logic/src/phase6-store.ts', patch_phase6)

          # --- Header: working calendar/date controls ---
          def patch_header(s):
              s = replace_once(s, '''  onNotificationsClick?: () => void;\n  onMessagesClick?: () => void;''', '''  onNotificationsClick?: () => void;\n  onMessagesClick?: () => void;\n  onCalendarClick?: (date: string) => void;''', 'Header.tsx')
              s = replace_once(s, '''  onNotificationsClick,\n  onMessagesClick,\n  onLogout,''', '''  onNotificationsClick,\n  onMessagesClick,\n  onCalendarClick,\n  onLogout,''', 'Header.tsx')
              s = replace_once(s, '''  const [query, setQuery] = React.useState("");\n  const today =''', '''  const [query, setQuery] = React.useState("");\n  const [calendarOpen, setCalendarOpen] = React.useState(false);\n  const [selectedDate, setSelectedDate] = React.useState(() => new Date().toISOString().slice(0, 10));\n  const today =''', 'Header.tsx')
              old = '''        <button\n          type="button"\n          className="rounded-lg p-2 text-slate-500 hover:bg-slate-100"\n          aria-label="Calendar"\n        >'''
              new = '''        <button\n          type="button"\n          onClick={() => setCalendarOpen((v) => !v)}\n          className="rounded-lg p-2 text-slate-500 hover:bg-slate-100"\n          aria-label="Calendar"\n          title="Open calendar"\n        >'''
              s = replace_once(s, old, new, 'Header.tsx')
              old = '''        <div className="ml-1 hidden items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-sm text-slate-700 sm:flex">\n          <svg className="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">\n            <rect x="3" y="4" width="18" height="18" rx="2" />\n            <path d="M16 2v4M8 2v4M3 10h18" />\n          </svg>\n          <span className="whitespace-nowrap">{today}</span>\n          <svg className="h-3.5 w-3.5 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">\n            <path fillRule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.51a.75.75 0 0 1-1.08 0l-4.25-4.51a.75.75 0 0 1 .02-1.06Z" clipRule="evenodd" />\n          </svg>\n        </div>'''
              new = '''        <button type="button" onClick={() => setCalendarOpen((v) => !v)} className="ml-1 hidden items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-sm text-slate-700 sm:flex" title="Open calendar">\n          <svg className="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">\n            <rect x="3" y="4" width="18" height="18" rx="2" />\n            <path d="M16 2v4M8 2v4M3 10h18" />\n          </svg>\n          <span className="whitespace-nowrap">{today}</span>\n          <svg className="h-3.5 w-3.5 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">\n            <path fillRule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.51a.75.75 0 0 1-1.08 0l-4.25-4.51a.75.75 0 0 1 .02-1.06Z" clipRule="evenodd" />\n          </svg>\n        </button>\n        {calendarOpen && (\n          <div className="absolute right-4 top-14 z-50 w-72 rounded-2xl border border-slate-200 bg-white p-4 shadow-xl">\n            <div className="mb-2 text-sm font-semibold text-slate-800">Calendar</div>\n            <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="h-10 w-full rounded-lg border border-slate-200 px-3 text-sm" />\n            <div className="mt-3 flex gap-2">\n              <button type="button" className="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50" onClick={() => { setSelectedDate(new Date().toISOString().slice(0, 10)); }}>Today</button>\n              <button type="button" className="flex-1 rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700" onClick={() => { onCalendarClick?.(selectedDate); setCalendarOpen(false); }}>Open</button>\n            </div>\n          </div>\n        )}'''
              s = replace_once(s, old, new, 'Header.tsx')
              return s
          edit('packages/ui/src/components/layout/Header.tsx', patch_header)

          # --- POS: inline + customer creation ---
          def patch_pos(s):
              s = replace_once(s, '''  onFindByBarcode?: (barcode: string) => Product | undefined;\n}''', '''  onFindByBarcode?: (barcode: string) => Product | undefined;\n  onAddCustomer?: () => void;\n}''', 'PosBilling.tsx')
              s = replace_once(s, '''export function PosBilling({ products, customers, onCompleteSale, onComplete, onFindByBarcode }: PosBillingProps) {''', '''export function PosBilling({ products, customers, onCompleteSale, onComplete, onFindByBarcode, onAddCustomer }: PosBillingProps) {''', 'PosBilling.tsx')
              old = '''        <select value={customerId} onChange={(e) => setCustomerId(e.target.value)} className="h-10 w-full rounded-lg border border-slate-200 px-3 text-sm"><option value="">Walk-in customer</option>{customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` (${c.phone})` : ""}</option>)}</select>'''
              new = '''        <div className="flex gap-2"><select value={customerId} onChange={(e) => setCustomerId(e.target.value)} className="h-10 min-w-0 flex-1 rounded-lg border border-slate-200 px-3 text-sm"><option value="">Walk-in customer</option>{customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` (${c.phone})` : ""}</option>)}</select><Button type="button" size="sm" variant="outline" onClick={onAddCustomer} title="Add customer">+</Button></div>'''
              s = replace_once(s, old, new, 'PosBilling.tsx')
              return s
          edit('packages/ui/src/components/sales/PosBilling.tsx', patch_pos)

          # --- service customer + ---
          def patch_order_form(s):
              s = replace_once(s, '''export function OrderForm({ customers, profiles, value, onChange, onLoadProfiles, onSubmit, onCancel = () => undefined, error }: { customers: Customer[]; profiles: MeasurementProfile[]; value: OrderFormValues; onChange: (v: OrderFormValues) => void; onLoadProfiles?: (customerId: string) => void; onSubmit: () => void; onCancel?: () => void; error?: string | null }) {''', '''export function OrderForm({ customers, profiles, value, onChange, onLoadProfiles, onSubmit, onCancel = () => undefined, onAddCustomer, error }: { customers: Customer[]; profiles: MeasurementProfile[]; value: OrderFormValues; onChange: (v: OrderFormValues) => void; onLoadProfiles?: (customerId: string) => void; onSubmit: () => void; onCancel?: () => void; onAddCustomer?: () => void; error?: string | null }) {''', 'OrderForm.tsx')
              old = '''<FormField label="Customer *"><select className={selectClass} value={value.customerId} onChange={(e) => { onChange({ ...value, customerId: e.target.value, measurementProfileId: "" }); onLoadProfiles?.(e.target.value); }}><option value="">Select customer</option>{customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` (${c.phone})` : ""}</option>)}</select></FormField>'''
              new = '''<FormField label="Customer *"><div className="flex gap-2"><select className={selectClass + " min-w-0 flex-1"} value={value.customerId} onChange={(e) => { onChange({ ...value, customerId: e.target.value, measurementProfileId: "" }); onLoadProfiles?.(e.target.value); }}><option value="">Select customer</option>{customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` (${c.phone})` : ""}</option>)}</select><Button type="button" size="sm" variant="outline" onClick={onAddCustomer} title="Add customer">+</Button></div></FormField>'''
              s = replace_once(s, old, new, 'OrderForm.tsx')
              return s
          edit('packages/ui/src/components/orders/OrderForm.tsx', patch_order_form)

          # --- laundry customer + ---
          def patch_laundry(s):
              s = replace_once(s, '''  error?: string | null;\n}) {''', '''  error?: string | null;\n  onAddCustomer?: () => void;\n}) {''', 'LaundryForm.tsx')
              s = replace_once(s, '''  error,\n}: {''', '''  error,\n  onAddCustomer,\n}: {''', 'LaundryForm.tsx')
              old = '''      <FormField label="Customer *">\n        <select className={selectClass} value={customerId} onChange={(e) => setCustomerId(e.target.value)}>\n          <option value="">Select</option>\n          {customers.map((c) => (\n            <option key={c.id} value={c.id}>{c.name}</option>\n          ))}\n        </select>\n      </FormField>'''
              new = '''      <FormField label="Customer *">\n        <div className="flex gap-2">\n          <select className={selectClass + " min-w-0 flex-1"} value={customerId} onChange={(e) => setCustomerId(e.target.value)}>\n            <option value="">Select</option>\n            {customers.map((c) => (\n              <option key={c.id} value={c.id}>{c.name}</option>\n            ))}\n          </select>\n          <Button type="button" size="sm" variant="outline" onClick={onAddCustomer} title="Add customer">+</Button>\n        </div>\n      </FormField>'''
              s = replace_once(s, old, new, 'LaundryForm.tsx')
              return s
          edit('packages/ui/src/components/laundry/LaundryForm.tsx', patch_laundry)

          # --- Reports: replace with complete report center + CSV + print/PDF hooks ---
          reports = Path('packages/ui/src/components/reports/ReportsPanel.tsx')
          r = reports.read_text()
          new_reports = r'''"use client";

import * as React from "react";
import type { SalesReportRow, Customer, Expense, Purchase, ServiceOrder, StaffMember, Payment } from "@minarvabiz/types";
import { Button } from "../Button";
import { Card, CardContent, CardHeader, CardTitle } from "../Card";
import { formatMoney } from "../customers/format";

export interface DayEndView { totalSales:number; totalExpenses:number; costOfGoods:number; serviceRevenue:number; serviceExpenses:number; grossProfit:number; netProfit:number; cashReceived:number; cardPayments:number; otherPayments:number; outstandingAmount:number; }
export interface StockRow { id:string; name:string; sku?:string|null; stock:number; min:number; value:number; low:boolean; }

type ReportTab = "sales"|"dayend"|"stock"|"outstanding"|"customers"|"services"|"expenses"|"purchases"|"staff"|"payments";

function csvCell(value: unknown): string { const s = String(value ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function downloadCsv(filename: string, rows: unknown[][]) { const blob = new Blob([rows.map((row) => row.map(csvCell).join(",")).join("\n")], { type: "text/csv;charset=utf-8" }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
function moneyNumber(v: number) { return Math.round(v * 100) / 100; }

export function ReportsPanel({ salesRows, sales, dayEnd, stock, outstanding, customers = [], expenses = [], purchases = [], orders = [], staff = [], payments = [], onExportCsv, onRefresh, onPrint, onPdf }: {
  salesRows?:SalesReportRow[]; sales?:SalesReportRow[]; dayEnd:DayEndView; stock:Array<StockRow>; outstanding:Array<{id:string;name:string;phone?:string|null;outstanding:number}>;
  customers?: Customer[]; expenses?: Expense[]; purchases?: Purchase[]; orders?: ServiceOrder[]; staff?: StaffMember[]; payments?: Payment[];
  onExportCsv?:(kind:string)=>void; onRefresh?:()=>void; onPrint?:()=>void; onPdf?:()=>void;
}) {
  const [tab,setTab]=React.useState<ReportTab>("sales");
  const rows=salesRows??sales??[];
  const servicesByType = React.useMemo(() => { const m = new Map<string,{count:number; revenue:number; balance:number}>(); for (const o of orders) { if (o.status === "cancelled") continue; const x = m.get(o.serviceType) || {count:0,revenue:0,balance:0}; x.count += 1; x.revenue += o.price; x.balance += o.balance; m.set(o.serviceType,x); } return [...m.entries()].sort((a,b)=>b[1].revenue-a[1].revenue); }, [orders]);
  const expenseByCategory = React.useMemo(() => { const m = new Map<string,number>(); for (const e of expenses) m.set(e.categoryName || e.categoryId, (m.get(e.categoryName || e.categoryId) || 0) + e.amount); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }, [expenses]);
  const purchaseBySupplier = React.useMemo(() => { const m = new Map<string,{amount:number; paid:number; balance:number}>(); for (const p of purchases) { const k = p.supplierName || "Unassigned"; const x=m.get(k)||{amount:0,paid:0,balance:0}; x.amount+=p.amount; x.paid+=p.paidAmount; x.balance+=p.balanceAmount; m.set(k,x); } return [...m.entries()].sort((a,b)=>b[1].amount-a[1].amount); }, [purchases]);
  const paymentsByMethod = React.useMemo(() => { const m=new Map<string,number>(); for(const p of payments) m.set(p.method,(m.get(p.method)||0)+p.amount); return [...m.entries()].sort((a,b)=>b[1]-a[1]); },[payments]);

  function exportCurrent() {
    if (onExportCsv) { onExportCsv(tab); return; }
    const headers:string[]=[]; const data:unknown[][]=[];
    if (tab === "sales") { headers.push("Period","Products","Services","Laundry","Revenue","Expenses","Net Profit"); data.push(...rows.map(r=>[r.label,r.productSales,r.serviceRevenue,r.laundryRevenue,r.totalRevenue,r.expenses,r.netProfit])); }
    else if (tab === "dayend") { headers.push("Metric","Value"); data.push(["Total sales",dayEnd.totalSales],["Service revenue",dayEnd.serviceRevenue],["Cost of goods",dayEnd.costOfGoods],["Gross profit",dayEnd.grossProfit],["Total expenses",dayEnd.totalExpenses],["Net profit",dayEnd.netProfit],["Cash received",dayEnd.cashReceived],["Card / UPI",dayEnd.cardPayments],["Other payments",dayEnd.otherPayments],["Outstanding",dayEnd.outstandingAmount]); }
    else if (tab === "stock") { headers.push("Product","SKU","Stock","Min","Value"); data.push(...stock.map(r=>[r.name,r.sku||"",r.stock,r.min,r.value])); }
    else if (tab === "outstanding") { headers.push("Customer","Phone","Outstanding"); data.push(...outstanding.map(c=>[c.name,c.phone||"",c.outstanding])); }
    else if (tab === "customers") { headers.push("Name","Phone","Email","Address","Birthday","Total Spending","Outstanding"); data.push(...customers.map(c=>[c.name,c.phone||"",c.email||"",c.address||"",c.birthday||"",c.totalSpending,c.outstandingBalance])); }
    else if (tab === "services") { headers.push("Service Type","Orders","Revenue","Balance"); data.push(...servicesByType.map(([k,v])=>[k,v.count,v.revenue,v.balance])); }
    else if (tab === "expenses") { headers.push("Category","Amount"); data.push(...expenseByCategory); }
    else if (tab === "purchases") { headers.push("Supplier","Amount","Paid","Balance"); data.push(...purchaseBySupplier.map(([k,v])=>[k,v.amount,v.paid,v.balance])); }
    else if (tab === "staff") { headers.push("Staff","Role","Salary","Active Assignments","Completed Assignments"); data.push(...staff.map(s=>[s.name,s.role,s.salary,0,0])); }
    else { headers.push("Payment Method","Amount"); data.push(...paymentsByMethod); }
    downloadCsv(`minarvabiz-${tab}-report-${new Date().toISOString().slice(0,10)}.csv`, [headers,...data]);
  }

  const tabs:[ReportTab,string][]=[["sales","Sales"],["dayend","Day-end"],["stock","Inventory"],["outstanding","Outstanding"],["customers","Customers"],["services","Services"],["expenses","Expenses"],["purchases","Purchases"],["staff","Staff"],["payments","Payments"]];
  return <div className="space-y-4" id="minarva-report-print-root">
    <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div><h2 className="text-xl font-semibold text-slate-900">Reports & Analytics</h2><p className="text-sm text-slate-500">Sales, services, inventory, customers, expenses, purchases, staff and payment intelligence.</p></div>
      <div className="flex flex-wrap gap-2"><Button type="button" variant="outline" onClick={onRefresh}>Refresh</Button><Button type="button" variant="outline" onClick={exportCurrent}>Export CSV</Button><Button type="button" variant="outline" onClick={() => (onPrint ? onPrint() : window.print())}>Print</Button><Button type="button" onClick={() => (onPdf ? onPdf() : window.print())}>Save PDF</Button></div>
    </div>
    <div className="flex flex-wrap gap-2">{tabs.map(([t,label])=><Button type="button" size="sm" key={t} variant={tab===t?"primary":"outline"} onClick={()=>setTab(t)}>{label}</Button>)}</div>

    {tab==="sales"&&<Card><CardHeader><CardTitle className="text-sm font-semibold">Sales summary</CardTitle></CardHeader><CardContent className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="border-b text-left text-xs uppercase text-slate-400"><th className="pb-2">Period</th><th className="pb-2">Products</th><th className="pb-2">Services</th><th className="pb-2">Laundry</th><th className="pb-2">Revenue</th><th className="pb-2">Expenses</th><th className="pb-2">Net profit</th></tr></thead><tbody>{rows.map(r=><tr key={r.label} className="border-b border-slate-50"><td className="py-2 font-medium">{r.label}</td><td className="py-2">{formatMoney(r.productSales)}</td><td className="py-2">{formatMoney(r.serviceRevenue)}</td><td className="py-2">{formatMoney(r.laundryRevenue)}</td><td className="py-2 font-medium">{formatMoney(r.totalRevenue)}</td><td className="py-2">{formatMoney(r.expenses)}</td><td className={`py-2 font-semibold ${r.netProfit>=0?"text-emerald-600":"text-rose-600"}`}>{formatMoney(r.netProfit)}</td></tr>)}</tbody></table></CardContent></Card>}
    {tab==="dayend"&&<div className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">{[["Total sales",dayEnd.totalSales],["Service revenue",dayEnd.serviceRevenue],["Cost of goods",dayEnd.costOfGoods],["Gross profit",dayEnd.grossProfit],["Total expenses",dayEnd.totalExpenses],["Net profit",dayEnd.netProfit],["Cash received",dayEnd.cashReceived],["Card / UPI",dayEnd.cardPayments],["Other payments",dayEnd.otherPayments],["Outstanding",dayEnd.outstandingAmount]].map(([label,val])=><Card key={String(label)}><CardContent className="p-4"><div className="text-xs text-slate-500">{label}</div><div className="text-lg font-bold text-slate-900">{formatMoney(val as number)}</div></CardContent></Card>)}</div>}
    {tab==="stock"&&<Card><CardContent className="overflow-x-auto p-4"><table className="w-full text-sm"><thead><tr className="border-b text-left text-xs uppercase text-slate-400"><th className="pb-2">Product</th><th className="pb-2">SKU</th><th className="pb-2">Stock</th><th className="pb-2">Min</th><th className="pb-2">Value</th></tr></thead><tbody>{stock.map(r=><tr key={r.id} className="border-b border-slate-50"><td className="py-2 font-medium">{r.name}</td><td className="py-2 text-slate-500">{r.sku||"—"}</td><td className={`py-2 ${r.low?"font-semibold text-rose-600":""}`}>{r.stock}</td><td className="py-2">{r.min}</td><td className="py-2">{formatMoney(r.value)}</td></tr>)}</tbody></table></CardContent></Card>}
    {tab==="outstanding"&&<Card><CardContent className="space-y-2 p-4">{outstanding.length===0&&<p className="text-sm text-slate-400">No outstanding balances</p>}{outstanding.map(c=><div key={c.id} className="flex justify-between rounded-lg bg-slate-50 px-3 py-2 text-sm"><div><div className="font-medium">{c.name}</div><div className="text-xs text-slate-500">{c.phone||""}</div></div><span className="font-semibold text-rose-600">{formatMoney(c.outstanding)}</span></div>)}</CardContent></Card>}
