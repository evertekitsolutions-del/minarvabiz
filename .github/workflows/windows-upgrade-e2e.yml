name: Windows Upgrade E2E v1.0.8 to v1.0.9

on:
  push:
    branches:
      - qa/v1.0.8-to-v1.0.9-upgrade-e2e

permissions:
  contents: read

jobs:
  production-upgrade:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      MINARVA_RUNTIME_SMOKE: "1"
      MINARVA_OLD_VERSION: "1.0.8"
      MINARVA_NEW_VERSION: "1.0.9"
      MINARVA_UPDATE_MANIFEST_URL: "https://minarvabiz-license-admin.onrender.com/api/update/manifest"
      MINARVA_UPGRADE_RESULT: upgrade-e2e-result.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Download and verify immutable v1.0.8 installer
        shell: pwsh
        run: |
          $oldDir = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Old-Release"
          New-Item -ItemType Directory -Force -Path $oldDir | Out-Null
          gh release download "v$env:MINARVA_OLD_VERSION" --repo $env:GITHUB_REPOSITORY --pattern "MinarvaBiz-Setup-$env:MINARVA_OLD_VERSION.exe" --dir $oldDir --clobber
          $installer = Join-Path $oldDir "MinarvaBiz-Setup-$env:MINARVA_OLD_VERSION.exe"
          if (-not (Test-Path $installer)) { throw "Old release installer was not downloaded." }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$env:MINARVA_OLD_VERSION" | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq "MinarvaBiz-Setup-$env:MINARVA_OLD_VERSION.exe" } | Select-Object -First 1
          if (-not $asset -or -not $asset.digest) { throw "Old release digest metadata is unavailable." }
          $expected = "$($asset.digest)" -replace '^sha256:', ''
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
          if ($actual -ne $expected.ToLower()) { throw "v$env:MINARVA_OLD_VERSION installer SHA-256 mismatch." }
          Write-Host "OLD_RELEASE_HASH PASS version=$env:MINARVA_OLD_VERSION sha256=$actual"
          "OLD_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Clean install v1.0.8
        shell: pwsh
        run: |
          function Install-WithRetry([string]$Installer, [string]$Root, [string]$Label) {
            $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Installer).Hash
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              if (Test-Path $Root) { Remove-Item -Recurse -Force $Root -ErrorAction SilentlyContinue }
              New-Item -ItemType Directory -Force -Path $Root | Out-Null
              $copy = Join-Path $env:RUNNER_TEMP ("{0}-attempt-{1}.exe" -f $Label, $attempt)
              Copy-Item -LiteralPath $Installer -Destination $copy -Force
              Unblock-File -LiteralPath $copy -ErrorAction SilentlyContinue
              if ((Get-FileHash -Algorithm SHA256 -LiteralPath $copy).Hash -ne $sourceHash) { throw "$Label installer copy hash mismatch." }
              Start-Sleep -Milliseconds 750
              $proc = Start-Process -FilePath $copy -ArgumentList "/S", "/D=$Root" -PassThru -Wait
              $exit = $proc.ExitCode
              Remove-Item -LiteralPath $copy -Force -ErrorAction SilentlyContinue
              if ($exit -eq 0) { return }
              if ($exit -ne -1073741819 -or $attempt -eq 4) { throw "$Label installer exited with code $exit." }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }

          $installRoot = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Upgrade-E2E"
          Install-WithRetry $env:OLD_INSTALLER $installRoot "MinarvaBiz-Old"
          $exe = Join-Path $installRoot "Minarva Biz.exe"
          if (-not (Test-Path $exe)) { throw "v$env:MINARVA_OLD_VERSION installed executable is missing." }
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "OLD_INSTALL PASS $exe"

      - name: Launch installed v1.0.8 with CDP
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList "--remote-debugging-port=9222" -PassThru
          "OLD_APP_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($i=1; $i -le 45; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9222/json/list -TimeoutSec 2
              if ($response.StatusCode -eq 200) { Write-Host "OLD_CDP PASS"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 1
          }
          throw "v$env:MINARVA_OLD_VERSION Electron CDP port did not open."

      - name: Check, download, verify and launch update from v1.0.8
        shell: pwsh
        env:
          MINARVA_UPGRADE_CDP_PORT: "9222"
        run: node scripts/windows-upgrade-e2e.mjs before

      - name: Verify downloaded v1.0.9 and apply the launched installer silently
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          if (-not (Test-Path $env:MINARVA_UPGRADE_RESULT)) { throw "Updater E2E result file is missing." }
          $result = Get-Content -Raw $env:MINARVA_UPGRADE_RESULT | ConvertFrom-Json
          if ($result.phase -ne "install-launched") { throw "Updater did not reach install-launched phase: $($result.phase)" }
          $installer = "$($result.download.installerPath)"
          $backup = "$($result.install.backupPath)"
          if (-not (Test-Path $installer)) { throw "Downloaded verified v1.0.9 installer is missing." }
          if (-not (Test-Path $backup)) { throw "Pre-update backup is missing." }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$env:MINARVA_NEW_VERSION" | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq "MinarvaBiz-Setup-$env:MINARVA_NEW_VERSION.exe" } | Select-Object -First 1
          if (-not $asset -or -not $asset.digest) { throw "v$env:MINARVA_NEW_VERSION release digest metadata is unavailable." }
          $expected = "$($asset.digest)" -replace '^sha256:', ''
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
          if ($actual -ne $expected.ToLower()) { throw "Downloaded updater installer SHA-256 does not match immutable v$env:MINARVA_NEW_VERSION release." }
          Write-Host "DOWNLOADED_UPDATE_HASH PASS version=$env:MINARVA_NEW_VERSION sha256=$actual"

          $backupBytes = [System.IO.File]::ReadAllBytes($backup)
          if ($backupBytes.Length -lt 16 -or [System.Text.Encoding]::ASCII.GetString($backupBytes, 0, 16) -ne "SQLite format 3`0") {
            throw "Pre-update backup is not a valid SQLite file."
          }
          Write-Host "PRE_UPDATE_BACKUP_HEADER PASS $backup"

          if ($env:OLD_APP_PID) {
            Wait-Process -Id ([int]$env:OLD_APP_PID) -Timeout 10 -ErrorAction SilentlyContinue
            Stop-Process -Id ([int]$env:OLD_APP_PID) -Force -ErrorAction SilentlyContinue
          }

          # installUpdate() intentionally launches the verified interactive NSIS installer.
          # Close that interactive instance, then execute the exact same verified installer
          # silently so CI can complete the real upgrade unattended.
          Get-Process | ForEach-Object {
            try {
              if ($_.Path -eq $installer -or $_.MainWindowTitle -match 'Minarva Biz.*(Setup|Installer)') {
                Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
              }
            } catch {}
          }
          Start-Sleep -Seconds 1

          $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          $upgradeCopy = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Verified-Upgrade.exe"
          Copy-Item -LiteralPath $installer -Destination $upgradeCopy -Force
          Unblock-File -LiteralPath $upgradeCopy -ErrorAction SilentlyContinue
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $upgradeCopy).Hash -ne $sourceHash) { throw "Upgrade installer copy hash mismatch." }

          $upgrade = Start-Process -FilePath $upgradeCopy -ArgumentList "/S", "/D=$env:INSTALL_ROOT" -PassThru -Wait
          if ($upgrade.ExitCode -ne 0) { throw "Verified v$env:MINARVA_NEW_VERSION upgrade installer exited with code $($upgrade.ExitCode)." }
          Remove-Item -LiteralPath $upgradeCopy -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $env:INSTALLED_EXE)) { throw "Updated Minarva Biz executable is missing." }
          Write-Host "UPGRADE_INSTALLER_APPLIED PASS $env:MINARVA_OLD_VERSION -> $env:MINARVA_NEW_VERSION"

      - name: Launch upgraded v1.0.9 with CDP
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList "--remote-debugging-port=9224" -PassThru
          "NEW_APP_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($i=1; $i -le 45; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9224/json/list -TimeoutSec 2
              if ($response.StatusCode -eq 200) { Write-Host "NEW_CDP PASS"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 1
          }
          throw "v$env:MINARVA_NEW_VERSION Electron CDP port did not open."

      - name: Verify v1.0.9, data preservation and pre-update backup
        shell: pwsh
        env:
          MINARVA_UPGRADE_CDP_PORT: "9224"
        run: node scripts/windows-upgrade-e2e.mjs after

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          foreach ($pidValue in @($env:OLD_APP_PID, $env:NEW_APP_PID)) {
            if ($pidValue) { Stop-Process -Id ([int]$pidValue) -Force -ErrorAction SilentlyContinue }
          }
          if ($env:INSTALL_ROOT) {
            Get-Process | ForEach-Object {
              try {
                if ($_.Path -like "$env:INSTALL_ROOT*") { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
              } catch {}
            }
          }

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minarvabiz-v1.0.8-to-v1.0.9-upgrade-e2e
          path: |
            upgrade-e2e-result.json
            ${{ runner.temp }}/**/runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 30
