name: Approved Boutique v1.0.26 Release Dispatch

# One-time owner-authorized customer hotfix. Uses the EXISTING, separately
# reviewed Release Windows -> Publish Windows Release signed-update pipeline;
# never uploads an untested PR artifact or deploys customer data.
on:
  workflow_run:
    workflows: ["Windows Deep Installed Smoke"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-approved-hotfix:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Dispatch approved customer release exactly for v1.0.26
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          root_version="$(node -p 'require("./package.json").version')"
          if [[ "$version" != "1.0.26" || "$root_version" != "1.0.26" ]]; then
            echo "This one-time dispatch is authorized ONLY for Boutique Windows 1.0.26; skip $version."
            exit 0
          fi
          node - <<'NODE'
          const fs = require("node:fs");
          const notes = JSON.parse(fs.readFileSync("release-notes.json", "utf8"));
          if (!Array.isArray(notes["1.0.26"]) || notes["1.0.26"].length < 3) {
            throw new Error("Missing approved customer release notes for Windows 1.0.26");
          }
          NODE

          if gh release view v1.0.26 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.26 already published. Immutable release; no action."
            exit 0
          fi

          # Verify the run that passed the installed Windows UAT actually used
          # the current main commit (never dispatch from an outdated merge).
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$current" != "${{ github.event.workflow_run.head_sha }}" ]]; then
            echo "Main moved since Windows UAT; skip older commit."
            exit 0
          fi

          gh workflow run release-windows.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Authorized v1.0.26 Windows Release workflow dispatched."
