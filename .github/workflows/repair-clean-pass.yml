name: Clean end-to-end UI repair pass

on:
  push:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply clean repairs
        shell: bash
        run: |
          set -euo pipefail

          cat > packages/ui/src/components/CompleteModals.tsx <<'EOF'
          "use client";
          import * as React from "react";
          import { Button, FormField, Modal, inputClass, selectClass } from "./index";
          import { store, phase5Store, phase6Store } from "@minarvabiz/business-logic";
          import type { PaymentMethod, RoleName } from "@minarvabiz/types";

          export function CompleteModals({customerOpen,onCustomerOpenChange,productOpen,onProductOpenChange,expenseOpen,onExpenseOpenChange,purchaseOpen,onPurchaseOpenChange,staffOpen,onStaffOpenChange,onSaved}:{customerOpen:boolean;onCustomerOpenChange:(v:boolean)=>void;productOpen:boolean;onProductOpenChange:(v:boolean)=>void;expenseOpen:boolean;onExpenseOpenChange:(v:boolean)=>void;purchaseOpen:boolean;onPurchaseOpenChange:(v:boolean)=>void;staffOpen:boolean;onStaffOpenChange:(v:boolean)=>void;onSaved:()=>void|Promise<unknown>}){
            const [customer,setCustomer]=React.useState({name:"",phone:"",whatsapp:"",email:"",address:"",notes:""});
            const [product,setProduct]=React.useState({name:"",sku:"",barcode:"",categoryId:"",brand:"",size:"",color:"",fabric:"",unit:"pcs",costPrice:"",sellingPrice:"",discount:"0",taxRate:"0",stockQuantity:"0",minimumStock:"0",supplierId:"",imageUrl:"",notes:"",hasVariants:false});
            const [expense,setExpense]=React.useState({date:"",categoryId:"",amount:"",paymentMethod:"cash" as PaymentMethod,description:"",reference:"",orderId:""});
            const [purchase,setPurchase]=React.useState({supplierId:"",description:"",amount:"",paidAmount:"",paymentMethod:"cash" as PaymentMethod,kind:"general" as "general"|"order_specific",orderId:"",notes:""});
            const [staff,setStaff]=React.useState({name:"",phone:"",email:"",role:"staff" as RoleName,salary:"",joiningDate:"",notes:""});
            const [error,setError]=React.useState<string|null>(null);
            const resetCustomer=()=>setCustomer({name:"",phone:"",whatsapp:"",email:"",address:"",notes:""});
            const resetProduct=()=>setProduct({name:"",sku:"",barcode:"",categoryId:"",brand:"",size:"",color:"",fabric:"",unit:"pcs",costPrice:"",sellingPrice:"",discount:"0",taxRate:"0",stockQuantity:"0",minimumStock:"0",supplierId:"",imageUrl:"",notes:"",hasVariants:false});
            const saved=async()=>{setError(null);await onSaved();};
            const saveCustomer=async()=>{try{if(!customer.name.trim())throw new Error("Customer name is required");store.createCustomer({name:customer.name.trim(),phone:customer.phone||null,whatsapp:customer.whatsapp||null,email:customer.email||null,address:customer.address||null,notes:customer.notes||null});onCustomerOpenChange(false);resetCustomer();await saved();}catch(e){setError(e instanceof Error?e.message:String(e));}};
            const saveProduct=async()=>{try{if(!product.name.trim())throw new Error("Product name is required");store.createProduct({name:product.name.trim(),sku:product.sku||null,barcode:product.barcode||null,categoryId:product.categoryId||null,brand:product.brand||null,size:product.size||null,color:product.color||null,fabric:product.fabric||null,unit:product.unit||"pcs",costPrice:Number(product.costPrice)||0,sellingPrice:Number(product.sellingPrice)||0,discount:Number(product.discount)||0,taxRate:Number(product.taxRate)||0,stockQuantity:Number(product.stockQuantity)||0,minimumStock:Number(product.minimumStock)||0,supplierId:product.supplierId||null,imageUrl:product.imageUrl||null,notes:product.notes||null,isActive:true,hasVariants:product.hasVariants});onProductOpenChange(false);resetProduct();await saved();}catch(e){setError(e instanceof Error?e.message:String(e));}};
            const saveExpense=async()=>{try{if(!expense.categoryId)throw new Error("Expense category is required");if(Number(expense.amount)<=0)throw new Error("Expense amount must be positive");const r=phase5Store.createExpense({date:expense.date||undefined,categoryId:expense.categoryId,amount:Number(expense.amount)||0,paymentMethod:expense.paymentMethod,description:expense.description||null,reference:expense.reference||null,orderId:expense.orderId||null});if(r.errors.length)throw new Error(r.errors.join("; "));onExpenseOpenChange(false);setExpense({date:"",categoryId:"",amount:"",paymentMethod:"cash",description:"",reference:"",orderId:""});await saved();}catch(e){setError(e instanceof Error?e.message:String(e));}};
            const savePurchase=async()=>{try{if(!purchase.description.trim())throw new Error("Purchase description is required");if(Number(purchase.amount)<=0)throw new Error("Purchase amount must be positive");const r=phase5Store.createPurchase({supplierId:purchase.supplierId||null,description:purchase.description.trim(),amount:Number(purchase.amount)||0,paymentMethod:purchase.paymentMethod,paidAmount:Number(purchase.paidAmount)||0,kind:purchase.kind,orderId:purchase.orderId||null,notes:purchase.notes||null});if(r.errors.length)throw new Error(r.errors.join("; "));onPurchaseOpenChange(false);setPurchase({supplierId:"",description:"",amount:"",paidAmount:"",paymentMethod:"cash",kind:"general",orderId:"",notes:""});await saved();}catch(e){setError(e instanceof Error?e.message:String(e));}};
            const saveStaff=async()=>{try{if(!staff.name.trim())throw new Error("Staff name is required");phase6Store.createStaff({name:staff.name.trim(),phone:staff.phone||null,email:staff.email||null,role:staff.role,salary:Number(staff.salary)||0,joiningDate:staff.joiningDate||null,notes:staff.notes||null});onStaffOpenChange(false);setStaff({name:"",phone:"",email:"",role:"staff",salary:"",joiningDate:"",notes:""});await saved();}catch(e){setError(e instanceof Error?e.message:String(e));}};
            const footer=(close:()=>void,save:()=>void|Promise<unknown>,label:string)=><><Button type="button" variant="outline" onClick={close}>Cancel</Button><Button type="button" onClick={()=>void save()}>{label}</Button></>;
            return <>
              <Modal open={customerOpen} title="Add Customer" onClose={()=>onCustomerOpenChange(false)} footer={footer(()=>onCustomerOpenChange(false),saveCustomer,"Save Customer")}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Name *"><input className={inputClass} value={customer.name} onChange={e=>setCustomer({...customer,name:e.target.value})}/></FormField><FormField label="Phone"><input className={inputClass} value={customer.phone} onChange={e=>setCustomer({...customer,phone:e.target.value})}/></FormField><FormField label="WhatsApp"><input className={inputClass} value={customer.whatsapp} onChange={e=>setCustomer({...customer,whatsapp:e.target.value})}/></FormField><FormField label="Email"><input className={inputClass} type="email" value={customer.email} onChange={e=>setCustomer({...customer,email:e.target.value})}/></FormField><FormField label="Address"><textarea className={inputClass+" h-20 py-2"} value={customer.address} onChange={e=>setCustomer({...customer,address:e.target.value})}/></FormField><FormField label="Notes"><textarea className={inputClass+" h-20 py-2"} value={customer.notes} onChange={e=>setCustomer({...customer,notes:e.target.value})}/></FormField></div>{error&&<p className="mt-3 text-sm text-rose-600">{error}</p>}</Modal>
              <Modal open={productOpen} title="Add Product" onClose={()=>onProductOpenChange(false)} footer={footer(()=>onProductOpenChange(false),saveProduct,"Save Product")}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Product name *"><input className={inputClass} value={product.name} onChange={e=>setProduct({...product,name:e.target.value})}/></FormField><FormField label="SKU"><input className={inputClass} value={product.sku} onChange={e=>setProduct({...product,sku:e.target.value})}/></FormField><FormField label="Barcode"><input className={inputClass} value={product.barcode} onChange={e=>setProduct({...product,barcode:e.target.value})}/></FormField><FormField label="Category"><input className={inputClass} value={product.categoryId} onChange={e=>setProduct({...product,categoryId:e.target.value})} placeholder="Category ID"/></FormField><FormField label="Brand"><input className={inputClass} value={product.brand} onChange={e=>setProduct({...product,brand:e.target.value})}/></FormField><FormField label="Size"><input className={inputClass} value={product.size} onChange={e=>setProduct({...product,size:e.target.value})}/></FormField><FormField label="Color"><input className={inputClass} value={product.color} onChange={e=>setProduct({...product,color:e.target.value})}/></FormField><FormField label="Fabric"><input className={inputClass} value={product.fabric} onChange={e=>setProduct({...product,fabric:e.target.value})}/></FormField><FormField label="Unit"><input className={inputClass} value={product.unit} onChange={e=>setProduct({...product,unit:e.target.value})}/></FormField><FormField label="Cost price"><input className={inputClass} type="number" value={product.costPrice} onChange={e=>setProduct({...product,costPrice:e.target.value})}/></FormField><FormField label="Selling price *"><input className={inputClass} type="number" value={product.sellingPrice} onChange={e=>setProduct({...product,sellingPrice:e.target.value})}/></FormField><FormField label="Discount %"><input className={inputClass} type="number" value={product.discount} onChange={e=>setProduct({...product,discount:e.target.value})}/></FormField><FormField label="Tax %"><input className={inputClass} type="number" value={product.taxRate} onChange={e=>setProduct({...product,taxRate:e.target.value})}/></FormField><FormField label="Opening stock"><input className={inputClass} type="number" value={product.stockQuantity} onChange={e=>setProduct({...product,stockQuantity:e.target.value})}/></FormField><FormField label="Minimum stock"><input className={inputClass} type="number" value={product.minimumStock} onChange={e=>setProduct({...product,minimumStock:e.target.value})}/></FormField><FormField label="Supplier"><input className={inputClass} value={product.supplierId} onChange={e=>setProduct({...product,supplierId:e.target.value})}/></FormField><FormField label="Image URL"><input className={inputClass} value={product.imageUrl} onChange={e=>setProduct({...product,imageUrl:e.target.value})}/></FormField><FormField label="Notes"><textarea className={inputClass+" h-20 py-2"} value={product.notes} onChange={e=>setProduct({...product,notes:e.target.value})}/></FormField><label className="flex items-center gap-2 text-sm sm:col-span-2"><input type="checkbox" checked={product.hasVariants} onChange={e=>setProduct({...product,hasVariants:e.target.checked})}/> Product has variants</label></div>{error&&<p className="mt-3 text-sm text-rose-600">{error}</p>}</Modal>
              <Modal open={expenseOpen} title="Add Expense" onClose={()=>onExpenseOpenChange(false)} footer={footer(()=>onExpenseOpenChange(false),saveExpense,"Save Expense")}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Date"><input className={inputClass} type="date" value={expense.date} onChange={e=>setExpense({...expense,date:e.target.value})}/></FormField><FormField label="Category *"><input className={inputClass} value={expense.categoryId} onChange={e=>setExpense({...expense,categoryId:e.target.value})} placeholder="Category ID"/></FormField><FormField label="Amount *"><input className={inputClass} type="number" value={expense.amount} onChange={e=>setExpense({...expense,amount:e.target.value})}/></FormField><FormField label="Payment method"><select className={selectClass} value={expense.paymentMethod} onChange={e=>setExpense({...expense,paymentMethod:e.target.value as PaymentMethod})}><option value="cash">Cash</option><option value="card">Card</option><option value="upi">UPI</option><option value="bank">Bank</option><option value="online">Online</option><option value="other">Other</option></select></FormField><FormField label="Order ID"><input className={inputClass} value={expense.orderId} onChange={e=>setExpense({...expense,orderId:e.target.value})}/></FormField><FormField label="Description"><textarea className={inputClass+" h-20 py-2"} value={expense.description} onChange={e=>setExpense({...expense,description:e.target.value})}/></FormField><FormField label="Reference"><input className={inputClass} value={expense.reference} onChange={e=>setExpense({...expense,reference:e.target.value})}/></FormField></div>{error&&<p className="mt-3 text-sm text-rose-600">{error}</p>}</Modal>
              <Modal open={purchaseOpen} title="Add Purchase" onClose={()=>onPurchaseOpenChange(false)} footer={footer(()=>onPurchaseOpenChange(false),savePurchase,"Save Purchase")}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Supplier ID"><input className={inputClass} value={purchase.supplierId} onChange={e=>setPurchase({...purchase,supplierId:e.target.value})}/></FormField><FormField label="Description *"><input className={inputClass} value={purchase.description} onChange={e=>setPurchase({...purchase,description:e.target.value})}/></FormField><FormField label="Amount *"><input className={inputClass} type="number" value={purchase.amount} onChange={e=>setPurchase({...purchase,amount:e.target.value})}/></FormField><FormField label="Paid amount"><input className={inputClass} type="number" value={purchase.paidAmount} onChange={e=>setPurchase({...purchase,paidAmount:e.target.value})}/></FormField><FormField label="Payment method"><select className={selectClass} value={purchase.paymentMethod} onChange={e=>setPurchase({...purchase,paymentMethod:e.target.value as PaymentMethod})}><option value="cash">Cash</option><option value="card">Card</option><option value="upi">UPI</option><option value="bank">Bank</option><option value="online">Online</option><option value="other">Other</option></select></FormField><FormField label="Purchase type"><select className={selectClass} value={purchase.kind} onChange={e=>setPurchase({...purchase,kind:e.target.value as "general"|"order_specific"})}><option value="general">General / Stock</option><option value="order_specific">Order-specific</option></select></FormField><FormField label="Order ID"><input className={inputClass} value={purchase.orderId} onChange={e=>setPurchase({...purchase,orderId:e.target.value})}/></FormField><FormField label="Notes"><textarea className={inputClass+" h-20 py-2"} value={purchase.notes} onChange={e=>setPurchase({...purchase,notes:e.target.value})}/></FormField></div>{error&&<p className="mt-3 text-sm text-rose-600">{error}</p>}</Modal>
              <Modal open={staffOpen} title="Add Staff" onClose={()=>onStaffOpenChange(false)} footer={footer(()=>onStaffOpenChange(false),saveStaff,"Save Staff")}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Name *"><input className={inputClass} value={staff.name} onChange={e=>setStaff({...staff,name:e.target.value})}/></FormField><FormField label="Phone"><input className={inputClass} value={staff.phone} onChange={e=>setStaff({...staff,phone:e.target.value})}/></FormField><FormField label="Email"><input className={inputClass} type="email" value={staff.email} onChange={e=>setStaff({...staff,email:e.target.value})}/></FormField><FormField label="Role"><select className={selectClass} value={staff.role} onChange={e=>setStaff({...staff,role:e.target.value as RoleName})}><option value="staff">Staff</option><option value="tailor">Tailor</option><option value="cashier">Cashier</option><option value="manager">Manager</option><option value="admin">Admin</option></select></FormField><FormField label="Salary"><input className={inputClass} type="number" value={staff.salary} onChange={e=>setStaff({...staff,salary:e.target.value})}/></FormField><FormField label="Joining date"><input className={inputClass} type="date" value={staff.joiningDate} onChange={e=>setStaff({...staff,joiningDate:e.target.value})}/></FormField><FormField label="Notes" ><textarea className={inputClass+" h-20 py-2"} value={staff.notes} onChange={e=>setStaff({...staff,notes:e.target.value})}/></FormField></div>{error&&<p className="mt-3 text-sm text-rose-600">{error}</p>}</Modal>
            </>;
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          def rep(path,old,new):
              p=Path(path);s=p.read_text();
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))
          rep('packages/ui/src/components/layout/Header.tsx','  onNotificationsClick?: () => void;\n  onMessagesClick?: () => void;','  onNotificationsClick?: () => void;\n  onMessagesClick?: () => void;\n  onCalendarClick?: (date: string) => void;')
          rep('packages/ui/src/components/layout/Header.tsx','  onNotificationsClick,\n  onMessagesClick,\n  onLogout,','  onNotificationsClick,\n  onMessagesClick,\n  onCalendarClick,\n  onLogout,')
          rep('packages/ui/src/components/layout/Header.tsx','  const [query, setQuery] = React.useState("");\n  const today =','  const [query, setQuery] = React.useState("");\n  const [calendarOpen, setCalendarOpen] = React.useState(false);\n  const [selectedDate, setSelectedDate] = React.useState(() => new Date().toISOString().slice(0, 10));\n  const today =')
          rep('packages/ui/src/components/sales/PosBilling.tsx','  onFindByBarcode?: (barcode: string) => Product | undefined;\n}','  onFindByBarcode?: (barcode: string) => Product | undefined;\n  onAddCustomer?: () => void;\n}')
          rep('packages/ui/src/components/sales/PosBilling.tsx','export function PosBilling({ products, customers, onCompleteSale, onComplete, onFindByBarcode }: PosBillingProps) {','export function PosBilling({ products, customers, onCompleteSale, onComplete, onFindByBarcode, onAddCustomer }: PosBillingProps) {')
          rep('apps/desktop/src/App.tsx','  const [custOpen, setCustOpen] = React.useState(false);\n  const [custForm, setCustForm] = React.useState({ name: "", phone: "", email: "" });','  const [custOpen, setCustOpen] = React.useState(false);\n  const [productOpen, setProductOpen] = React.useState(false);')
          rep('apps/desktop/src/App.tsx','  const autoBackupInFlight = React.useRef(false);','  const autoBackupInFlight = React.useRef(false);')
          rep('apps/desktop/src/App.tsx','  const [custOpen, setCustOpen] = React.useState(false);\n  const [productOpen, setProductOpen] = React.useState(false);','  const [custOpen, setCustOpen] = React.useState(false);\n  const [productOpen, setProductOpen] = React.useState(false);')
          p=Path('apps/desktop/src/App.tsx');s=p.read_text()
          # Add import.
          s=s.replace('  TrialGate,\n','  TrialGate,\n  CompleteModals,\n',1)
          # Header callbacks.
          s=s.replace('header={{ showSearch: view !== "dashboard", title: view === "services" ? "Services & Orders" : view, subtitle: "Welcome back, Admin!", notificationCount: phase6Store.unreadNotificationCount(), messageCount: 3 }}','header={{ showSearch: view !== "dashboard", title: view === "services" ? "Services & Orders" : view, subtitle: "Welcome back, Admin!", notificationCount: phase6Store.unreadNotificationCount(), messageCount: phase6Store.unreadNotificationCount(), onMessagesClick: () => navTo("notifications"), onNotificationsClick: () => navTo("notifications"), onCalendarClick: () => navTo("reports") }}',1)
          # Nav wiring.
          s=s.replace('<ProductList products={products} categories={categories} lowStockOnly={lowStockOnly} onToggleLowStock={() => setLowStockOnly((v) => !v)} />','<ProductList products={products} categories={categories} lowStockOnly={lowStockOnly} onToggleLowStock={() => setLowStockOnly((v) => !v)} onAdd={() => setProductOpen(true)} />',1)
          s=s.replace('<PosBilling products={products} customers={customers} onCompleteSale={handleSale} />','<PosBilling products={products} customers={customers} onAddCustomer={() => setCustOpen(true)} onCompleteSale={handleSale} />',1)
          s=s.replace('<OrderForm value={form} customers={customers} profiles={profiles} onChange={setForm} onLoadProfiles={(customerId) => setProfiles(ordersStore.listMeasurementProfiles(customerId))} onSubmit={handleCreateOrder} onCancel={() => setCreateOpen(false)} error={formError} />','<OrderForm value={form} customers={customers} profiles={profiles} onChange={setForm} onLoadProfiles={(customerId) => setProfiles(ordersStore.listMeasurementProfiles(customerId))} onAddCustomer={() => setCustOpen(true)} onSubmit={handleCreateOrder} onCancel={() => setCreateOpen(false)} error={formError} />',1)
          s=s.replace('<LaundryForm mode={laundryMode || "outsourced"} customers={customers} suppliers={suppliers} onSubmit={handleCreateLaundry} onCancel={() => setLaundryMode(null)} error={laundryError} />','<LaundryForm mode={laundryMode || "outsourced"} customers={customers} suppliers={suppliers} onAddCustomer={() => setCustOpen(true)} onSubmit={handleCreateLaundry} onCancel={() => setLaundryMode(null)} error={laundryError} />',1)
          # Remove customer inline modal.
          start='    {view === "customers" && <><CustomerList customers={customers} onAdd={() => setCustOpen(true)} onSearch={(q) => setCustomers(store.listCustomers(q))} />'
          if start in s:
              st=s.index(start); en=s.index('</Modal></>}',st)+len('</Modal></>}'); s=s[:st]+'    {view === "customers" && <CustomerList customers={customers} onAdd={() => setCustOpen(true)} onSearch={(q) => setCustomers(store.listCustomers(q))} /> }'+s[en:]
          # Replace all old CRUD modal block with shared modals.
          st=s.index('    <Modal open={expenseOpen} title="Add Expense"'); en=s.index('    {moduleError',st)
          shared='''    <CompleteModals customerOpen={custOpen} onCustomerOpenChange={setCustOpen} productOpen={productOpen} onProductOpenChange={setProductOpen} expenseOpen={expenseOpen} onExpenseOpenChange={setExpenseOpen} purchaseOpen={purchaseOpen} onPurchaseOpenChange={setPurchaseOpen} staffOpen={staffOpen} onStaffOpenChange={setStaffOpen} onSaved={persistAndRefresh} />\n'''
          s=s[:st]+shared+s[en:]
          # Reports pass-through.
          s=s.replace('{view === "reports" && <ReportsPanel salesRows={reportSales} dayEnd={reportDayEnd} stock={reportStock} outstanding={reportOutstanding} />}','{view === "reports" && <ReportsPanel salesRows={reportSales} dayEnd={reportDayEnd} stock={reportStock} outstanding={reportOutstanding} customers={customers} expenses={expenses} purchases={purchases} orders={orders} staff={staff} onRefresh={() => { void persistAndRefresh(); }} onPrint={() => window.print()} onPdf={() => window.print()} />}',1)
          p.write_text(s)
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @minarvabiz/ui typecheck
          pnpm --filter @minarvabiz/desktop typecheck
          pnpm --filter @minarvabiz/desktop build:renderer
          pnpm --filter @minarvabiz/desktop build:electron
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages
          git rm .github/workflows/repair-clean-pass.yml
          git diff --cached --check
          git commit -m "fix: complete desktop CRUD navigation and reports"
          git push
