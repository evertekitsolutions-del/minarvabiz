name: Bigcapital integration preview
on:
  pull_request:
    paths:
      - 'packages/business-logic/src/bigcapital-journal-preview.ts'
      - 'packages/business-logic/src/__tests__/bigcapital-journal-preview.test.mjs'
      - 'scripts/bigcapital-*.mjs'
      - 'packages/ui/src/components/accounting/**'
      - '.github/workflows/bigcapital-preview.yml'
  push:
    branches: [main]
    paths:
      - 'packages/business-logic/src/bigcapital-journal-preview.ts'
      - 'scripts/bigcapital-*.mjs'
      - '.github/workflows/bigcapital-preview.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node --experimental-strip-types --test packages/business-logic/src/__tests__/bigcapital-journal-preview.test.mjs scripts/bigcapital-readonly.test.mjs
