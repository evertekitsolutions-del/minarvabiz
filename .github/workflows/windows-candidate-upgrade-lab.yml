name: P0 Isolated Windows Candidate Upgrade Lab

# This tests the real installed Windows NSIS path with synthetic data, BEFORE
# any new version is publicly published. It never triggers Publish Windows Release.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-candidate-upgrade-lab.yml"
      - "scripts/windows-candidate-upgrade-fixture.mjs"
      - "scripts/windows-candidate-upgrade-cdp.mjs"
      - "scripts/windows-candidate-upgrade-lab-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-prepublication-nsis:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GITHUB_ACTIONS: "true"
      MINARVA_ISOLATED_UPGRADE_LAB: "1"
      MINARVA_RUNTIME_SMOKE: "1"
      MINARVA_COMMERCIAL_RELEASE: "1"
      MINARVA_CDP_PORT: "9228"
      SOURCE_VERSION: "1.0.26"
      LAB_CANDIDATE_VERSION: "1.0.27"
      VITE_LICENSE_API_URL: "https://minarva-biz-license-edge.minarva-biz.workers.dev"
      MINARVA_UPDATE_MANIFEST_URL: "https://minarva-biz-license-edge.minarva-biz.workers.dev/api/update/manifest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify this workflow never publishes or handles customer data
        run: node --test scripts/windows-candidate-upgrade-lab-contract.test.mjs

      - name: Install isolated fixture and packaging dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch ONLY production public verification key
        run: node scripts/fetch-license-public-key.mjs

      - name: Configure independent public key for UNPUBLISHED test candidate
        shell: pwsh
        run: |
          $key = "$env:MINARVA_LICENSE_PUBLIC_KEY_HEX".Trim()
          if ($key.Length -ne 64 -or $key -notmatch '^[0-9a-fA-F]+$') {
            throw "Production public verification key is unavailable"
          }
          "MINARVA_UPDATE_PUBLIC_KEY_HEX=$key" | Out-File $env:GITHUB_ENV -Append

      - name: Build an UNPUBLISHED ephemeral 1.0.27 lab candidate
        shell: pwsh
        run: |
          $package = "apps/desktop/package.json"
          $json = Get-Content -LiteralPath $package -Raw | ConvertFrom-Json
          if ($json.version -ne $env:SOURCE_VERSION) { throw "Unexpected checked-in desktop source version" }
          $json.version = $env:LAB_CANDIDATE_VERSION
          $json | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $package -Encoding utf8
          node scripts/windows-package-resilient.mjs
          $candidate = Get-ChildItem apps/desktop/release -Filter "MinarvaBiz-Setup-$env:LAB_CANDIDATE_VERSION.exe" |
            Select-Object -First 1
          if (-not $candidate) { throw "Ephemeral candidate installer missing" }
          $hash = (Get-FileHash -Algorithm SHA256 $candidate.FullName).Hash.ToLower()
          "LAB_CANDIDATE=$($candidate.FullName)" | Out-File $env:GITHUB_ENV -Append
          "LAB_CANDIDATE_HASH=$hash" | Out-File $env:GITHUB_ENV -Append
          Write-Host "UNPUBLISHED_LAB_CANDIDATE_PASS commit=$env:GITHUB_SHA sha256=$hash"
          # This version change exists ONLY in runner workspace, never in git or public releases.

      - name: Download and independently verify published v1.0.26 source
        shell: pwsh
        run: |
          $name = "MinarvaBiz-Setup-$env:SOURCE_VERSION.exe"
          $base = "https://github.com/evertekitsolutions-del/minarvabiz/releases/download/v$env:SOURCE_VERSION"
          $old = Join-Path $env:RUNNER_TEMP $name
          $checksum = "$old.sha256"
          Invoke-WebRequest -UseBasicParsing -Uri "$base/$name" -OutFile $old
          Invoke-WebRequest -UseBasicParsing -Uri "$base/$name.sha256" -OutFile $checksum
          $expected = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 $old).Hash.ToLower()
          if ($expected -notmatch '^[a-f0-9]{64}$' -or $expected -ne $actual) {
            throw "Published v1.0.26 installer failed independent SHA256 verification"
          }
          "PUBLISHED_SOURCE_INSTALLER=$old" | Out-File $env:GITHUB_ENV -Append
          Write-Host "PUBLISHED_SOURCE_SHA256 PASS $actual"

      - name: Install published source on fresh isolated Windows runner
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "MinarvaBoutique-PreRelease-Lab"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $exitCode = $null
          for ($try = 1; $try -le 3; $try++) {
            $copy = Join-Path $env:RUNNER_TEMP ("source-installer-attempt-$try.exe")
            Copy-Item -LiteralPath $env:PUBLISHED_SOURCE_INSTALLER -Destination $copy -Force
            Unblock-File -LiteralPath $copy -ErrorAction SilentlyContinue
            $proc = Start-Process $copy -ArgumentList "/S", "/D=$root" -Wait -PassThru
            $exitCode = $proc.ExitCode
            Remove-Item -LiteralPath $copy -Force -ErrorAction SilentlyContinue
            if ($exitCode -eq 0) { break }
            if ($exitCode -ne -1073741819 -or $try -eq 3) {
              throw "Published source NSIS failed: $exitCode"
            }
            Start-Sleep -Seconds ($try * 2)
          }
          $exe = Join-Path $root "Minarva Biz.exe"
          if (-not (Test-Path $exe)) { throw "Published source executable not installed" }
          "LAB_INSTALL_ROOT=$root" | Out-File $env:GITHUB_ENV -Append
          "LAB_APP_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          Write-Host "ISOLATED_OLD_NSIS_INSTALL PASS"

      - name: Activate synthetic trial on published source
        shell: pwsh
        run: |
          $app = Start-Process -FilePath $env:LAB_APP_EXE -ArgumentList "--remote-debugging-port=$env:MINARVA_CDP_PORT" -PassThru
          try {
            $env:EXPECTED_APP_VERSION = $env:SOURCE_VERSION
            node scripts/windows-candidate-upgrade-cdp.mjs activate
            if ($LASTEXITCODE -ne 0) { throw "Source activation/bootstrap failed" }
          } finally {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -eq $env:LAB_APP_EXE } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }

      - name: Locate source-generated SQLite and seed 51 synthetic product rows
        shell: pwsh
        run: |
          $found = @(Get-ChildItem -Path $env:APPDATA -Filter "minarvabiz.db" -Recurse -File -ErrorAction SilentlyContinue)
          if ($found.Count -ne 1) { throw "Expected exactly one source-built SQLite DB under isolated runner APPDATA; found $($found.Count)" }
          $sourceDb = $found[0].FullName
          $fixture = Join-Path $env:RUNNER_TEMP "MinarvaCandidateFixture"
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $workingDb = Join-Path $fixture "minarvabiz.db"
          $state = Join-Path $fixture "lab-data-fingerprint.json"
          Copy-Item -LiteralPath $sourceDb -Destination $workingDb
          node --experimental-strip-types scripts/windows-candidate-upgrade-fixture.mjs seed $workingDb $state
          if ($LASTEXITCODE -ne 0) { throw "Source lab fixture seeding failed" }
          Copy-Item -LiteralPath $workingDb -Destination $sourceDb -Force
          "LAB_SOURCE_DB=$sourceDb" | Out-File $env:GITHUB_ENV -Append
          "LAB_WORK_DB=$workingDb" | Out-File $env:GITHUB_ENV -Append
          "LAB_FINGERPRINT=$state" | Out-File $env:GITHUB_ENV -Append

      - name: Prove published source opens and preserves populated data
        shell: pwsh
        run: |
          $app = Start-Process -FilePath $env:LAB_APP_EXE -ArgumentList "--remote-debugging-port=$env:MINARVA_CDP_PORT" -PassThru
          try {
            $env:EXPECTED_APP_VERSION = $env:SOURCE_VERSION
            node scripts/windows-candidate-upgrade-cdp.mjs verify
            if ($LASTEXITCODE -ne 0) { throw "Published source could not hydrate 51 synthetic products" }
          } finally {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -eq $env:LAB_APP_EXE } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          Copy-Item -LiteralPath $env:LAB_SOURCE_DB -Destination $env:LAB_WORK_DB -Force
          node --experimental-strip-types scripts/windows-candidate-upgrade-fixture.mjs verify $env:LAB_WORK_DB $env:LAB_FINGERPRINT
          if ($LASTEXITCODE -ne 0) { throw "Published source altered populated synthetic ledger before upgrade" }

      - name: Preserve independently verified complete pre-upgrade source image
        shell: pwsh
        run: |
          $backupDir = Join-Path $env:RUNNER_TEMP "MinarvaCandidatePreUpgradeBackup"
          New-Item -ItemType Directory -Path $backupDir -Force | Out-Null
          $copy = Join-Path $backupDir "minarvabiz.db"
          Copy-Item -LiteralPath $env:LAB_SOURCE_DB -Destination $copy -Force
          $a = (Get-FileHash -Algorithm SHA256 $env:LAB_SOURCE_DB).Hash
          $b = (Get-FileHash -Algorithm SHA256 $copy).Hash
          if ($a -ne $b) { throw "Independent pre-upgrade backup SHA256 mismatch" }
          "LAB_PREUPGRADE_BACKUP=$copy" | Out-File $env:GITHUB_ENV -Append
          "LAB_PREUPGRADE_BACKUP_SHA256=$b" | Out-File $env:GITHUB_ENV -Append
          Write-Host "ISOLATED_PREUPGRADE_BACKUP_PASS sha256=$b"

      - name: Install unpublished test candidate IN PLACE through NSIS
        shell: pwsh
        run: |
          $actual = (Get-FileHash -Algorithm SHA256 $env:LAB_CANDIDATE).Hash.ToLower()
          if ($actual -ne $env:LAB_CANDIDATE_HASH) { throw "Candidate changed after packaging" }
          $copy = Join-Path $env:RUNNER_TEMP "ephemeral-test-candidate.exe"
          Copy-Item -LiteralPath $env:LAB_CANDIDATE -Destination $copy -Force
          Unblock-File -LiteralPath $copy -ErrorAction SilentlyContinue
          $proc = Start-Process $copy -ArgumentList "/S", "/D=$env:LAB_INSTALL_ROOT" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Unpublished NSIS in-place upgrade failed $($proc.ExitCode)" }
          Write-Host "UNPUBLISHED_NSIS_IN_PLACE_UPGRADE PASS"

      - name: Verify candidate desktop, trial and complete synthetic business records
        shell: pwsh
        run: |
          $app = Start-Process -FilePath $env:LAB_APP_EXE -ArgumentList "--remote-debugging-port=$env:MINARVA_CDP_PORT" -PassThru
          try {
            $env:EXPECTED_APP_VERSION = $env:LAB_CANDIDATE_VERSION
            node scripts/windows-candidate-upgrade-cdp.mjs verify
            if ($LASTEXITCODE -ne 0) { throw "Candidate renderer/trial regression" }
          } finally {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -eq $env:LAB_APP_EXE } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          Copy-Item -LiteralPath $env:LAB_SOURCE_DB -Destination $env:LAB_WORK_DB -Force
          node --experimental-strip-types scripts/windows-candidate-upgrade-fixture.mjs verify $env:LAB_WORK_DB $env:LAB_FINGERPRINT
          if ($LASTEXITCODE -ne 0) { throw "Customer-equivalent core records lost during in-place upgrade" }
          $backupHash = (Get-FileHash -Algorithm SHA256 $env:LAB_PREUPGRADE_BACKUP).Hash
          if ($backupHash -ne $env:LAB_PREUPGRADE_BACKUP_SHA256) { throw "Pre-upgrade rollback image changed" }
          Write-Host "P0_CANDIDATE_NSIS_LEDGER_PRESERVATION PASS"
          Write-Host "Note: automatic signed-update channel and physical printer acceptance require separate testing."

      - name: Clean isolated processes and copies
        if: always()
        shell: pwsh
        run: |
          if ($env:LAB_APP_EXE) {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -eq $env:LAB_APP_EXE } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
          # Never upload or publish test .exe, raw SQLite images, trial files or signing data.
