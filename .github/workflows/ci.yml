name: CI

# Production verification: web + Electron renderer/main + Windows installer.
# The lockfile is committed and CI always installs with frozen-lockfile.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/web exec tsc --noEmit
      - run: pnpm --filter @minarvabiz/web build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against legacy JSON persistence
        shell: bash
        run: |
          if grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --include='*.cjs' \
            'minarvabiz-db\.json|db:(read|write)([^A-Za-z0-9_]|$)' apps/desktop; then
            echo "Legacy JSON database persistence must not be reintroduced into desktop source."
            exit 1
          fi
          echo "Legacy JSON database persistence is absent from desktop source."
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Static production quality smoke
        run: node scripts/quality-smoke.mjs
      - run: pnpm --filter @minarvabiz/business-logic typecheck
      - run: pnpm --filter @minarvabiz/ui typecheck
      - run: pnpm --filter @minarvabiz/desktop typecheck
      - run: pnpm --filter @minarvabiz/desktop build:renderer
      - name: Inspect generated renderer CSS
        shell: bash
        run: |
          test -f apps/desktop/dist/index.html
          css=$(find apps/desktop/dist -type f -name '*.css' | head -n 1)
          test -n "$css"
          echo "CSS bundle: $css"
          for token in '.bg-blue-500' '.bg-emerald-500' '.bg-violet-500' '.text-white'; do
            grep -q "$token" "$css" || { echo "Missing expected CSS token: $token"; exit 1; }
          done
          if grep -Eq '(src|href)="/' apps/desktop/dist/index.html; then
            echo "Production renderer contains an absolute asset URL that can break under file://."
            cat apps/desktop/dist/index.html
            exit 1
          fi
          grep -Eq 'href="\./assets/[^" ]+\.css"' apps/desktop/dist/index.html || {
            echo "Production renderer index.html does not reference its bundled stylesheet.";
            cat apps/desktop/dist/index.html;
            exit 1;
          }
          echo "Renderer index.html references a relative bundled stylesheet and Tailwind color utilities are present."
      - run: pnpm --filter @minarvabiz/desktop build:electron

  windows-package:
    runs-on: windows-latest
    needs: desktop
    env:
      MINARVA_RUNTIME_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/desktop run package:win
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          Write-Host "Installer: $($installer.FullName)"
      - name: Windows installed-runtime smoke
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "MinarvaBiz-UAT"
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installRoot" -Wait
          $exe = Join-Path $installRoot "Minarva Biz.exe"
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem -Path $installRoot -Filter *.exe -Recurse -ErrorAction Stop | Where-Object { $_.Name -notlike "*Setup*.exe" } | Select-Object -First 1 | ForEach-Object FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw "Installed Minarva Biz executable was not found." }
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 15
            if ($proc.HasExited) { throw "Minarva Biz exited during runtime smoke test (exit code $($proc.ExitCode))." }
            $dbRoots = @($env:APPDATA, $env:LOCALAPPDATA, $env:PROGRAMDATA) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
            $db = $null
            foreach ($root in $dbRoots) {
              $candidate = Get-ChildItem -Path $root -Filter "minarvabiz.db" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($candidate) { $db = $candidate; break }
            }
            if (-not $db) { throw "SQLite database was not created anywhere under the standard Windows application-data roots." }
            $bytes = [System.IO.File]::ReadAllBytes($db.FullName)
            if ($bytes.Length -lt 16 -or [System.Text.Encoding]::ASCII.GetString($bytes, 0, 16) -ne "SQLite format 3`0") { throw "Located minarvabiz.db is not a valid SQLite database: $($db.FullName)" }
            Write-Host "Runtime smoke PASS: process alive and valid SQLite database found at $($db.FullName)"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Capture Windows runtime diagnostics
        if: always()
        shell: pwsh
        run: |
          $roots = @($env:APPDATA, $env:LOCALAPPDATA, $env:RUNNER_TEMP) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $logs = @()
          foreach ($root in $roots) {
            $logs += Get-ChildItem -Path $root -Filter "runtime-smoke.log" -Recurse -File -ErrorAction SilentlyContinue
          }
          if ($logs.Count -eq 0) { Write-Host "No runtime-smoke.log found in expected Windows data roots." }
          foreach ($file in ($logs | Sort-Object FullName -Unique)) {
            Write-Host "Runtime diagnostics: $($file.FullName)"
            Get-Content -LiteralPath $file.FullName
          }
      - name: Upload Windows runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minarvabiz-windows-runtime-diagnostics
          path: |
            ${{ env.APPDATA }}\**\runtime-smoke.log
            ${{ env.LOCALAPPDATA }}\**\runtime-smoke.log
            ${{ env.RUNNER_TEMP }}\**\runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minarvabiz-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
