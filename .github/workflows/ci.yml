name: CI

# Production verification: web + Electron renderer/main + Windows installer.
# The lockfile is committed and CI always installs with frozen-lockfile.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/web exec tsc --noEmit
      - run: pnpm --filter @minarvabiz/web build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against legacy JSON persistence
        shell: bash
        run: |
          if grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --include='*.cjs' \
            'minarvabiz-db\.json|db:(read|write)' apps/desktop; then
            echo "Legacy JSON database persistence must not be reintroduced into desktop source."
            exit 1
          fi
          echo "Legacy JSON database persistence is absent from desktop source."
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/desktop typecheck
      - run: pnpm --filter @minarvabiz/desktop build:renderer
      - name: Inspect generated renderer CSS
        shell: bash
        run: |
          test -f apps/desktop/dist/index.html
          css=$(find apps/desktop/dist -type f -name '*.css' | head -n 1)
          test -n "$css"
          echo "CSS bundle: $css"
          for token in '.bg-blue-500' '.bg-emerald-500' '.bg-violet-500' '.text-white'; do
            grep -q "$token" "$css" || { echo "Missing expected CSS token: $token"; exit 1; }
          done
          if grep -Eq '(src|href)="/' apps/desktop/dist/index.html; then
            echo "Production renderer contains an absolute asset URL that can break under file://."
            cat apps/desktop/dist/index.html
            exit 1
          fi
          grep -Eq 'href="\./assets/[^" ]+\.css"' apps/desktop/dist/index.html || {
            echo "Production renderer index.html does not reference its bundled stylesheet.";
            cat apps/desktop/dist/index.html;
            exit 1;
          }
          echo "Renderer index.html references a relative bundled stylesheet and Tailwind color utilities are present."
      - run: pnpm --filter @minarvabiz/desktop build:electron

  windows-package:
    runs-on: windows-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/desktop run package:win
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          Write-Host "Installer: $($installer.FullName)"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: minarvabiz-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
