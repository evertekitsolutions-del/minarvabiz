name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Verify GitHub Actions hardening
        run: node scripts/github-actions-hardening-smoke.mjs
      - name: Verify SBOM and dependency-license workflow contract
        run: node scripts/sbom-license-workflow-smoke.mjs
      - name: Verify repository licensing and compliance declaration
        run: node scripts/compliance-declaration-smoke.mjs
      - name: Verify coverage reporting and ratchet workflow contract
        run: node scripts/coverage-workflow-smoke.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/utils typecheck
      - name: Verify cross-app security header baseline
        run: node --experimental-strip-types scripts/security-header-baseline-smoke.mjs
      - run: pnpm --filter @minarvabiz/web exec tsc --noEmit
      - name: Verify production build rejects missing Supabase env
        shell: bash
        run: |
          set -e
          set +e
          output="$(env -u NEXT_PUBLIC_SUPABASE_URL -u NEXT_PUBLIC_SUPABASE_ANON_KEY \
            MINARVA_MODE=production NEXT_PUBLIC_MINARVA_MODE=production \
            pnpm --filter @minarvabiz/web build 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Production web build unexpectedly succeeded without Supabase env."
            exit 1
          fi
          echo "$output" | grep -Fq "Production web build requires NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY"
      - name: Build web with public Supabase env
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-supabase.example
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
        run: pnpm --filter @minarvabiz/web build
      - name: Verify main web nonce CSP source
        shell: bash
        run: |
          set -e
          test -f apps/web/src/middleware.ts
          ! grep -Fq 'Content-Security-Policy' apps/web/next.config.ts
          grep -Fq 'Content-Security-Policy' apps/web/src/middleware.ts
          if grep -E "script-src[^;[:cntrl:]]*'unsafe-inline'" apps/web/src/middleware.ts; then
            echo "main web script-src must not contain unsafe-inline."
            exit 1
          fi
          node --experimental-strip-types scripts/web-csp-smoke.mjs
      - name: Verify public Supabase env is bundled
        shell: bash
        run: |
          set -e
          grep -RIlF 'https://ci-supabase.example' apps/web/.next/static/chunks >/dev/null
          grep -RIlF 'ci-public-anon-key' apps/web/.next/static/chunks >/dev/null


  web-ui-smoke:
    needs: web
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_REQUIRE_AUTH: "false"
      MINARVA_MODE: "demo"
      NEXT_PUBLIC_MINARVA_MODE: "demo"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/web build
      - name: Start production web server
        shell: bash
        run: |
          set -e
          nohup pnpm --filter @minarvabiz/web exec next start -p 3000 > /tmp/minarva-web.log 2>&1 &
          echo $! > /tmp/minarva-web.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/dashboard >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/minarva-web.log || true
          exit 1
      - name: Verify production main web nonce CSP runtime
        env:
          WEB_CSP_URL: http://127.0.0.1:3000/dashboard
        run: node --experimental-strip-types scripts/web-csp-smoke.mjs
      - name: Launch headless Chrome
        shell: bash
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium was not found on the GitHub runner."
            exit 1
          fi
          echo "Using browser: $CHROME"
          nohup "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223             --user-data-dir=/tmp/minarva-chrome http://127.0.0.1:3000/dashboard             > /tmp/minarva-chrome.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9223/json/list >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/minarva-chrome.log || true
          exit 1
      - name: Browser-driven commercial workflow smoke
        run: node scripts/web-ui-deep-smoke.mjs
      - name: Capture web UI diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=== Next.js log ==="
          cat /tmp/minarva-web.log || true
          echo "=== Chrome log ==="
          cat /tmp/minarva-chrome.log || true

  license-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/license-admin typecheck
      - name: Verify emergency shared-secret controls
        run: node --experimental-strip-types scripts/license-admin-security-smoke.mjs
      - name: Verify named administrator identities
        run: node --experimental-strip-types scripts/license-admin-identity-smoke.mjs
      - name: Verify administrator MFA and revocable sessions
        run: node --experimental-strip-types scripts/license-admin-mfa-session-smoke.mjs
      - name: Verify administrator RBAC and actor audit
        run: node --experimental-strip-types scripts/license-admin-rbac-audit-smoke.mjs
      - name: Verify modular license-admin surface
        run: node --experimental-strip-types scripts/license-admin-modular-ui-smoke.mjs
      - name: Verify license-admin auth/CRUD/error/import-export actions
        run: node --experimental-strip-types scripts/license-admin-actions-smoke.mjs
      - name: Verify production security configuration
        shell: bash
        run: |
          set -e
          grep -Fq '@minarvabiz/utils/security-headers' apps/license-admin/next.config.ts
          grep -Fq 'minarvaHttpSecurityHeaders()' apps/license-admin/next.config.ts
          test -f apps/license-admin/src/middleware.ts
          ! grep -Fq 'Content-Security-Policy' apps/license-admin/next.config.ts
          grep -Fq 'Content-Security-Policy' apps/license-admin/src/middleware.ts
          if grep -E "script-src[^;[:cntrl:]]*'unsafe-inline'" apps/license-admin/src/middleware.ts; then
            echo "license-admin script-src must not contain unsafe-inline."
            exit 1
          fi
          node --experimental-strip-types scripts/license-admin-csp-smoke.mjs
      - run: pnpm --filter @minarvabiz/license-admin build
      - name: Start license-admin production server
        shell: bash
        run: |
          set -e
          nohup pnpm --filter @minarvabiz/license-admin start > /tmp/minarva-license-admin.log 2>&1 &
          echo $! > /tmp/minarva-license-admin.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/minarva-license-admin.log || true
          exit 1
      - name: Verify production nonce CSP runtime
        env:
          LICENSE_ADMIN_BASE_URL: http://127.0.0.1:3001/
        run: node --experimental-strip-types scripts/license-admin-csp-smoke.mjs
      - name: Capture license-admin diagnostics
        if: failure()
        shell: bash
        run: |
          cat /tmp/minarva-license-admin.log || true

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Guard against legacy JSON persistence
        shell: bash
        run: |
          set -e
          source_files=(apps packages)
          if grep -RIn --include='*.ts' --include='*.tsx' --exclude-dir=node_modules --exclude-dir=.git 'minarvabiz-db\.json' "${source_files[@]}"; then
            echo "Legacy JSON persistence file reference detected in TypeScript source."
            exit 1
          fi
          for pattern in \
            'ipcMain.handle("db:read"' \
            'ipcMain.handle("db:write"' \
            "ipcMain.handle('db:read'" \
            "ipcMain.handle('db:write'" \
            'ipcRenderer.invoke("db:read"' \
            'ipcRenderer.invoke("db:write"' \
            "ipcRenderer.invoke('db:read'" \
            "ipcRenderer.invoke('db:write'"; do
            if grep -RIn --include='*.ts' --include='*.tsx' --exclude-dir=node_modules --exclude-dir=.git -F "$pattern" "${source_files[@]}"; then
              echo "Legacy SQLite-breaking IPC API detected: $pattern"
              exit 1
            fi
          done
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Static production quality smoke
        shell: bash
        run: |
          set -e
          test -f apps/desktop/vite.config.ts
          test -f apps/desktop/build/icon.svg
          test -f apps/desktop/public/minarva-biz-icon.svg
          grep -Fq 'base: "./"' apps/desktop/vite.config.ts
          grep -Fq 'contextIsolation: true' apps/desktop/electron/main.ts
          grep -Fq 'nodeIntegration: false' apps/desktop/electron/main.ts
          grep -Fq 'sandbox: true' apps/desktop/electron/main.ts
          grep -Fq 'MINARVA_EXTERNAL_URL_HOSTS' apps/desktop/electron/main.ts
          grep -Fq 'will-navigate' apps/desktop/electron/main.ts
          grep -Fq 'event.sender.mainFrame' apps/desktop/electron/main.ts
          grep -Fq 'webSecurity: true' apps/desktop/electron/main.ts
          grep -Fq 'Menu.setApplicationMenu(null)' apps/desktop/electron/main.ts
          grep -Fq 'minarvabiz.ui.theme' packages/ui/src/components/settings/SettingsPanel.tsx
          grep -Fq 'midnight' packages/ui/src/components/settings/SettingsPanel.tsx
          grep -Fq 'ocean' packages/ui/src/components/settings/SettingsPanel.tsx
          grep -Fq 'emerald' packages/ui/src/components/settings/SettingsPanel.tsx
          grep -Fq 'violet' packages/ui/src/components/settings/SettingsPanel.tsx
      - run: node scripts/quality-smoke.mjs
      - run: pnpm --filter @minarvabiz/database typecheck
      - name: Run database persistence tests
        shell: bash
        run: |
          set -e
          node packages/database/src/__tests__/sqlite-persist.test.mjs
          node packages/database/src/__tests__/sqlite-backup.test.mjs
          node packages/database/src/__tests__/desktop-sqlite-flow.test.mjs
      - run: pnpm --filter @minarvabiz/business-logic typecheck
      - name: Run deterministic property/fuzz invariants
        run: node packages/business-logic/src/__tests__/property-fuzz-invariants.test.mjs
      - run: pnpm --filter @minarvabiz/sync typecheck
      - name: Run Supabase pull cursor regression
        run: node packages/sync/src/__tests__/supabase-pull-cursors.test.mjs
      - name: Run complete business logic test suite
        shell: bash
        run: |
          set -e
          for test_file in packages/business-logic/src/__tests__/*.test.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done
      - name: Run operations completion contract tests
        run: node packages/business-logic/src/__tests__/operations-completion-contract.test.mjs
      - run: pnpm --filter @minarvabiz/ui typecheck
      - run: pnpm --filter @minarvabiz/desktop typecheck
      - name: Validate Windows interaction smoke syntax
        run: node --check scripts/windows-populated-deep-smoke.mjs
      - run: pnpm --filter @minarvabiz/desktop build:renderer
      - name: Inspect generated renderer CSS
        shell: bash
        run: |
          set -e
          test -s apps/desktop/dist/index.html
          test -s apps/desktop/dist/minarva-biz-icon.svg
          grep -Eq 'href="\./assets/[^" ]+\.css"' apps/desktop/dist/index.html
          compgen -G 'apps/desktop/dist/assets/*.js' > /dev/null
          compgen -G 'apps/desktop/dist/assets/*.css' > /dev/null
          for file in apps/desktop/dist/assets/*.js apps/desktop/dist/assets/*.css; do test -s "$file"; done
      - run: pnpm --filter @minarvabiz/desktop build:electron
      - name: Run backup restore schema smoke
        run: node scripts/sqlite-backup-schema-smoke.mjs

  windows-package:
    runs-on: windows-latest
    env:
      MINARVA_RUNTIME_SMOKE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/desktop run package:win
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
      - name: Windows installed-runtime smoke
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "MinarvaBiz-UAT"
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          $diagnostics = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Install-Diagnostics"
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          Get-FileHash -Algorithm SHA256 $installer.FullName | Format-List | Out-File (Join-Path $diagnostics "installer-hash.txt")
          $installExit = $null
          $sourceHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash
          for ($installAttempt = 1; $installAttempt -le 4; $installAttempt++) {
            $attemptInstaller = Join-Path $env:RUNNER_TEMP ("MinarvaBiz-CI-Setup-attempt-{0}.exe" -f $installAttempt)
            Copy-Item -LiteralPath $installer.FullName -Destination $attemptInstaller -Force
            Unblock-File -LiteralPath $attemptInstaller -ErrorAction SilentlyContinue
            $copyHash = (Get-FileHash -Algorithm SHA256 $attemptInstaller).Hash
            if ($copyHash -ne $sourceHash) { throw "Installer copy hash mismatch on attempt $installAttempt." }
            Start-Sleep -Milliseconds 750
            $installProc = Start-Process -FilePath $attemptInstaller -ArgumentList "/S", "/D=$installRoot" -PassThru -Wait
            $installExit = $installProc.ExitCode
            "Attempt $installAttempt exit code: $installExit" | Tee-Object -FilePath (Join-Path $diagnostics "install-attempts.txt") -Append
            Remove-Item -LiteralPath $attemptInstaller -Force -ErrorAction SilentlyContinue
            if ($installExit -eq 0) { break }
            if ($installExit -ne -1073741819 -or $installAttempt -eq 4) {
              throw "Windows installer exited with code $installExit on attempt $installAttempt."
            }
            Write-Warning "Transient NSIS access violation; retrying from a fresh verified installer copy."
            Start-Sleep -Seconds (2 * $installAttempt)
            if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          }
          $exeCandidates = @(
            (Join-Path $installRoot "Minarva Biz.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\Minarva Biz\Minarva Biz.exe"),
            (Join-Path $env:LOCALAPPDATA "Minarva Biz\Minarva Biz.exe"),
            (Join-Path $env:APPDATA "Minarva Biz\Minarva Biz.exe")
          )
          $exe = $null
          for ($attempt = 1; $attempt -le 30 -and -not $exe; $attempt++) {
            $exe = $exeCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if (-not $exe -and (Test-Path $installRoot)) {
              $exe = Get-ChildItem -Path $installRoot -Filter *.exe -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notlike "*Setup*.exe" } |
                Select-Object -First 1 | ForEach-Object FullName
            }
            if (-not $exe) { Start-Sleep -Seconds 1 }
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw "Installed Minarva Biz executable was not found after waiting for installer completion." }
          Write-Host "Installed executable: $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $db = $null
            for ($attempt = 1; $attempt -le 45 -and -not $db; $attempt++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "Minarva Biz exited during runtime smoke test (exit code $($proc.ExitCode))." }
              $dbRoots = @($env:APPDATA, $env:LOCALAPPDATA, $env:PROGRAMDATA) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
              foreach ($root in $dbRoots) {
                $candidate = Get-ChildItem -Path $root -Filter "minarvabiz.db" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($candidate) { $db = $candidate; break }
              }
            }
            if (-not $db) { throw "SQLite database was not created anywhere under the standard Windows application-data roots after 45 seconds." }
            $bytes = [System.IO.File]::ReadAllBytes($db.FullName)
            if ($bytes.Length -lt 16 -or [System.Text.Encoding]::ASCII.GetString($bytes, 0, 16) -ne "SQLite format 3`0") { throw "Located minarvabiz.db is not a valid SQLite database: $($db.FullName)" }
            $logs = @($env:APPDATA, $env:LOCALAPPDATA, $env:RUNNER_TEMP) | Where-Object { $_ -and (Test-Path $_) } | ForEach-Object { Get-ChildItem -Path $_ -Filter "runtime-smoke.log" -Recurse -File -ErrorAction SilentlyContinue } | Sort-Object FullName -Unique
            if (-not ($logs | Select-String -Pattern 'bridge-ready=true')) { throw "Electron preload bridge was not confirmed in the installed runtime log." }
            if ($logs | Select-String -Pattern 'bridge-ready=false') { throw "Electron preload bridge reported failure in the installed runtime log." }
            if ($logs | Select-String -Pattern 'renderer-fatal|renderer-bootstrap-fatal|renderer-state error=true|renderer-ui-ready=false') { throw "Renderer startup failed or did not become ready. See captured runtime diagnostics." }
            if (-not ($logs | Select-String -Pattern 'renderer-state ready=true')) { throw "Renderer React mount was not confirmed in the installed runtime log." }
            Write-Host "Runtime smoke PASS: process alive, valid SQLite database found, preload bridge confirmed, and React renderer mounted."
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Capture Windows runtime diagnostics
        if: always()
        shell: pwsh
        run: |
          $roots = @($env:APPDATA, $env:LOCALAPPDATA, $env:RUNNER_TEMP) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $logs = @()
          foreach ($root in $roots) { $logs += Get-ChildItem -Path $root -Filter "runtime-smoke.log" -Recurse -File -ErrorAction SilentlyContinue }
          if ($logs.Count -eq 0) { Write-Host "No runtime-smoke.log found in expected Windows data roots." }
          foreach ($file in ($logs | Sort-Object FullName -Unique)) {
            Write-Host "Runtime diagnostics: $($file.FullName)"
            Get-Content -LiteralPath $file.FullName
          }
      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minarvabiz-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
