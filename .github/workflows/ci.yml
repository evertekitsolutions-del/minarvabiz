name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Verify FEFO lot and IMEI/serial preflight invariants
        run: node --experimental-strip-types --test packages/business-logic/src/__tests__/tracked-inventory.test.mjs
      - name: Verify precise dimensional billing quantities (UBP-05a)
        run: node --experimental-strip-types --test packages/business-logic/src/__tests__/dimensional-billing.test.mjs packages/business-logic/src/__tests__/dimension-row-draft.test.mjs packages/business-logic/src/__tests__/dimension-line-metadata.test.mjs
      - name: Verify all 100 business presets and immutable identifiers
        run: node --experimental-strip-types packages/types/src/__tests__/business-presets.test.mjs
      - name: Verify tenant-scoped presentation and capability validation
        run: node --experimental-strip-types packages/types/src/__tests__/business-presentation.test.mjs
      - name: Verify universal business barrel exports and unchanged POS authority
        run: node --experimental-strip-types packages/types/src/__tests__/business-exports.test.mjs
      - name: Verify UBP-02 non-destructive tenant product schema migration
        run: node packages/business-logic/src/__tests__/universal-business-schema-contract.test.mjs
      - name: Verify tenant-safe service resource availability rules (UBP-04a)
        run: node --experimental-strip-types --test packages/business-logic/src/__tests__/resource-booking.test.mjs
      - name: Verify desktop workspace readiness after trial activation
        run: node --test scripts/desktop-workspace-ready.test.mjs
      - name: Verify GitHub Actions hardening
        run: node scripts/github-actions-hardening-smoke.mjs
      - name: Verify isolated Cloudflare customer preview configuration
        run: node scripts/frontend-cloudflare-config-smoke.mjs
      - name: Verify fail-closed Cloudflare customer preview deployment authority
        run: node --test scripts/cloudflare-customer-preview-gate.test.mjs
      - name: Verify premium public homepage content and navigation
        run: node scripts/public-homepage-design-contract.test.mjs
      - name: Verify owner-approved blue product homepage and honest imagery
        run: node scripts/approved-blue-homepage-contract.test.mjs
      - name: Verify Business 360 roadmap, packages and 10% referral terms
        run: node scripts/public-business-360-marketing-contract.test.mjs
      - name: Verify referral earnings math on approved plans, refunds and renewals
        run: node --experimental-strip-types apps/web/src/lib/__tests__/partner-referral-quote.test.mjs
      - name: Verify desktop width, compact typography and substantive workflow content
        run: node scripts/desktop-homepage-density-contract.test.mjs
      - name: Verify six industry-specific product workflow guides and truthful content
        run: node --experimental-strip-types scripts/public-industry-guides-contract.test.mjs
      - name: Verify eight product feature detail guides and accessible customer paths
        run: node --experimental-strip-types scripts/public-feature-guides-contract.test.mjs
      - name: Verify new Minarva Biz logo and browser icon consistency
        run: node scripts/minarva-biz-logo-contract.test.mjs
      - name: Verify accessible interactive product walkthrough and marketing honesty
        run: node scripts/public-product-tour-contract.test.mjs
      - name: Verify portable responsive design review preview
        run: node scripts/website-design-review-contract.test.mjs
      - name: Verify 30-day exit intent / mobile scroll modal and marketing accessibility
        run: node scripts/public-30-day-trial-popup-contract.test.mjs
      - name: Verify isolated design review website is publicly reachable and honest
        run: node scripts/website-design-review-live-smoke.mjs
      - name: Refuse Cloudflare customer authentication bypass
        run: node scripts/cloudflare-preview-auth-guard.test.mjs
      - name: Audit capability source inventory
        run: node scripts/master-vision-source-inventory.mjs --summary
      - name: Verify linked help workflows
        run: node scripts/frontend-help-workflows-contract.test.mjs
      - name: Verify exact expense and purchase amount entry
        run: node --experimental-strip-types apps/web/src/lib/__tests__/finance-entry-draft.test.mjs
      - name: Verify dashboard direct-create quick actions
        run: node --experimental-strip-types apps/web/src/lib/__tests__/dashboard-quick-create.test.mjs
      - name: Verify service order customer quick-add wiring
        run: node scripts/frontend-service-order-quick-customer.test.mjs
      - name: Verify customers outstanding-only filter
        run: node --experimental-strip-types packages/ui/src/components/customers/__tests__/customer-dues-filter.test.mjs
      - name: Verify supplier payables-only filter and safe payment action
        run: node --experimental-strip-types packages/ui/src/components/suppliers/__tests__/supplier-payables-filter.test.mjs
      - name: Verify strict supplier payment amount before posting
        run: node --experimental-strip-types apps/web/src/lib/__tests__/supplier-payment-draft.test.mjs
      - name: Verify strict staff salary draft and form error feedback
        run: node --experimental-strip-types apps/web/src/lib/__tests__/staff-salary-draft.test.mjs
      - name: Verify sales unpaid-only invoice filter
        run: node --experimental-strip-types packages/ui/src/components/sales/__tests__/unpaid-sale-filter.test.mjs
      - name: Verify Sales History customer due collection actions
        run: node --experimental-strip-types packages/ui/src/components/sales/__tests__/sale-customer-collection.test.mjs
      - name: Verify customer due collection deep link and amounts
        run: node --experimental-strip-types packages/ui/src/components/payments/__tests__/collection-prefill.test.mjs
      - name: Verify installed attendance smoke waits for save completion
        run: node scripts/windows-attendance-eventual-save-contract.test.mjs
      - name: Verify reorder CSV safety and quantities
        run: node packages/business-logic/src/__tests__/product-reorder-csv.test.mjs
      - name: Verify filtered invoice CSV export and injection safety
        run: node --experimental-strip-types packages/business-logic/src/__tests__/sales-history-csv.test.mjs
      - name: Verify service order CSV export and injection safety
        run: node --experimental-strip-types packages/business-logic/src/__tests__/service-orders-csv.test.mjs
      - name: Verify filtered payment history CSV and cashflow signs
        run: node --experimental-strip-types packages/business-logic/src/__tests__/payment-history-csv.test.mjs
      - name: Verify filtered laundry CSV and injection safety
        run: node --experimental-strip-types packages/business-logic/src/__tests__/laundry-tickets-csv.test.mjs
      - name: Verify CSV frontend safety
        run: node scripts/frontend-tools-csv-contract.test.mjs
      - name: Verify default GST rate validation and explicit-save UI
        run: node packages/business-logic/src/__tests__/tax-rate-validation.test.mjs
      - name: Verify service order overdue delivery filter
        run: node --experimental-strip-types packages/ui/src/components/orders/__tests__/order-overdue-filter.test.mjs
      - name: Verify service orders assigned staff filter and CSV parity
        run: node --experimental-strip-types packages/ui/src/components/orders/__tests__/order-assignment-filter.test.mjs
      - name: Verify service-order direct staff allocation and sync
        run: node --experimental-strip-types packages/business-logic/src/__tests__/service-staff-direct-allocation.test.mjs
      - name: Verify manual service WhatsApp sharing and safe templates
        run: node --experimental-strip-types packages/business-logic/src/__tests__/service-whatsapp-manual.test.mjs
      - name: Verify service staff assignment start and completion
        run: node --experimental-strip-types packages/business-logic/src/__tests__/service-staff-lifecycle.test.mjs
      - name: Verify mobile reload browser readiness contract
        run: node scripts/mobile-navigation-reload-contract.test.mjs
      - name: Verify service order unpaid balance collection navigation
        run: node --experimental-strip-types packages/ui/src/components/orders/__tests__/service-order-collection.test.mjs
      - name: Verify safe notification navigation
        run: node scripts/frontend-safe-notification-navigation.test.mjs
      - name: Verify notification frontend
        run: node scripts/frontend-notifications-contract.test.mjs
      - name: Verify onboarding search
        run: node scripts/frontend-onboarding-search-contract.test.mjs
      - name: Verify onboarding incomplete filter
        run: node scripts/frontend-onboarding-filter-contract.test.mjs
      - name: Verify onboarding progress frontend
        run: node scripts/frontend-onboarding-progress-contract.test.mjs
      - name: Verify first admin login failure handling
        run: node scripts/frontend-first-admin-login-contract.test.mjs
      - name: Verify forgot-password duplicate guard
        run: node scripts/frontend-forgot-password-submit-contract.test.mjs
      - name: Verify recovery password visibility
        run: node scripts/frontend-recovery-visibility-contract.test.mjs
      - name: Verify recovery token purpose and URL hygiene
        run: node scripts/frontend-recovery-purpose.test.mjs
      - name: Verify login concurrent request protection
        run: node scripts/frontend-login-submit-lock.test.mjs
      - name: Verify authentication frontend accessibility
        run: node scripts/frontend-auth-accessibility-contract.test.mjs
      - name: Verify Master Vision pointwise scoring and scope
        run: |
          node --test scripts/master-vision-measurement.test.mjs
          node scripts/master-vision-measurement.mjs --json > /tmp/minarva-measurement.json
          node -e 'const m=require("/tmp/minarva-measurement.json"); if(m.totalCapabilities !== 440 || m.totalPoints !== 2200 || m.actualCompletionPercent !== null) process.exit(1)'
      - name: Verify mobile-first navigation and accessible global search
        run: node scripts/mobile-frontend-contract-smoke.mjs
      - name: Verify durable development continuity without external API charges
        run: node scripts/development-continuity-contract-smoke.mjs
      - name: Verify SBOM and dependency-license workflow contract
        run: node scripts/sbom-license-workflow-smoke.mjs
      - name: Verify repository licensing and compliance declaration
        run: node scripts/compliance-declaration-smoke.mjs
      - name: Verify coverage reporting and ratchet workflow contract
        run: node scripts/coverage-workflow-smoke.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/utils typecheck
      - name: Verify provider-neutral commercial entitlement contract
        run: node --experimental-strip-types scripts/commercial-entitlement-contract-smoke.mjs
      - name: Verify cross-app security header baseline
        run: node --experimental-strip-types scripts/security-header-baseline-smoke.mjs
      - run: pnpm --filter @minarvabiz/web exec tsc --noEmit
      - name: Verify Attendance Grid contract
        run: node packages/business-logic/src/__tests__/attendance-grid-contract.test.mjs
      - name: Verify provider-neutral web hosting contract
        run: node scripts/provider-neutral-web-hosting-smoke.mjs
      - name: Verify Vercel automatic deployments are disabled
        run: node packages/business-logic/src/__tests__/vercel-deployment-branch-glob.test.mjs
      - name: Verify production build rejects missing Supabase env
        shell: bash
        run: |
          set -e
          set +e
          output="$(env -u NEXT_PUBLIC_SUPABASE_URL -u NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY -u NEXT_PUBLIC_SUPABASE_ANON_KEY \
            MINARVA_MODE=production NEXT_PUBLIC_MINARVA_MODE=production \
            pnpm --filter @minarvabiz/web build 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Production web build unexpectedly succeeded without Supabase env."
            exit 1
          fi
          echo "$output" | grep -Fq "Production web build requires NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (or legacy NEXT_PUBLIC_SUPABASE_ANON_KEY)."
      - name: Build web with public Supabase env
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-supabase.example
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key
        run: pnpm --filter @minarvabiz/web build
      - name: Verify main web nonce CSP source
        shell: bash
        run: |
          set -e
          test -f apps/web/src/middleware.ts
          ! grep -Fq 'Content-Security-Policy' apps/web/next.config.ts
          grep -Fq 'Content-Security-Policy' apps/web/src/middleware.ts
          if grep -E "script-src[^;[:cntrl:]]*'unsafe-inline'" apps/web/src/middleware.ts; then
            echo "main web script-src must not contain unsafe-inline."
            exit 1
          fi
          node --experimental-strip-types scripts/web-csp-smoke.mjs
      - name: Verify public Supabase env is bundled
        shell: bash
        run: |
          set -e
          grep -RIlF 'https://ci-supabase.example' apps/web/.next/static/chunks >/dev/null
          grep -RIlF 'sb_publishable_ci_test_key' apps/web/.next/static/chunks >/dev/null



  cloudflare-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-supabase.example
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key
      NEXT_PUBLIC_REQUIRE_AUTH: "true"
      NEXT_PUBLIC_MINARVA_MODE: production
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build authenticated customer Worker
        run: node scripts/frontend-cloudflare-preview-deploy.mjs --build-only
      - name: Validate Worker deployment bundle without publishing
        run: pnpm --filter @minarvabiz/web exec wrangler deploy --dry-run
      - name: Start compiled Worker locally
        shell: bash
        run: |
          pnpm --filter @minarvabiz/web exec wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/minarva-worker.log 2>&1 &
          echo $! > /tmp/minarva-worker.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/minarva-worker.log
          exit 1
      - name: Verify compiled Worker pages and middleware
        run: node scripts/cloudflare-runtime-smoke.mjs
      - name: Verify industry guide routing and CSP in compiled Cloudflare Worker
        env:
          MINARVA_WEB_SMOKE_URL: http://127.0.0.1:8787
        run: node scripts/public-industry-guides-runtime-smoke.mjs
      - name: Verify eight feature detail pages and CSP in compiled Cloudflare Worker
        env:
          MINARVA_WEB_SMOKE_URL: http://127.0.0.1:8787
        run: node scripts/public-feature-guides-runtime-smoke.mjs
      - name: Capture Worker diagnostics
        if: failure()
        run: cat /tmp/minarva-worker.log || true
      - name: Stop local Worker
        if: always()
        run: test ! -f /tmp/minarva-worker.pid || kill "$(cat /tmp/minarva-worker.pid)" || true


  web-ui-smoke:
    needs: web
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_REQUIRE_AUTH: "false"
      MINARVA_MODE: "demo"
      NEXT_PUBLIC_MINARVA_MODE: "demo"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/web build
      - name: Start production web server
        shell: bash
        run: |
          set -e
          nohup pnpm --filter @minarvabiz/web exec next start -p 3000 > /tmp/minarva-web.log 2>&1 &
          echo $! > /tmp/minarva-web.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/dashboard >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/minarva-web.log || true
          exit 1
      - name: Verify public homepage without authentication
        run: node scripts/public-homepage-runtime-smoke.mjs
      - name: Verify all public industry guide routes in production Next.js
        run: node scripts/public-industry-guides-runtime-smoke.mjs
      - name: Verify eight product feature pages and unknown-feature 404 in production Next.js
        run: node scripts/public-feature-guides-runtime-smoke.mjs
      - name: Verify production main web nonce CSP runtime
        env:
          WEB_CSP_URL: http://127.0.0.1:3000/dashboard
        run: node --experimental-strip-types scripts/web-csp-smoke.mjs
      - name: Launch headless Chrome
        shell: bash
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium was not found on the GitHub runner."
            exit 1
          fi
          echo "Using browser: $CHROME"
          nohup "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223             --user-data-dir=/tmp/minarva-chrome http://127.0.0.1:3000/dashboard             > /tmp/minarva-chrome.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9223/json/list >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/minarva-chrome.log || true
          exit 1
      - name: Verify real desktop and mobile homepage density in headless Chrome
        run: node scripts/public-homepage-viewport-browser-smoke.mjs
      - name: Browser-verify 30-day desktop exit-intent and mobile 50% scroll prompts
        run: node scripts/public-trial-popup-browser-smoke.mjs
      - name: Browser-driven commercial workflow smoke
        run: node scripts/web-ui-deep-smoke.mjs
      - name: Verify mobile navigation and search with headless Chrome
        run: node scripts/mobile-frontend-browser-smoke.mjs
      - name: Verify actual Chrome IndexedDB roster recovery after reload
        run: node scripts/hr004-indexeddb-browser-smoke.mjs
      - name: Verify manager drafts and administrator policy review UI in Chrome
        run: node scripts/hr004-policy-browser-smoke.mjs
      - name: Verify dimensional row keyboard and controlled updates in Chrome
        run: node scripts/dimension-row-browser-smoke.mjs
      - name: Capture web UI diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=== Next.js log ==="
          cat /tmp/minarva-web.log || true
          echo "=== Chrome log ==="
          cat /tmp/minarva-chrome.log || true

  license-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/license-admin typecheck
      - name: Verify provider-neutral License Admin runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -e render.yaml
          grep -Fq 'output: "export"' apps/license-admin/next.config.ts
          test ! -e apps/license-admin/src/app/actions.ts
      - name: Verify modular license-admin surface
        run: node --experimental-strip-types scripts/license-admin-modular-ui-smoke.mjs
      - name: Verify license-admin auth/CRUD/error/import-export actions
        run: node --experimental-strip-types scripts/license-admin-actions-smoke.mjs
      - name: Verify portable static security configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'output: "export"' apps/license-admin/next.config.ts
          test ! -e apps/license-admin/src/middleware.ts
          test -f apps/license-admin/public/_headers
          grep -Fq 'Content-Security-Policy:' apps/license-admin/public/_headers
          grep -Fq "default-src 'self'" apps/license-admin/public/_headers
          grep -Fq "object-src 'none'" apps/license-admin/public/_headers
          grep -Fq "frame-ancestors 'none'" apps/license-admin/public/_headers
          grep -Fq 'X-Content-Type-Options: nosniff' apps/license-admin/public/_headers
      - run: pnpm --filter @minarvabiz/license-admin build
      - name: Verify portable static artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/license-admin/out/index.html
          test -f apps/license-admin/out/_headers
          ! grep -R -Fq 'SUPABASE_SECRET_KEY' apps/license-admin/out
          ! grep -R -Fq 'SUPABASE_SERVICE_ROLE_KEY' apps/license-admin/out
          ! grep -R -Fq 'LICENSE_EDGE_RPC_SECRET' apps/license-admin/out
          ! grep -R -Fq 'LICENSE_PRIVATE_KEY' apps/license-admin/out
          node scripts/license-admin-static-artifact-smoke.mjs
      - name: Capture license-admin diagnostics
        if: failure()
        shell: bash
        run: |
          cat /tmp/minarva-license-admin.log || true

  web-security-recovery-e2e:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_REQUIRE_AUTH: "true"
      MINARVA_MODE: "production"
      NEXT_PUBLIC_MINARVA_MODE: "production"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-public-anon-key"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build authenticated production web
        run: pnpm --filter @minarvabiz/web build
      - name: Start deterministic Supabase auth/RLS mock
        shell: bash
        run: |
          set -e
          nohup node scripts/mock-supabase-auth-server.mjs > /tmp/minarva-mock-supabase.log 2>&1 &
          echo $! > /tmp/minarva-mock-supabase.pid
          for i in $(seq 1 40); do
            if grep -Fq 'MOCK_SUPABASE_READY' /tmp/minarva-mock-supabase.log 2>/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/minarva-mock-supabase.log || true
          exit 1
      - name: Start authenticated production web server
        shell: bash
        run: |
          set -e
          nohup pnpm --filter @minarvabiz/web exec next start -p 3000 > /tmp/minarva-web-security.log 2>&1 &
          echo $! > /tmp/minarva-web-security.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/minarva-web-security.log || true
          exit 1
      - name: Launch headless Chrome for security E2E
        shell: bash
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium was not found on the GitHub runner."
            exit 1
          fi
          nohup "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9224 \
            --user-data-dir=/tmp/minarva-security-chrome http://127.0.0.1:3000/dashboard \
            > /tmp/minarva-security-chrome.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9224/json/list >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/minarva-security-chrome.log || true
          exit 1
      - name: Browser security-negative and recovery-path E2E
        run: node scripts/web-security-recovery-e2e.mjs
      - name: Capture browser security E2E diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== Mock Supabase ==="
          cat /tmp/minarva-mock-supabase.log || true
          echo "=== Next.js ==="
          cat /tmp/minarva-web-security.log || true
          echo "=== Chrome ==="
          cat /tmp/minarva-security-chrome.log || true
      - name: Stop browser security E2E services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/minarva-web-security.pid ]; then kill "$(cat /tmp/minarva-web-security.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/minarva-mock-supabase.pid ]; then kill "$(cat /tmp/minarva-mock-supabase.pid)" 2>/dev/null || true; fi

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Guard against legacy JSON persistence
        shell: bash
        run: |
          set -e
          source_files=(apps packages)
          if grep -RIn --include='*.ts' --include='*.tsx' --exclude-dir=node_modules --exclude-dir=.git 'minarvabiz-db\.json' "${source_files[@]}"; then
            echo "Legacy JSON persistence file reference detected in TypeScript source."
            exit 1
          fi
          for pattern in \
            'ipcMain.handle("db:read"' \
            'ipcMain.handle("db:write"' \
            "ipcMain.handle('db:read'" \
            "ipcMain.handle('db:write'" \
            'ipcRenderer.invoke("db:read"' \
            'ipcRenderer.invoke("db:write"' \
            "ipcRenderer.invoke('db:read'" \
            "ipcRenderer.invoke('db:write'"; do
            if grep -RIn --include='*.ts' --include='*.tsx' --exclude-dir=node_modules --exclude-dir=.git -F "$pattern" "${source_files[@]}"; then
              echo "Legacy SQLite-breaking IPC API detected: $pattern"
              exit 1
            fi
          done
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Static production quality smoke
        shell: bash
        run: |
          set -e
          test -f apps/desktop/vite.config.ts
          test -f apps/desktop/build/icon.svg
          test -f apps/desktop/public/minarva-biz-icon.svg
          grep -Fq 'base: "./"' apps/desktop/vite.config.ts
          grep -Fq 'contextIsolation: true' apps/desktop/electron/main.ts
          grep -Fq 'nodeIntegration: false' apps/desktop/electron/main.ts
          grep -Fq 'sandbox: true' apps/desktop/electron/main.ts
          grep -Fq 'MINARVA_EXTERNAL_URL_HOSTS' apps/desktop/electron/main.ts
          grep -Fq 'will-navigate' apps/desktop/electron/main.ts
          grep -Fq 'event.sender.mainFrame' apps/desktop/electron/main.ts
          grep -Fq 'webSecurity: true' apps/desktop/electron/main.ts
          grep -Fq 'Menu.setApplicationMenu(null)' apps/desktop/electron/main.ts
          grep -Fq 'minarvabiz.ui.theme' packages/ui/src/components/settings/SettingsPanel.tsx
          grep -Fq 'midnight' packages/ui/src/components/settings/SettingsPanel.tsx
          grep -Fq 'ocean' packages/ui/src/components/settings/SettingsPanel.tsx
          grep -Fq 'emerald' packages/ui/src/components/settings/SettingsPanel.tsx
          grep -Fq 'violet' packages/ui/src/components/settings/SettingsPanel.tsx
      - run: node scripts/quality-smoke.mjs
      - run: pnpm --filter @minarvabiz/database typecheck
      - name: Run database persistence tests
        shell: bash
        run: |
          set -e
          node packages/database/src/__tests__/sqlite-persist.test.mjs
          node packages/database/src/__tests__/sqlite-backup.test.mjs
          node packages/database/src/__tests__/desktop-sqlite-flow.test.mjs
          node --experimental-strip-types packages/database/src/__tests__/ubp02-sqlite-parity.test.mjs
      - run: pnpm --filter @minarvabiz/business-logic typecheck
      - name: Run deterministic property/fuzz invariants
        run: node packages/business-logic/src/__tests__/property-fuzz-invariants.test.mjs
      - run: pnpm --filter @minarvabiz/sync typecheck
      - name: Run Supabase pull cursor regression
        run: |
          node packages/sync/src/__tests__/supabase-pull-cursors.test.mjs
          node packages/sync/src/__tests__/attendance-transport.test.mjs
          node packages/sync/src/__tests__/attendance-ack-retry.test.mjs
      - name: Run complete business logic test suite
        shell: bash
        run: |
          set -e
          for test_file in packages/business-logic/src/__tests__/*.test.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done
      - name: Run operations completion contract tests
        run: node packages/business-logic/src/__tests__/operations-completion-contract.test.mjs
      - name: Verify shared dimensional row editor rendering
        run: node --experimental-strip-types scripts/dimension-row-editor-smoke.mjs
      - run: pnpm --filter @minarvabiz/ui typecheck
      - name: Test desktop first-customer onboarding evidence and navigation
        run: node --test packages/ui/src/components/desktop/__tests__/first-customer-guide-model.test.mjs
      - name: Verify first-customer bulk CSV import native persistence and duplicate prevention
        run: node --test packages/ui/src/components/desktop/__tests__/durable-csv-import.test.mjs
      - run: pnpm --filter @minarvabiz/desktop typecheck
      - name: Verify offline support packet serialization and native export policy
        run: node --test packages/ui/src/components/support/__tests__/portable-support-packet.test.mjs apps/desktop/electron/__tests__/support-packet.test.mjs
      - name: Verify customer collections cannot duplicate payment and accounting postings after failed native write
        run: node --test packages/ui/src/components/payments/__tests__/durable-collection.test.mjs
      - name: Verify durable Windows POS sale and recovery on native-write failures
        run: node --test apps/desktop/src/lib/__tests__/durable-sale-commit.test.mjs
      - name: Verify day-end close and reopen wait for SQLite persistence, without duplicate mutations
        run: node --test apps/desktop/src/lib/__tests__/durable-day-end.test.mjs
      - name: Validate Windows interaction smoke syntax
        run: node --check scripts/windows-populated-deep-smoke.mjs
      - run: pnpm --filter @minarvabiz/desktop build:renderer
      - name: Inspect generated renderer CSS
        shell: bash
        run: |
          set -e
          test -s apps/desktop/dist/index.html
          test -s apps/desktop/dist/minarva-biz-icon.svg
          grep -Eq 'href="\./assets/[^" ]+\.css"' apps/desktop/dist/index.html
          compgen -G 'apps/desktop/dist/assets/*.js' > /dev/null
          compgen -G 'apps/desktop/dist/assets/*.css' > /dev/null
          for file in apps/desktop/dist/assets/*.js apps/desktop/dist/assets/*.css; do test -s "$file"; done
      - run: pnpm --filter @minarvabiz/desktop build:electron
      - name: Run backup restore schema smoke
        run: node scripts/sqlite-backup-schema-smoke.mjs

  tenant-sync-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: minarva_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: minarva_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
