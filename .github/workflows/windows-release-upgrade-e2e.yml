name: Windows Release Upgrade E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/windows-release-update-e2e.mjs"
      - ".github/workflows/windows-release-upgrade-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-upgrade-e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      MINARVA_UPDATE_FROM: "1.0.13"
      MINARVA_UPDATE_TO: "1.0.14"
      MINARVA_CDP_PORT: "9224"
      MINARVA_UPDATE_E2E_CUSTOMER: "Upgrade E2E Customer"
      MINARVA_UPDATE_E2E_STATE_FILE: "minarva-update-e2e-state.json"
      MINARVA_UPDATE_E2E_NOTE_FRAGMENT: "dashboard opens"
      VITE_LICENSE_API_URL: "https://minarvabiz-license-admin.onrender.com"
      MINARVA_UPDATE_MANIFEST_URL: "https://minarvabiz-license-admin.onrender.com/api/update/manifest"
      MINARVA_RUNTIME_SMOKE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Configure production update verification key
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "$env:VITE_LICENSE_API_URL/api/public-key"
          $key = "$($response.publicKeyHex)".Trim().ToLower()
          if ($key.Length -ne 64 -or $key -notmatch '^[0-9a-f]+') {
            throw "Production update verification key is unavailable."
          }
          "MINARVA_UPDATE_PUBLIC_KEY_HEX=$key" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download and verify v1.0.13 installer
        shell: pwsh
        run: |
          $base = "https://github.com/evertekitsolutions-del/minarvabiz/releases/download/v1.0.13"
          $installer = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Setup-1.0.13.exe"
          $checksum = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Setup-1.0.13.exe.sha256"
          Invoke-WebRequest -UseBasicParsing "$base/MinarvaBiz-Setup-1.0.13.exe" -OutFile $installer
          Invoke-WebRequest -UseBasicParsing "$base/MinarvaBiz-Setup-1.0.13.exe.sha256" -OutFile $checksum
          $expected = ((Get-Content -Raw $checksum).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($expected -notmatch '^[0-9a-f]{64}$' -or $actual -ne $expected) {
            throw "v1.0.13 release checksum verification failed."
          }
          "OLD_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "OLD_RELEASE_CHECKSUM PASS $actual"

      - name: Clean install v1.0.13
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Release-Upgrade-UAT"
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null

          $exitCode = $null
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            $copy = Join-Path $env:RUNNER_TEMP ("MinarvaBiz-1.0.13-attempt-{0}.exe" -f $attempt)
            Copy-Item -LiteralPath $env:OLD_INSTALLER -Destination $copy -Force
            Unblock-File -LiteralPath $copy -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath $copy -ArgumentList "/S", "/D=$installRoot" -PassThru -Wait
            $exitCode = $proc.ExitCode
            Remove-Item -LiteralPath $copy -Force -ErrorAction SilentlyContinue
            if ($exitCode -eq 0) { break }
            if ($exitCode -ne -1073741819 -or $attempt -eq 4) {
              throw "v1.0.13 installer exited with code $exitCode on attempt $attempt."
            }
            Start-Sleep -Seconds (2 * $attempt)
          }

          $exe = Join-Path $installRoot "Minarva Biz.exe"
          if (-not (Test-Path $exe)) { throw "v1.0.13 installed executable was not found." }
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "OLD_RELEASE_INSTALL PASS"

      - name: Launch installed v1.0.13
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList "--remote-debugging-port=$env:MINARVA_CDP_PORT" -PassThru
          "SOURCE_APP_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($i = 1; $i -le 40; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:MINARVA_CDP_PORT/json/list" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Milliseconds 750
          }
          if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port ([int]$env:MINARVA_CDP_PORT) -InformationLevel Quiet)) {
            throw "v1.0.13 Electron CDP port did not open."
          }

      - name: Check, download and start v1.0.14 update from v1.0.13
        shell: pwsh
        run: node scripts/windows-release-update-e2e.mjs prepare

      - name: Verify downloaded installer and update safety backup
        shell: pwsh
        run: |
          if (-not (Test-Path $env:MINARVA_UPDATE_E2E_STATE_FILE)) { throw "Update E2E state file is missing." }
          $state = Get-Content -Raw $env:MINARVA_UPDATE_E2E_STATE_FILE | ConvertFrom-Json
          if (-not (Test-Path $state.installerPath)) { throw "Verified downloaded v1.0.14 installer is missing." }
          if (-not (Test-Path $state.backupPath)) { throw "Verified v1.0.13 update safety backup is missing." }

          $manifest = Invoke-RestMethod -Uri $env:MINARVA_UPDATE_MANIFEST_URL -Headers @{ "Cache-Control" = "no-cache" }
          if ($manifest.version -ne "1.0.14") { throw "Production update manifest does not report v1.0.14." }
          $actual = (Get-FileHash -Algorithm SHA256 $state.installerPath).Hash.ToLower()
          if ($actual -ne "$($manifest.sha256)".ToLower()) {
            throw "Downloaded installer hash does not match production signed manifest."
          }
          "DOWNLOADED_INSTALLER=$($state.installerPath)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "UPDATE_DOWNLOAD_HASH PASS $actual"
          Write-Host "UPDATE_SAFETY_BACKUP_FILE PASS $($state.backupPath)"

      - name: Verify automatic v1.0.14 install and relaunch
        shell: pwsh
        run: |
          for ($i = 1; $i -le 60; $i++) {
            if (-not (Get-Process -Id ([int]$env:SOURCE_APP_PID) -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 500
          }
          if (Get-Process -Id ([int]$env:SOURCE_APP_PID) -ErrorAction SilentlyContinue) {
            throw "v1.0.13 did not close after starting the automatic update."
          }

          $auto = $null
          for ($i = 1; $i -le 120; $i++) {
            $auto = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ExecutablePath -eq $env:INSTALLED_EXE -and
                $_.ProcessId -ne ([int]$env:SOURCE_APP_PID)
              } |
              Select-Object -First 1
            if ($auto) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $auto) {
            throw "v1.0.14 did not relaunch automatically after the silent installer completed."
          }
          "AUTO_RELAUNCHED_PID=$($auto.ProcessId)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "AUTO_RELAUNCH PASS pid=$($auto.ProcessId)"

          Stop-Process -Id ([int]$auto.ProcessId) -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not (Test-Path $env:INSTALLED_EXE)) { throw "Upgraded executable is missing." }

      - name: Launch upgraded v1.0.14 under CDP for verification
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList "--remote-debugging-port=$env:MINARVA_CDP_PORT" -PassThru
          "TARGET_APP_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($i = 1; $i -le 40; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:MINARVA_CDP_PORT/json/list" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Milliseconds 750
          }
          if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port ([int]$env:MINARVA_CDP_PORT) -InformationLevel Quiet)) {
            throw "v1.0.14 Electron CDP port did not open."
          }

      - name: Verify v1.0.14 and preserved business data
        shell: pwsh
        run: node scripts/windows-release-update-e2e.mjs verify

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @("SOURCE_APP_PID", "TARGET_APP_PID")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { Stop-Process -Id ([int]$value) -Force -ErrorAction SilentlyContinue }
          }
          Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -like "*MinarvaBiz-Release-Upgrade-UAT*" -or $_.ProcessName -like "MinarvaBiz-Setup-*" } |
            Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload update E2E state
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minarvabiz-v1.0.13-to-v1.0.14-auto-update-e2e
          path: minarva-update-e2e-state.json
          if-no-files-found: ignore
          retention-days: 14
