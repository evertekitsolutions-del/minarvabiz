name: Release Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      MINARVA_RUNTIME_SMOKE: "1"
      MINARVA_COMMERCIAL_RELEASE: "1"
      VITE_LICENSE_API_URL: "https://minarvabiz-license-admin.onrender.com"
      MINARVA_UPDATE_MANIFEST_URL: "https://minarvabiz-license-admin.onrender.com/api/update/manifest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Fetch production license public key
        run: node scripts/fetch-license-public-key.mjs

      - name: Configure secure update verification key
        shell: pwsh
        run: |
          if ("$env:MINARVA_LICENSE_PUBLIC_KEY_HEX" -notmatch '^[0-9a-fA-F]{64}$') { throw "Production public key is unavailable for secure updates." }
          "MINARVA_UPDATE_PUBLIC_KEY_HEX=$env:MINARVA_LICENSE_PUBLIC_KEY_HEX" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate production licensing configuration
        shell: pwsh
        run: |
          $key = "$env:MINARVA_LICENSE_PUBLIC_KEY_HEX".Trim()
          $url = "$env:VITE_LICENSE_API_URL".Trim()
          if ($key -notmatch '^[0-9a-fA-F]{64}$') { throw "MINARVA_LICENSE_PUBLIC_KEY_HEX must be exactly 64 hexadecimal characters." }
          if (-not $url -or $url -notmatch '^https://') { throw "VITE_LICENSE_API_URL must be a non-empty HTTPS URL." }
          Write-Host "PRODUCTION_LICENSE_KEY PASS: configured 64-hex public verification key."
          Write-Host "LICENSE_API_URL PASS: configured HTTPS endpoint."

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify commercial fallback refusal
        shell: pwsh
        run: node scripts/verify-production-license-config.mjs

      - name: Static production quality smoke
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/desktop/build/icon.svg")) { throw "Branded desktop icon is missing." }
          if (-not (Test-Path "apps/desktop/public/minarva-biz-icon.svg")) { throw "Branded renderer icon is missing." }
          if (-not (Select-String -Path "apps/desktop/electron/main.ts" -Pattern 'Menu\.setApplicationMenu\(null\)' -Quiet)) { throw "Application menu removal is missing." }
          if (-not (Select-String -Path "packages/ui/src/components/settings/SettingsPanel.tsx" -Pattern 'midnight|ocean|emerald|violet' -Quiet)) { throw "Theme configuration is missing." }
          node scripts/quality-smoke.mjs
      - run: pnpm --filter @minarvabiz/business-logic typecheck
      - run: pnpm --filter @minarvabiz/ui typecheck
      - run: pnpm --filter @minarvabiz/desktop typecheck
      - run: pnpm --filter @minarvabiz/desktop run package:win

      - name: Verify production installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Installer SHA256: $hash"

      - name: Installed runtime UAT smoke
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Release-UAT"
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $sourceHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash
          $installExit = $null
          for ($installAttempt = 1; $installAttempt -le 4; $installAttempt++) {
            $attemptInstaller = Join-Path $env:RUNNER_TEMP ("MinarvaBiz-Release-Setup-attempt-{0}.exe" -f $installAttempt)
            Copy-Item -LiteralPath $installer.FullName -Destination $attemptInstaller -Force
            Unblock-File -LiteralPath $attemptInstaller -ErrorAction SilentlyContinue
            $copyHash = (Get-FileHash -Algorithm SHA256 $attemptInstaller).Hash
            if ($copyHash -ne $sourceHash) { throw "Installer copy hash mismatch on attempt $installAttempt." }
            Start-Sleep -Milliseconds 750
            $installProc = Start-Process -FilePath $attemptInstaller -ArgumentList "/S", "/D=$installRoot" -PassThru -Wait
            $installExit = $installProc.ExitCode
            Remove-Item -LiteralPath $attemptInstaller -Force -ErrorAction SilentlyContinue
            if ($installExit -eq 0) { break }
            if ($installExit -ne -1073741819 -or $installAttempt -eq 4) {
              throw "Windows installer exited with code $installExit on attempt $installAttempt."
            }
            Write-Warning "Transient NSIS access violation on hosted runner; retrying from a fresh verified installer copy."
            Start-Sleep -Seconds (2 * $installAttempt)
            if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          }
          $exe = Join-Path $installRoot "Minarva Biz.exe"
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem -Path $installRoot -Filter *.exe -Recurse -ErrorAction Stop | Where-Object { $_.Name -notlike "*Setup*.exe" } | Select-Object -First 1 | ForEach-Object FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw "Installed executable not found." }
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $db = $null
            for ($attempt = 1; $attempt -le 45 -and -not $db; $attempt++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "Minarva Biz exited during production runtime smoke (exit code $($proc.ExitCode))." }
              foreach ($root in @($env:APPDATA, $env:LOCALAPPDATA, $env:PROGRAMDATA) | Where-Object { $_ -and (Test-Path $_) }) {
                $candidate = Get-ChildItem -Path $root -Filter "minarvabiz.db" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($candidate) { $db = $candidate; break }
              }
            }
            if (-not $db) { throw "Production runtime smoke did not create minarvabiz.db." }
            $bytes = [System.IO.File]::ReadAllBytes($db.FullName)
            if ($bytes.Length -lt 16 -or [System.Text.Encoding]::ASCII.GetString($bytes, 0, 16) -ne "SQLite format 3`0") { throw "Invalid SQLite database at $($db.FullName)" }
            $logs = @($env:APPDATA, $env:LOCALAPPDATA, $env:RUNNER_TEMP) | Where-Object { $_ -and (Test-Path $_) } | ForEach-Object { Get-ChildItem -Path $_ -Filter "runtime-smoke.log" -Recurse -File -ErrorAction SilentlyContinue } | Sort-Object FullName -Unique
            if (-not ($logs | Select-String -Pattern 'bridge-ready=true')) { throw "Electron preload bridge was not confirmed in production runtime." }
            if ($logs | Select-String -Pattern 'bridge-ready=false') { throw "Electron preload bridge reported failure in production runtime." }
            Write-Host "Production runtime smoke PASS: process alive, SQLite valid, preload bridge confirmed."
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify bundled production public key
        shell: pwsh
        run: |
          $configPath = "apps/desktop/electron/license-config.ts"
          if (-not (Test-Path $configPath)) { throw "Generated desktop license config is missing." }
          $config = Get-Content -Raw $configPath
          $expected = $env:MINARVA_LICENSE_PUBLIC_KEY_HEX.Trim().ToLower()
          if ($config -notmatch [regex]::Escape($expected)) { throw "Bundled production public key does not match the configured GitHub secret." }
          if ($config -match 'PRIVATE_KEY|LICENSE_PRIVATE_KEY|privateKey') { throw "Potential private-key content found in bundled license configuration." }
          Write-Host "Bundled production public key verified."

      - name: Upload release installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minarvabiz-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
