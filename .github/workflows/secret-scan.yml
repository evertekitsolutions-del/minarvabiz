name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks History + Tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false
      - name: Verify secret-scan gate contract
        run: node scripts/secret-scan-gate-smoke.mjs
      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan complete Git history
        shell: bash
        run: |
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"
          "$GITLEAKS" git --redact --verbose --log-opts="--all" .
      - name: Scan current tracked tree
        shell: bash
        run: |
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"
          "$GITLEAKS" dir --redact --verbose .
