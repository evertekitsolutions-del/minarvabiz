name: One-time desktop bugfixes

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-desktop-bugfixes.mjs"
      - ".github/workflows/one-time-desktop-bugfixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patches
        run: node scripts/apply-desktop-bugfixes.mjs
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/App.tsx packages/ui/src/lib/nav.ts apps/desktop/electron/main.ts
          git rm scripts/apply-desktop-bugfixes.mjs .github/workflows/one-time-desktop-bugfixes.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0 || true
          git commit -m "fix: wire desktop search notifications and reports refresh"
          git push origin main
