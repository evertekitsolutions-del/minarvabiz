name: Windows Feature Click Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-click-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MINARVA_RUNTIME_SMOKE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/desktop typecheck
      - run: pnpm --filter @minarvabiz/desktop run package:win

      - name: Clean install
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Feature-UAT"
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $installer = Get-ChildItem -Path apps/desktop/release -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          # Keep attempt evidence even when installation fails before the app can log.
          $diagnostics = Join-Path $env:RUNNER_TEMP "MinarvaBiz-Install-Diagnostics"
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          Get-FileHash -Algorithm SHA256 $installer.FullName | Format-List | Out-File (Join-Path $diagnostics "installer-hash.txt")
          $installExit = $null
          for ($installAttempt = 1; $installAttempt -le 2; $installAttempt++) {
            $installProc = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installRoot" -PassThru -Wait
            $installExit = $installProc.ExitCode
            "Attempt $installAttempt exit code: $installExit" | Tee-Object -FilePath (Join-Path $diagnostics "install-attempts.txt") -Append
            if ($installExit -eq 0) { break }
            # One bounded retry for the observed NSIS access violation (0xC0000005).
            # Other errors and a repeated crash remain hard failures.
            if ($installExit -ne -1073741819 -or $installAttempt -eq 2) {
              throw "Installer exited with code $installExit on attempt $installAttempt."
            }
            Write-Warning "NSIS access violation; retrying the same installer once."
            Start-Sleep -Seconds 2
            if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
            New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          }
          $exe = Join-Path $installRoot "Minarva Biz.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found at $exe" }
          "INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Launch installed app with CDP
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList "--remote-debugging-port=9222" -PassThru
          "APP_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($i=1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9222/json/list -TimeoutSec 2
              if ($response.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port 9222 -InformationLevel Quiet)) { throw "Electron CDP port 9222 did not open." }

      - name: Feature-level click testing
        shell: pwsh
        run: node scripts/windows-populated-deep-smoke.mjs

      - name: Cleanup app
        if: always()
        shell: pwsh
        run: |
          if ($env:APP_PID) { Stop-Process -Id ([int]$env:APP_PID) -Force -ErrorAction SilentlyContinue }
          if ($env:INSTALL_ROOT) { Get-Process | Where-Object { $_.Path -like "*$env:INSTALL_ROOT*" } | Stop-Process -Force -ErrorAction SilentlyContinue }

      - name: Capture diagnostics
        if: always()
        shell: pwsh
        run: |
          $roots = @($env:APPDATA, $env:LOCALAPPDATA, $env:RUNNER_TEMP) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($root in $roots) {
            Get-ChildItem -Path $root -Filter "runtime-smoke.log" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Runtime diagnostics: $($_.FullName)"
              Get-Content -LiteralPath $_.FullName
            }
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: minarvabiz-windows-feature-smoke-diagnostics
          path: |
            ${{ runner.temp }}/MinarvaBiz-Feature-UAT/**
            ${{ runner.temp }}/**/runtime-smoke.log
            ${{ runner.temp }}/MinarvaBiz-Install-Diagnostics/**
          if-no-files-found: ignore
          retention-days: 14
