name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify SAST gate contract
        run: node scripts/sast-gate-smoke.mjs
      - name: Install Semgrep Community Edition
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir semgrep==1.162.0
      - name: Run blocking Semgrep scan
        run: >
          semgrep scan
          --config=p/nodejs
          --error
          --metrics=off
          --exclude=node_modules
          --exclude=.next
          --exclude=dist
          --exclude=release
          --exclude=coverage
          .
