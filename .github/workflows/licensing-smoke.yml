name: Licensing Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @minarvabiz/licensing typecheck
      - run: pnpm --filter @minarvabiz/licensing exec tsx src/__tests__/licensing-smoke.test.ts
      - name: Verify commercial fallback refusal
        run: node scripts/verify-production-license-config.mjs
      - name: Reject demo license paths
        shell: bash
        run: |
          set -e
          if grep -RIn --include='*.ts' --include='*.tsx' --exclude-dir=node_modules --exclude-dir=.git -E 'issueDemoLicense|activateDemoPlan|DEMO_PUBLIC_KEY_HEX|demo:' packages/licensing apps/desktop apps/license-admin; then
            echo "Development/demo licensing path is present in a production-facing TypeScript source tree."
            exit 1
          fi
