name: Clean one-shot UI repair

on:
  push:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Patch UI and data flows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern missing in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          rep('packages/business-logic/src/store.ts',
              '  address?: string | null; notes?: string | null;\n}): Customer {',
              '  address?: string | null; birthday?: string | null; notes?: string | null;\n}): Customer {')
          rep('packages/business-logic/src/store.ts',
              '    email: input.email || null, address: input.address ?? null, notes: input.notes ?? null,',
              '    email: input.email || null, address: input.address ?? null, birthday: input.birthday ?? null, notes: input.notes ?? null,')

          rep('packages/business-logic/src/phase5-store.ts',
              'export function createExpense(input: { date?: string; categoryId: UUID; amount: number; paymentMethod: PaymentMethod; description?: string | null; reference?: string | null; orderId?: UUID | null; }):',
              'export function createExpense(input: { date?: string; categoryId: UUID; amount: number; paymentMethod: PaymentMethod; description?: string | null; reference?: string | null; receiptUrl?: string | null; staffId?: UUID | null; orderId?: UUID | null; }):')
          rep('packages/business-logic/src/phase5-store.ts',
              'description: input.description ?? null, reference: input.reference ?? null, orderId: input.orderId ?? null, orderNumber,',
              'description: input.description ?? null, receiptUrl: input.receiptUrl ?? null, staffId: input.staffId ?? null, reference: input.reference ?? null, orderId: input.orderId ?? null, orderNumber,')

          rep('packages/business-logic/src/phase6-store.ts',
              'export function createStaff(input: { name: string; phone?: string | null; email?: string | null; role: RoleName | "tailor" | "staff"; salary?: number; joiningDate?: string | null; notes?: string | null; }): StaffMember {',
              'export function createStaff(input: { name: string; phone?: string | null; email?: string | null; role: RoleName | "tailor" | "staff"; salary?: number; joiningDate?: string | null; status?: StaffStatus; notes?: string | null; }): StaffMember {')
          rep('packages/business-logic/src/phase6-store.ts',
              'role: input.role, salary: input.salary ?? 0, joiningDate: input.joiningDate ?? null, status: "active", notes:',
              'role: input.role, salary: input.salary ?? 0, joiningDate: input.joiningDate ?? null, status: input.status ?? "active", notes:')

          rep('packages/ui/src/components/layout/Header.tsx',
              '  onNotificationsClick?: () => void;\n  onMessagesClick?: () => void;',
              '  onNotificationsClick?: () => void;\n  onMessagesClick?: () => void;\n  onCalendarClick?: (date: string) => void;')
          rep('packages/ui/src/components/layout/Header.tsx',
              '  onNotificationsClick,\n  onMessagesClick,\n  onLogout,',
              '  onNotificationsClick,\n  onMessagesClick,\n  onCalendarClick,\n  onLogout,')
          rep('packages/ui/src/components/layout/Header.tsx',
              '  const [query, setQuery] = React.useState("");\n  const today =',
              '  const [query, setQuery] = React.useState("");\n  const [calendarOpen, setCalendarOpen] = React.useState(false);\n  const [selectedDate, setSelectedDate] = React.useState(() => new Date().toISOString().slice(0, 10));\n  const today =')
          rep('packages/ui/src/components/layout/Header.tsx',
              '        <button\n          type="button"\n          className="rounded-lg p-2 text-slate-500 hover:bg-slate-100"\n          aria-label="Calendar"\n        >',
              '        <button type="button" onClick={() => setCalendarOpen((v) => !v)} className="rounded-lg p-2 text-slate-500 hover:bg-slate-100" aria-label="Calendar" title="Open calendar">')
          rep('packages/ui/src/components/layout/Header.tsx',
              '        <div className="ml-1 hidden items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-sm text-slate-700 sm:flex">',
              '        <button type="button" onClick={() => setCalendarOpen((v) => !v)} className="ml-1 hidden items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-sm text-slate-700 sm:flex" title="Open calendar">')
          rep('packages/ui/src/components/layout/Header.tsx',
              '        </div>\n        {onLogout ? (',
              '        </button>\n        {calendarOpen && <div className="absolute right-4 top-14 z-50 w-72 rounded-2xl border border-slate-200 bg-white p-4 shadow-xl"><div className="mb-2 text-sm font-semibold text-slate-800">Calendar</div><input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="h-10 w-full rounded-lg border border-slate-200 px-3 text-sm"/><div className="mt-3 flex gap-2"><button type="button" className="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm" onClick={() => setSelectedDate(new Date().toISOString().slice(0,10))}>Today</button><button type="button" className="flex-1 rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white" onClick={() => { onCalendarClick?.(selectedDate); setCalendarOpen(false); }}>Open</button></div></div>}\n        {onLogout ? (')

          rep('packages/ui/src/components/sales/PosBilling.tsx',
              '  onFindByBarcode?: (barcode: string) => Product | undefined;\n}',
              '  onFindByBarcode?: (barcode: string) => Product | undefined;\n  onAddCustomer?: () => void;\n}')
          rep('packages/ui/src/components/sales/PosBilling.tsx',
              'export function PosBilling({ products, customers, onCompleteSale, onComplete, onFindByBarcode }: PosBillingProps) {',
              'export function PosBilling({ products, customers, onCompleteSale, onComplete, onFindByBarcode, onAddCustomer }: PosBillingProps) {')
          rep('packages/ui/src/components/sales/PosBilling.tsx',
              '<select value={customerId} onChange={(e) => setCustomerId(e.target.value)} className="h-10 w-full rounded-lg border border-slate-200 px-3 text-sm"><option value="">Walk-in customer</option>{customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` (${c.phone})` : ""}</option>)}</select>',
              '<div className="flex gap-2"><select value={customerId} onChange={(e) => setCustomerId(e.target.value)} className="h-10 min-w-0 flex-1 rounded-lg border border-slate-200 px-3 text-sm"><option value="">Walk-in customer</option>{customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` (${c.phone})` : ""}</option>)}</select><Button type="button" size="sm" variant="outline" onClick={onAddCustomer}>+</Button></div>')

          # App state + handlers.
          rep('apps/desktop/src/App.tsx',
              '  const [custOpen, setCustOpen] = React.useState(false);\n  const [custForm, setCustForm] = React.useState({ name: "", phone: "", email: "" });',
              '  const [custOpen, setCustOpen] = React.useState(false);\n  const [custForm, setCustForm] = React.useState({ name: "", phone: "", whatsapp: "", email: "", address: "", birthday: "", notes: "" });\n  const [productOpen, setProductOpen] = React.useState(false);\n  const [productForm, setProductForm] = React.useState({ name:"", sku:"", barcode:"", categoryId:"", brand:"", size:"", color:"", fabric:"", unit:"pcs", costPrice:"", sellingPrice:"", discount:"0", taxRate:"0", stockQuantity:"", minimumStock:"0", supplierId:"", imageUrl:"", notes:"", hasVariants:false });')
          rep('apps/desktop/src/App.tsx',
              '  const [expenseForm, setExpenseForm] = React.useState({ categoryId: "", amount: "", paymentMethod: "cash" as PaymentMethod, description: "", reference: "", orderId: "" });',
              '  const [expenseForm, setExpenseForm] = React.useState({ date:"", categoryId:"", amount:"", paymentMethod:"cash" as PaymentMethod, description:"", reference:"", receiptUrl:"", staffId:"", orderId:"" });')
          rep('apps/desktop/src/App.tsx',
              '  const [purchaseForm, setPurchaseForm] = React.useState({ supplierId: "", description: "", amount: "", paidAmount: "", paymentMethod: "cash" as PaymentMethod, kind: "general" as "general" | "order_specific", orderId: "", notes: "" });',
              '  const [purchaseForm, setPurchaseForm] = React.useState({ date:"", supplierId:"", description:"", amount:"", paidAmount:"", paymentMethod:"cash" as PaymentMethod, kind:"general" as "general"|"order_specific", orderId:"", notes:"" });')
          rep('apps/desktop/src/App.tsx',
              '  const [staffForm, setStaffForm] = React.useState({ name: "", phone: "", email: "", role: "staff" as RoleName, salary: "", joiningDate: "", notes: "" });',
              '  const [staffForm, setStaffForm] = React.useState({ name:"", phone:"", email:"", role:"staff" as RoleName, salary:"", joiningDate:"", status:"active" as "active"|"inactive"|"on_leave", notes:"" });')
          rep('apps/desktop/src/App.tsx',
              'const result = phase5Store.createExpense({ categoryId: expenseForm.categoryId, amount: parseFloat(expenseForm.amount) || 0, paymentMethod: expenseForm.paymentMethod, description: expenseForm.description || null, reference: expenseForm.reference || null, orderId: expenseForm.orderId || null });',
              'const result = phase5Store.createExpense({date:expenseForm.date||undefined,categoryId:expenseForm.categoryId,amount:parseFloat(expenseForm.amount)||0,paymentMethod:expenseForm.paymentMethod,description:expenseForm.description||null,reference:expenseForm.reference||null,receiptUrl:expenseForm.receiptUrl||null,staffId:expenseForm.staffId||null,orderId:expenseForm.orderId||null});')
          rep('apps/desktop/src/App.tsx',
              'phase6Store.createStaff({ name: staffForm.name.trim(), phone: staffForm.phone || null, email: staffForm.email || null, role: staffForm.role, salary: parseFloat(staffForm.salary) || 0, joiningDate: staffForm.joiningDate || null, notes: staffForm.notes || null });',
              'phase6Store.createStaff({name:staffForm.name.trim(),phone:staffForm.phone||null,email:staffForm.email||null,role:staffForm.role,salary:parseFloat(staffForm.salary)||0,joiningDate:staffForm.joiningDate||null,status:staffForm.status,notes:staffForm.notes||null});')
          rep('apps/desktop/src/App.tsx','setExpenseForm({ categoryId: "", amount: "", paymentMethod: "cash", description: "", reference: "", orderId: "" });','setExpenseForm({date:"",categoryId:"",amount:"",paymentMethod:"cash",description:"",reference:"",receiptUrl:"",staffId:"",orderId:""});')
          rep('apps/desktop/src/App.tsx','setPurchaseForm({ supplierId: "", description: "", amount: "", paidAmount: "", paymentMethod: "cash", kind: "general", orderId: "", notes: "" });','setPurchaseForm({date:"",supplierId:"",description:"",amount:"",paidAmount:"",paymentMethod:"cash",kind:"general",orderId:"",notes:""});')
          rep('apps/desktop/src/App.tsx','setStaffForm({ name: "", phone: "", email: "", role: "staff", salary: "", joiningDate: "", notes: "" });','setStaffForm({name:"",phone:"",email:"",role:"staff",salary:"",joiningDate:"",status:"active",notes:""});')
          rep('apps/desktop/src/App.tsx','header={{ showSearch: view !== "dashboard", title: view === "services" ? "Services & Orders" : view, subtitle: "Welcome back, Admin!", notificationCount: phase6Store.unreadNotificationCount(), messageCount: 3 }}','header={{showSearch:view!=="dashboard",title:view==="services"?"Services & Orders":view,subtitle:"Welcome back, Admin!",notificationCount:phase6Store.unreadNotificationCount(),messageCount:phase6Store.unreadNotificationCount(),onMessagesClick:()=>navTo("notifications"),onNotificationsClick:()=>navTo("notifications"),onCalendarClick:()=>navTo("reports")}}')
          rep('apps/desktop/src/App.tsx','{view === "products" && <ProductList products={products} categories={categories} lowStockOnly={lowStockOnly} onToggleLowStock={() => setLowStockOnly((v) => !v)} />}','{view === "products" && <ProductList products={products} categories={categories} lowStockOnly={lowStockOnly} onToggleLowStock={() => setLowStockOnly((v) => !v)} onAdd={()=>{resetProductForm();setProductOpen(true);}} />}')
          rep('apps/desktop/src/App.tsx','<PosBilling products={products} customers={customers} onCompleteSale={handleSale} />','<PosBilling products={products} customers={customers} onAddCustomer={openCustomerCreator} onCompleteSale={handleSale} />')
          rep('apps/desktop/src/App.tsx','<OrderForm value={form} customers={customers} profiles={profiles} onChange={setForm} onLoadProfiles={(customerId) => setProfiles(ordersStore.listMeasurementProfiles(customerId))} onSubmit={handleCreateOrder} onCancel={() => setCreateOpen(false)} error={formError} />','<OrderForm value={form} customers={customers} profiles={profiles} onChange={setForm} onLoadProfiles={(customerId) => setProfiles(ordersStore.listMeasurementProfiles(customerId))} onAddCustomer={openCustomerCreator} onSubmit={handleCreateOrder} onCancel={() => setCreateOpen(false)} error={formError} />')
          rep('apps/desktop/src/App.tsx','<LaundryForm mode={laundryMode || "outsourced"} customers={customers} suppliers={suppliers} onSubmit={handleCreateLaundry} onCancel={() => setLaundryMode(null)} error={laundryError} />','<LaundryForm mode={laundryMode || "outsourced"} customers={customers} suppliers={suppliers} onAddCustomer={openCustomerCreator} onSubmit={handleCreateLaundry} onCancel={() => setLaundryMode(null)} error={laundryError} />')
          # Helpers immediately before early returns so they remain non-hook functions.
          anchor='  if (dbError) return'
          helper='''  function resetCustomerForm(){setCustForm({name:"",phone:"",whatsapp:"",email:"",address:"",birthday:"",notes:""});}\n  function resetProductForm(){setProductForm({name:"",sku:"",barcode:"",categoryId:"",brand:"",size:"",color:"",fabric:"",unit:"pcs",costPrice:"",sellingPrice:"",discount:"0",taxRate:"0",stockQuantity:"",minimumStock:"0",supplierId:"",imageUrl:"",notes:"",hasVariants:false});}\n  function openCustomerCreator(){setModuleError(null);setCustOpen(true);}\n  function handleCreateCustomer(){try{if(!custForm.name.trim())throw new Error("Customer name is required");store.createCustomer({name:custForm.name.trim(),phone:custForm.phone||null,whatsapp:custForm.whatsapp||null,email:custForm.email||null,address:custForm.address||null,birthday:custForm.birthday||null,notes:custForm.notes||null});setCustomers(store.listCustomers());setCustOpen(false);resetCustomerForm();setModuleError(null);void persistAndRefresh();}catch(error){setModuleError(error instanceof Error?error.message:String(error));}}\n  function handleCreateProduct(){try{if(!productForm.name.trim())throw new Error("Product name is required");store.createProduct({name:productForm.name.trim(),sku:productForm.sku||null,barcode:productForm.barcode||null,categoryId:productForm.categoryId||null,brand:productForm.brand||null,size:productForm.size||null,color:productForm.color||null,fabric:productForm.fabric||null,unit:productForm.unit||"pcs",costPrice:Number(productForm.costPrice)||0,sellingPrice:Number(productForm.sellingPrice)||0,discount:Number(productForm.discount)||0,taxRate:Number(productForm.taxRate)||0,stockQuantity:Number(productForm.stockQuantity)||0,minimumStock:Number(productForm.minimumStock)||0,supplierId:productForm.supplierId||null,imageUrl:productForm.imageUrl||null,notes:productForm.notes||null,isActive:true,hasVariants:productForm.hasVariants});setProducts(store.listProducts({lowStockOnly}));setProductOpen(false);resetProductForm();setModuleError(null);void persistAndRefresh();}catch(error){setModuleError(error instanceof Error?error.message:String(error));}}\n'''
          rep('apps/desktop/src/App.tsx',anchor,helper+anchor)
          # Remove local customer modal from customer page and mount it globally with product modal.
          start='    {view === "customers" && <><CustomerList customers={customers} onAdd={() => setCustOpen(true)} onSearch={(q) => setCustomers(store.listCustomers(q))} />'
          if start not in Path('apps/desktop/src/App.tsx').read_text(): raise SystemExit('customer page block missing')
          p=Path('apps/desktop/src/App.tsx'); s=p.read_text(); st=s.index(start); en=s.index('</Modal></>}',st)+len('</Modal></>}'); s=s[:st]+'    {view === "customers" && <CustomerList customers={customers} onAdd={openCustomerCreator} onSearch={(q)=>setCustomers(store.listCustomers(q))} />}'+s[en:]; p.write_text(s)
          # Full expense/purchase/staff forms.
          p=Path('apps/desktop/src/App.tsx'); s=p.read_text(); st=s.index('    <Modal open={expenseOpen} title="Add Expense"'); en=s.index('    {moduleError',st)
          forms='''    <Modal open={custOpen} title="Add Customer" onClose={()=>setCustOpen(false)} footer={<><Button type="button" variant="outline" onClick={()=>setCustOpen(false)}>Cancel</Button><Button type="button" onClick={handleCreateCustomer}>Save Customer</Button></>}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Name *"><input className={inputClass} value={custForm.name} onChange={e=>setCustForm({...custForm,name:e.target.value})}/></FormField><FormField label="Phone"><input className={inputClass} value={custForm.phone} onChange={e=>setCustForm({...custForm,phone:e.target.value})}/></FormField><FormField label="WhatsApp"><input className={inputClass} value={custForm.whatsapp} onChange={e=>setCustForm({...custForm,whatsapp:e.target.value})}/></FormField><FormField label="Email"><input className={inputClass} type="email" value={custForm.email} onChange={e=>setCustForm({...custForm,email:e.target.value})}/></FormField><FormField label="Address"><textarea className={inputClass} value={custForm.address} onChange={e=>setCustForm({...custForm,address:e.target.value})}/></FormField><FormField label="Birthday"><input className={inputClass} type="date" value={custForm.birthday} onChange={e=>setCustForm({...custForm,birthday:e.target.value})}/></FormField><FormField label="Notes"><input className={inputClass} value={custForm.notes} onChange={e=>setCustForm({...custForm,notes:e.target.value})}/></FormField></div></Modal>\n    <Modal open={productOpen} title="Add Product" onClose={()=>setProductOpen(false)} footer={<><Button type="button" variant="outline" onClick={()=>setProductOpen(false)}>Cancel</Button><Button type="button" onClick={handleCreateProduct}>Save Product</Button></>}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Product name *" className="sm:col-span-2"><input className={inputClass} value={productForm.name} onChange={e=>setProductForm({...productForm,name:e.target.value})}/></FormField><FormField label="SKU"><input className={inputClass} value={productForm.sku} onChange={e=>setProductForm({...productForm,sku:e.target.value})}/></FormField><FormField label="Barcode"><input className={inputClass} value={productForm.barcode} onChange={e=>setProductForm({...productForm,barcode:e.target.value})}/></FormField><FormField label="Category"><select className={selectClass} value={productForm.categoryId} onChange={e=>setProductForm({...productForm,categoryId:e.target.value})}><option value="">No category</option>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></FormField><FormField label="Brand"><input className={inputClass} value={productForm.brand} onChange={e=>setProductForm({...productForm,brand:e.target.value})}/></FormField><FormField label="Size"><input className={inputClass} value={productForm.size} onChange={e=>setProductForm({...productForm,size:e.target.value})}/></FormField><FormField label="Color"><input className={inputClass} value={productForm.color} onChange={e=>setProductForm({...productForm,color:e.target.value})}/></FormField><FormField label="Fabric"><input className={inputClass} value={productForm.fabric} onChange={e=>setProductForm({...productForm,fabric:e.target.value})}/></FormField><FormField label="Unit"><input className={inputClass} value={productForm.unit} onChange={e=>setProductForm({...productForm,unit:e.target.value})}/></FormField><FormField label="Cost price"><input className={inputClass} type="number" value={productForm.costPrice} onChange={e=>setProductForm({...productForm,costPrice:e.target.value})}/></FormField><FormField label="Selling price *"><input className={inputClass} type="number" value={productForm.sellingPrice} onChange={e=>setProductForm({...productForm,sellingPrice:e.target.value})}/></FormField><FormField label="Discount %"><input className={inputClass} type="number" value={productForm.discount} onChange={e=>setProductForm({...productForm,discount:e.target.value})}/></FormField><FormField label="Tax %"><input className={inputClass} type="number" value={productForm.taxRate} onChange={e=>setProductForm({...productForm,taxRate:e.target.value})}/></FormField><FormField label="Opening stock"><input className={inputClass} type="number" value={productForm.stockQuantity} onChange={e=>setProductForm({...productForm,stockQuantity:e.target.value})}/></FormField><FormField label="Minimum stock"><input className={inputClass} type="number" value={productForm.minimumStock} onChange={e=>setProductForm({...productForm,minimumStock:e.target.value})}/></FormField><FormField label="Supplier"><select className={selectClass} value={productForm.supplierId} onChange={e=>setProductForm({...productForm,supplierId:e.target.value})}><option value="">No supplier</option>{suppliers.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></FormField><FormField label="Image URL"><input className={inputClass} value={productForm.imageUrl} onChange={e=>setProductForm({...productForm,imageUrl:e.target.value})}/></FormField><FormField label="Notes" className="sm:col-span-2"><textarea className={inputClass} value={productForm.notes} onChange={e=>setProductForm({...productForm,notes:e.target.value})}/></FormField><label className="flex items-center gap-2 text-sm sm:col-span-2"><input type="checkbox" checked={productForm.hasVariants} onChange={e=>setProductForm({...productForm,hasVariants:e.target.checked})}/>Product has variants</label></div></Modal>\n    <Modal open={expenseOpen} title="Add Expense" onClose={()=>setExpenseOpen(false)} footer={<><Button type="button" variant="outline" onClick={()=>setExpenseOpen(false)}>Cancel</Button><Button type="button" onClick={handleCreateExpense}>Save Expense</Button></>}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Date"><input className={inputClass} type="date" value={expenseForm.date} onChange={e=>setExpenseForm({...expenseForm,date:e.target.value})}/></FormField><FormField label="Category *"><select className={selectClass} value={expenseForm.categoryId} onChange={e=>setExpenseForm({...expenseForm,categoryId:e.target.value})}>{expenseCategories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></FormField><FormField label="Amount *"><input className={inputClass} type="number" value={expenseForm.amount} onChange={e=>setExpenseForm({...expenseForm,amount:e.target.value})}/></FormField><FormField label="Payment method"><select className={selectClass} value={expenseForm.paymentMethod} onChange={e=>setExpenseForm({...expenseForm,paymentMethod:e.target.value as PaymentMethod})}><option value="cash">Cash</option><option value="card">Card</option><option value="upi">UPI</option><option value="bank">Bank</option><option value="online">Online</option><option value="other">Other</option></select></FormField><FormField label="Paid to / Staff"><select className={selectClass} value={expenseForm.staffId} onChange={e=>setExpenseForm({...expenseForm,staffId:e.target.value})}><option value="">General</option>{staff.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></FormField><FormField label="Order link"><select className={selectClass} value={expenseForm.orderId} onChange={e=>setExpenseForm({...expenseForm,orderId:e.target.value})}><option value="">General</option>{orders.map(o=><option key={o.id} value={o.id}>{o.orderNumber}</option>)}</select></FormField><FormField label="Description" className="sm:col-span-2"><textarea className={inputClass} value={expenseForm.description} onChange={e=>setExpenseForm({...expenseForm,description:e.target.value})}/></FormField><FormField label="Reference"><input className={inputClass} value={expenseForm.reference} onChange={e=>setExpenseForm({...expenseForm,reference:e.target.value})}/></FormField><FormField label="Receipt reference"><input className={inputClass} value={expenseForm.receiptUrl} onChange={e=>setExpenseForm({...expenseForm,receiptUrl:e.target.value})}/></FormField></div></Modal>\n    <Modal open={purchaseOpen} title="Add Purchase" onClose={()=>setPurchaseOpen(false)} footer={<><Button type="button" variant="outline" onClick={()=>setPurchaseOpen(false)}>Cancel</Button><Button type="button" onClick={handleCreatePurchase}>Save Purchase</Button></>}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Date"><input className={inputClass} type="date" value={purchaseForm.date} onChange={e=>setPurchaseForm({...purchaseForm,date:e.target.value})}/></FormField><FormField label="Supplier"><select className={selectClass} value={purchaseForm.supplierId} onChange={e=>setPurchaseForm({...purchaseForm,supplierId:e.target.value})}><option value="">Select supplier</option>{suppliers.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></FormField><FormField label="Description *"><textarea className={inputClass} value={purchaseForm.description} onChange={e=>setPurchaseForm({...purchaseForm,description:e.target.value})}/></FormField><FormField label="Amount *"><input className={inputClass} type="number" value={purchaseForm.amount} onChange={e=>setPurchaseForm({...purchaseForm,amount:e.target.value})}/></FormField><FormField label="Paid amount"><input className={inputClass} type="number" value={purchaseForm.paidAmount} onChange={e=>setPurchaseForm({...purchaseForm,paidAmount:e.target.value})}/></FormField><FormField label="Payment method"><select className={selectClass} value={purchaseForm.paymentMethod} onChange={e=>setPurchaseForm({...purchaseForm,paymentMethod:e.target.value as PaymentMethod})}><option value="cash">Cash</option><option value="card">Card</option><option value="upi">UPI</option><option value="bank">Bank</option><option value="online">Online</option><option value="other">Other</option></select></FormField><FormField label="Purchase type"><select className={selectClass} value={purchaseForm.kind} onChange={e=>setPurchaseForm({...purchaseForm,kind:e.target.value as "general"|"order_specific"})}><option value="general">General / Stock</option><option value="order_specific">Order-specific</option></select></FormField><FormField label="Order link"><select className={selectClass} value={purchaseForm.orderId} onChange={e=>setPurchaseForm({...purchaseForm,orderId:e.target.value})}><option value="">None</option>{orders.map(o=><option key={o.id} value={o.id}>{o.orderNumber}</option>)}</select></FormField><FormField label="Notes"><textarea className={inputClass} value={purchaseForm.notes} onChange={e=>setPurchaseForm({...purchaseForm,notes:e.target.value})}/></FormField></div></Modal>\n    <Modal open={staffOpen} title="Add Staff" onClose={()=>setStaffOpen(false)} footer={<><Button type="button" variant="outline" onClick={()=>setStaffOpen(false)}>Cancel</Button><Button type="button" onClick={handleCreateStaff}>Save Staff</Button></>}><div className="grid grid-cols-1 gap-4 sm:grid-cols-2"><FormField label="Full name *"><input className={inputClass} value={staffForm.name} onChange={e=>setStaffForm({...staffForm,name:e.target.value})}/></FormField><FormField label="Phone"><input className={inputClass} value={staffForm.phone} onChange={e=>setStaffForm({...staffForm,phone:e.target.value})}/></FormField><FormField label="Email"><input className={inputClass} type="email" value={staffForm.email} onChange={e=>setStaffForm({...staffForm,email:e.target.value})}/></FormField><FormField label="Role"><select className={selectClass} value={staffForm.role} onChange={e=>setStaffForm({...staffForm,role:e.target.value as RoleName})}><option value="staff">Staff</option><option value="tailor">Tailor</option><option value="cashier">Cashier</option><option value="manager">Manager</option><option value="admin">Admin</option></select></FormField><FormField label="Salary"><input className={inputClass} type="number" value={staffForm.salary} onChange={e=>setStaffForm({...staffForm,salary:e.target.value})}/></FormField><FormField label="Joining date"><input className={inputClass} type="date" value={staffForm.joiningDate} onChange={e=>setStaffForm({...staffForm,joiningDate:e.target.value})}/></FormField><FormField label="Status"><select className={selectClass} value={staffForm.status} onChange={e=>setStaffForm({...staffForm,status:e.target.value as "active"|"inactive"|"on_leave"})}><option value="active">Active</option><option value="inactive">Inactive</option><option value="on_leave">On leave</option></select></FormField><FormField label="Notes"><textarea className={inputClass} value={staffForm.notes} onChange={e=>setStaffForm({...staffForm,notes:e.target.value})}/></FormField></div></Modal>\n'''
          s=s[:st]+forms+s[en:]; p.write_text(s)
          PY
      - name: Replace reports panel with clean implementation
        shell: bash
        run: |
          set -euo pipefail
          cat > packages/ui/src/components/reports/ReportsPanel.tsx <<'EOF'
          "use client";
          import * as React from "react";
          import type { SalesReportRow, Customer, Expense, Purchase, ServiceOrder, StaffMember, Payment } from "@minarvabiz/types";
          import { Button } from "../Button";
          import { Card, CardContent, CardHeader, CardTitle } from "../Card";
          import { formatMoney } from "../customers/format";

          export interface DayEndView { totalSales:number; totalExpenses:number; costOfGoods:number; serviceRevenue:number; serviceExpenses:number; grossProfit:number; netProfit:number; cashReceived:number; cardPayments:number; otherPayments:number; outstandingAmount:number; }
          export interface StockRow { id:string; name:string; sku?:string|null; stock:number; min:number; value:number; low:boolean; }
          type Tab="sales"|"dayend"|"stock"|"outstanding"|"customers"|"services"|"expenses"|"purchases"|"staff"|"payments";
          const csvEsc=(v:unknown)=>{const dq=String.fromCharCode(34),nl=String.fromCharCode(10),s=String(v??"");return s.includes(dq)||s.includes(nl)?dq+s.replaceAll(dq,dq+dq)+dq:s};
          const downloadCsv=(name:string,rows:unknown[][])=>{const nl=String.fromCharCode(10),b=new Blob([rows.map(r=>r.map(csvEsc).join(",")).join(nl)],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)};
          export function ReportsPanel({salesRows,sales,dayEnd,stock,outstanding,customers=[],expenses=[],purchases=[],orders=[],staff=[],payments=[],onRefresh,onPrint,onPdf}:{salesRows?:SalesReportRow[];sales?:SalesReportRow[];dayEnd:DayEndView;stock:StockRow[];outstanding:Array<{id:string;name:string;phone?:string|null;outstanding:number}>;customers?:Customer[];expenses?:Expense[];purchases?:Purchase[];orders?:ServiceOrder[];staff?:StaffMember[];payments?:Payment[];onRefresh?:()=>void;onPrint?:()=>void;onPdf?:()=>void}){
            const[tab,setTab]=React.useState<Tab>("sales"); const rows=salesRows??sales??[];
            const serviceGroups=React.useMemo(()=>{const m=new Map<string,{count:number;revenue:number;balance:number}>();for(const o of orders){if(o.status==="cancelled")continue;const x=m.get(o.serviceType)||{count:0,revenue:0,balance:0};x.count++;x.revenue+=o.price;x.balance+=o.balance;m.set(o.serviceType,x)}return [...m.entries()]},[orders]);
            const expenseGroups=React.useMemo(()=>{const m=new Map<string,number>();for(const e of expenses){const k=e.categoryName||e.categoryId;m.set(k,(m.get(k)||0)+e.amount)}return [...m.entries()]},[expenses]);
            const purchaseGroups=React.useMemo(()=>{const m=new Map<string,{amount:number;paid:number;balance:number}>();for(const p of purchases){const k=p.supplierName||"Unassigned";const x=m.get(k)||{amount:0,paid:0,balance:0};x.amount+=p.amount;x.paid+=p.paidAmount;x.balance+=p.balanceAmount;m.set(k,x)}return [...m.entries()]},[purchases]);
            const paymentGroups=React.useMemo(()=>{const m=new Map<string,number>();for(const p of payments)m.set(p.method,(m.get(p.method)||0)+p.amount);return [...m.entries()]},[payments]);
            function exportCurrent(){let h:string[]=[];let d:unknown[][]=[];switch(tab){case"sales":h=["Period","Products","Services","Laundry","Revenue","Expenses","Net Profit"];d=rows.map(r=>[r.label,r.productSales,r.serviceRevenue,r.laundryRevenue,r.totalRevenue,r.expenses,r.netProfit]);break;case"dayend":h=["Metric","Value"];d=[["Total sales",dayEnd.totalSales],["Service revenue",dayEnd.serviceRevenue],["COGS",dayEnd.costOfGoods],["Gross profit",dayEnd.grossProfit],["Expenses",dayEnd.totalExpenses],["Net profit",dayEnd.netProfit],["Cash",dayEnd.cashReceived],["Card/UPI",dayEnd.cardPayments],["Other",dayEnd.otherPayments],["Outstanding",dayEnd.outstandingAmount]];break;case"stock":h=["Product","SKU","Stock","Minimum","Value"];d=stock.map(r=>[r.name,r.sku||"",r.stock,r.min,r.value]);break;case"outstanding":h=["Customer","Phone","Outstanding"];d=outstanding.map(r=>[r.name,r.phone||"",r.outstanding]);break;case"customers":h=["Name","Phone","WhatsApp","Email","Address","Birthday","Spend","Outstanding"];d=customers.map(c=>[c.name,c.phone||"",c.whatsapp||"",c.email||"",c.address||"",c.birthday||"",c.totalSpending,c.outstandingBalance]);break;case"services":h=["Service","Orders","Revenue","Balance"];d=serviceGroups.map(([k,v])=>[k,v.count,v.revenue,v.balance]);break;case"expenses":h=["Category","Amount"];d=expenseGroups;break;case"purchases":h=["Supplier","Amount","Paid","Balance"];d=purchaseGroups.map(([k,v])=>[k,v.amount,v.paid,v.balance]);break;case"staff":h=["Name","Role","Salary","Status","Joining Date"];d=staff.map(s=>[s.name,s.role,s.salary,s.status,s.joiningDate||""]);break;default:h=["Payment Method","Amount"];d=paymentGroups;}downloadCsv(`minarvabiz-${tab}-report-${new Date().toISOString().slice(0,10)}.csv`,[h,...d])}
            const tabs:[Tab,string][]=[["sales","Sales"],["dayend","Day-end"],["stock","Inventory"],["outstanding","Outstanding"],["customers","Customers"],["services","Services"],["expenses","Expenses"],["purchases","Purchases"],["staff","Staff"],["payments","Payments"]];
            return <div className="space-y-4" id="minarva-report-print-root"><div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><div><h2 className="text-xl font-semibold text-slate-900">Reports & Analytics</h2><p className="text-sm text-slate-500">Complete operational, financial and customer reporting.</p></div><div className="flex flex-wrap gap-2"><Button type="button" variant="outline" onClick={onRefresh}>Refresh</Button><Button type="button" variant="outline" onClick={exportCurrent}>Export CSV</Button><Button type="button" variant="outline" onClick={()=>onPrint?onPrint():window.print()}>Print</Button><Button type="button" onClick={()=>onPdf?onPdf():window.print()}>Save PDF</Button></div></div><div className="flex flex-wrap gap-2">{tabs.map(([t,l])=><Button type="button" size="sm" key={t} variant={tab===t?"primary":"outline"} onClick={()=>setTab(t)}>{l}</Button>)}</div>{tab==="sales"&&<Card><CardHeader><CardTitle className="text-sm">Sales summary</CardTitle></CardHeader><CardContent className="overflow-x-auto"><table className="w-full text-sm"><tbody>{rows.map(r=><tr key={r.label}><td className="py-2">{r.label}</td><td>{formatMoney(r.productSales)}</td><td>{formatMoney(r.serviceRevenue)}</td><td>{formatMoney(r.laundryRevenue)}</td><td>{formatMoney(r.totalRevenue)}</td><td>{formatMoney(r.expenses)}</td><td>{formatMoney(r.netProfit)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="dayend"&&<div className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">{[["Total sales",dayEnd.totalSales],["Service revenue",dayEnd.serviceRevenue],["COGS",dayEnd.costOfGoods],["Gross profit",dayEnd.grossProfit],["Expenses",dayEnd.totalExpenses],["Net profit",dayEnd.netProfit],["Cash",dayEnd.cashReceived],["Card/UPI",dayEnd.cardPayments],["Other",dayEnd.otherPayments],["Outstanding",dayEnd.outstandingAmount]].map(([l,v])=><Card key={String(l)}><CardContent className="p-4"><div className="text-xs text-slate-500">{l}</div><div className="text-lg font-bold">{formatMoney(v as number)}</div></CardContent></Card>)}</div>}{tab==="stock"&&<Card><CardContent className="overflow-x-auto p-4"><table className="w-full text-sm"><tbody>{stock.map(r=><tr key={r.id}><td>{r.name}</td><td>{r.sku||"—"}</td><td>{r.stock}</td><td>{r.min}</td><td>{formatMoney(r.value)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="outstanding"&&<Card><CardContent className="space-y-2 p-4">{outstanding.map(c=><div key={c.id} className="flex justify-between"><span>{c.name}</span><strong>{formatMoney(c.outstanding)}</strong></div>)}{outstanding.length===0&&<p className="text-sm text-slate-400">No outstanding balances</p>}</CardContent></Card>}{tab==="customers"&&<Card><CardContent className="overflow-x-auto p-4"><table className="w-full text-sm"><tbody>{customers.map(c=><tr key={c.id}><td>{c.name}</td><td>{c.phone||"—"}</td><td>{c.whatsapp||"—"}</td><td>{c.email||"—"}</td><td>{c.address||"—"}</td><td>{c.birthday||"—"}</td><td>{formatMoney(c.totalSpending)}</td><td>{formatMoney(c.outstandingBalance)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="services"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{serviceGroups.map(([k,v])=><tr key={k}><td>{k}</td><td>{v.count}</td><td>{formatMoney(v.revenue)}</td><td>{formatMoney(v.balance)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="expenses"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{expenseGroups.map(([k,v])=><tr key={k}><td>{k}</td><td>{formatMoney(v)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="purchases"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{purchaseGroups.map(([k,v])=><tr key={k}><td>{k}</td><td>{formatMoney(v.amount)}</td><td>{formatMoney(v.paid)}</td><td>{formatMoney(v.balance)}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="staff"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{staff.map(s=><tr key={s.id}><td>{s.name}</td><td>{s.role}</td><td>{formatMoney(s.salary)}</td><td>{s.status}</td><td>{s.joiningDate||"—"}</td></tr>)}</tbody></table></CardContent></Card>}{tab==="payments"&&<Card><CardContent className="p-4"><table className="w-full text-sm"><tbody>{paymentGroups.map(([k,v])=><tr key={k}><td>{k}</td><td>{formatMoney(v)}</td></tr>)}</tbody></table></CardContent></Card>}</div>;
          }
          EOF
      - name: Add native report print PDF API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path);s=p.read_text()
              if old not in s: raise SystemExit(f'missing {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))
          rep('apps/desktop/electron/preload.ts','  relaunch: () => ipcRenderer.invoke("app:relaunch") as Promise<boolean>,','  relaunch: () => ipcRenderer.invoke("app:relaunch") as Promise<boolean>,\n  printCurrent: () => ipcRenderer.invoke("report:print") as Promise<{ok:boolean;error?:string;cancelled?:boolean}>,\n  saveCurrentPdf: () => ipcRenderer.invoke("report:savePdf") as Promise<{ok:boolean;path?:string;error?:string;cancelled?:boolean}>,')
          rep('apps/desktop/electron/preload.ts','  relaunch: () => Promise<boolean>;\n};','  relaunch: () => Promise<boolean>;\n  printCurrent: () => Promise<{ok:boolean;error?:string;cancelled?:boolean}>;\n  saveCurrentPdf: () => Promise<{ok:boolean;path?:string;error?:string;cancelled?:boolean}>;\n};')
          p=Path('apps/desktop/electron/main.ts');s=p.read_text()
          if 'ipcMain.handle("report:print"' not in s:
              s+='''\n\nipcMain.handle("report:print", async (event) => { requireTrustedRenderer(event); return await new Promise((resolve) => { event.sender.print({silent:false,printBackground:true},(success,reason)=>resolve(success?{ok:true}:{ok:false,error:reason||"Print failed"})); }); });\nipcMain.handle("report:savePdf", async (event) => { requireTrustedRenderer(event); const owner=BrowserWindow.fromWebContents(event.sender)||undefined; const picked=await dialog.showSaveDialog(owner,{defaultPath:path.join(app.getPath("documents"),`minarvabiz-report-${timestamp()}.pdf`),filters:[{name:"PDF",extensions:["pdf"]}]}); if(picked.canceled||!picked.filePath)return {ok:false,cancelled:true}; try{const pdf=await event.sender.printToPDF({printBackground:true,preferCSSPageSize:true});fs.writeFileSync(picked.filePath,pdf);return {ok:true,path:picked.filePath}}catch(error){return {ok:false,error:error instanceof Error?error.message:String(error)}} });\n'''
              p.write_text(s)
          PY
