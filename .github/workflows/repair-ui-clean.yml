name: Clean one-shot UI repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Finalize App forms and wiring
        shell: bash
        run: |
          set -euo pipefail
          MSG="$(git show -s --format=%s)"
          if [ "$MSG" = "chore(release): finalize source" ]; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/desktop/src/App.tsx'); s=p.read_text()
          def rep(old,new,label):
            global s
            if old not in s: raise SystemExit(label+' not found')
            s=s.replace(old,new,1)
          rep('const [custForm, setCustForm] = React.useState({ name: "", phone: "", email: "" });','const [custForm, setCustForm] = React.useState({ name: "", phone: "", whatsapp: "", email: "", address: "", birthday: "", notes: "" });\n  const [productOpen, setProductOpen] = React.useState(false);\n  const [productForm, setProductForm] = React.useState({ name:"", sku:"", barcode:"", categoryId:"", brand:"", size:"", color:"", fabric:"", unit:"pcs", costPrice:"", sellingPrice:"", discount:"0", taxRate:"0", stockQuantity:"", minimumStock:"0", supplierId:"", imageUrl:"", notes:"", hasVariants:false });','state')
          marker='  if (dbError) return'
          helper='''  function resetCustomerForm(){setCustForm({name:"",phone:"",whatsapp:"",email:"",address:"",birthday:"",notes:""});}\n  function resetProductForm(){setProductForm({name:"",sku:"",barcode:"",categoryId:"",brand:"",size:"",color:"",fabric:"",unit:"pcs",costPrice:"",sellingPrice:"",discount:"0",taxRate:"0",stockQuantity:"",minimumStock:"0",supplierId:"",imageUrl:"",notes:"",hasVariants:false});}\n  function openCustomerCreator(){setModuleError(null);setCustOpen(true);}\n  function handleCreateCustomer(){try{if(!custForm.name.trim())throw new Error("Customer name is required");store.createCustomer({name:custForm.name.trim(),phone:custForm.phone||null,whatsapp:custForm.whatsapp||null,email:custForm.email||null,address:custForm.address||null,birthday:custForm.birthday||null,notes:custForm.notes||null});setCustomers(store.listCustomers());setCustOpen(false);resetCustomerForm();setModuleError(null);void persistAndRefresh();}catch(error){setModuleError(error instanceof Error?error.message:String(error));}}\n  function handleCreateProduct(){try{if(!productForm.name.trim())throw new Error("Product name is required");store.createProduct({name:productForm.name.trim(),sku:productForm.sku||null,barcode:productForm.barcode||null,categoryId:productForm.categoryId||null,brand:productForm.brand||null,size:productForm.size||null,color:productForm.color||null,fabric:productForm.fabric||null,unit:productForm.unit||"pcs",costPrice:Number(productForm.costPrice)||0,sellingPrice:Number(productForm.sellingPrice)||0,discount:Number(productForm.discount)||0,taxRate:Number(productForm.taxRate)||0,stockQuantity:Number(productForm.stockQuantity)||0,minimumStock:Number(productForm.minimumStock)||0,supplierId:productForm.supplierId||null,imageUrl:productForm.imageUrl||null,notes:productForm.notes||null,isActive:true});setProducts(store.listProducts({lowStockOnly}));setProductOpen(false);resetProductForm();setModuleError(null);void persistAndRefresh();}catch(error){setModuleError(error instanceof Error?error.message:String(error));}}\n'''
          if marker not in s: raise SystemExit('early return marker not found')
          s=s.replace(marker,helper+marker,1)
          rep('header={{ showSearch: view !== "dashboard", title: view === "services" ? "Services & Orders" : view, subtitle: "Welcome back, Admin!", notificationCount: phase6Store.unreadNotificationCount(), messageCount: 3 }}','header={{showSearch:view!=="dashboard",title:view==="services"?"Services & Orders":view,subtitle:"Welcome back, Admin!",notificationCount:phase6Store.unreadNotificationCount(),messageCount:phase6Store.unreadNotificationCount(),onMessagesClick:()=>navTo("notifications"),onNotificationsClick:()=>navTo("notifications"),onCalendarClick:()=>navTo("reports")}}','header')
          rep('<ProductList products={products} categories={categories} lowStockOnly={lowStockOnly} onToggleLowStock={() => setLowStockOnly((v) => !v)} />','<ProductList products={products} categories={categories} lowStockOnly={lowStockOnly} onToggleLowStock={() => setLowStockOnly((v) => !v)} onAdd={()=>{resetProductForm();setProductOpen(true);}} />','product add')
          rep('<PosBilling products={products} customers={customers} onCompleteSale={handleSale} />','<PosBilling products={products} customers={customers} onAddCustomer={openCustomerCreator} onCompleteSale={handleSale} />','POS')
          rep('<OrderForm value={form} customers={customers} profiles={profiles} onChange={setForm} onLoadProfiles={(customerId) => setProfiles(ordersStore.listMeasurementProfiles(customerId))} onSubmit={handleCreateOrder} onCancel={() => setCreateOpen(false)} error={formError} />','<OrderForm value={form} customers={customers} profiles={profiles} onChange={setForm} onLoadProfiles={(customerId) => setProfiles(ordersStore.listMeasurementProfiles(customerId))} onAddCustomer={openCustomerCreator} onSubmit={handleCreateOrder} onCancel={() => setCreateOpen(false)} error={formError} />','order customer')
          rep('<LaundryForm mode={laundryMode || "outsourced"} customers={customers} suppliers={suppliers} onSubmit={handleCreateLaundry} onCancel={() => setLaundryMode(null)} error={laundryError} />','<LaundryForm mode={laundryMode || "outsourced"} customers={customers} suppliers={suppliers} onAddCustomer={openCustomerCreator} onSubmit={handleCreateLaundry} onCancel={() => setLaundryMode(null)} error={laundryError} />','laundry customer')
          # Simplify customer page to use global modal inserted below.
          start='    {view === "customers" && <><CustomerList customers={customers} onAdd={() => setCustOpen(true)} onSearch={(q) => setCustomers(store.listCustomers(q))} />'
          if start not in s: raise SystemExit('customer page start not found')
          a=s.index(start); b=s.index('</Modal></>}',a)+len('</Modal></>}')
          s=s[:a]+'    {view === "customers" && <CustomerList customers={customers} onAdd={openCustomerCreator} onSearch={(q)=>setCustomers(store.listCustomers(q))} />}'+s[b:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(release): finalize source'
          git push origin main
