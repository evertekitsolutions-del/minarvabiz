name: Minarva Biz backup path repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Repair path literal
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/desktop/electron/main.ts')
          s = p.read_text(encoding='utf-8')
          bad = 'fs.existsSync("D:\\\\\\\\\\\\\\")'
          # Replace the malformed literal with a portable root check.
          s2 = s.replace('fs.existsSync("D:\\\\\\\\\\\\\\")', 'fs.existsSync("D:/")')
          if s2 == s:
              s2 = s.replace('fs.existsSync("D:\\\\\\\\\\")', 'fs.existsSync("D:/")')
          if s2 == s:
              raise SystemExit('Expected malformed backup path literal was not found')
          p.write_text(s2, encoding='utf-8')
          if 'fs.existsSync("D:/")' not in s2:
              raise SystemExit('Repair verification failed')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/electron/main.ts
          git rm .github/workflows/minarva-fix-quote.yml
          git commit -m "fix: repair Windows backup drive check"
          git push origin main
