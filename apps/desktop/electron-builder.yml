electronVersion: 33.2.1
appId: com.evertek.minarvabiz
productName: Minarva Biz
copyright: Copyright © Evertek IT Solutions
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/dist/**/*
  - package.json
  - node_modules/sql.js/**/*
asar: true
asarUnpack:
  - "**/sql.js/**"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: MinarvaBiz-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Minarva Biz
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Minarva Biz
linux:
  target:
    - AppImage
  category: Office
extraMetadata:
  main: electron/dist/main.js

npmRebuild: false
buildDependenciesFromSource: false
